/* ── 18. 레일 폭 조절 ──────────────────────────────────────────── */
/* 환자 목록 폭은 뷰어마다 취향이 다를 수 있어 직접 늘리고 줄일 수 있게 합니다.
   상태(S)가 아니라 여기서만 관리합니다 — 서버도 없고 다른 뷰어와 공유할 값도
   아닌, 이 브라우저 안에서만 기억하면 되는 화면 설정이기 때문입니다. */

var RAIL_MIN = 260;
var RAIL_MAX = 560;
var RAIL_DEFAULT = 432;

function loadRailWidth() {
  try {
    var v = parseInt(localStorage.getItem('hjt-rail-w'), 10);
    if (v >= RAIL_MIN && v <= RAIL_MAX) return v;
  } catch (e) {}
  return RAIL_DEFAULT;
}
function saveRailWidth(v) {
  try { localStorage.setItem('hjt-rail-w', String(v)); } catch (e) {}
}
function setRailWidth(v) {
  v = Math.max(RAIL_MIN, Math.min(RAIL_MAX, Math.round(v)));
  document.documentElement.style.setProperty('--rail-w', v + 'px');
  var handle = document.querySelector('[data-resizer]');
  if (handle) handle.setAttribute('aria-valuenow', v);
  return v;
}
var railWidth = setRailWidth(loadRailWidth());

/* ── 19. 동작 ──────────────────────────────────────────────────── */

var scrollMem = {};
var threadToBottom = true;
var lastSheet = '';

function openRoom(id) {
  S.page = 'room';
  S.roomId = id;
  S.topic = 'all';
  S.draft = '';
  S.star = false;
  S.pendingFile = false;
  S.searchOpen = false;
  S.query = '';
  S.sheet = '';
  threadToBottom = true;
  delete scrollMem.thread;
}

/* 상태를 바꾸면 해당 탭으로 옮겨 어디로 갔는지 보이게 합니다 */
function toggleFlag(map, tabWhenOn) {
  var id = S.roomId;
  if (S[map][id]) { delete S[map][id]; S.tab = 'open'; }
  else { S[map][id] = true; S.tab = tabWhenOn; }
  S.sheet = '';
}

var ACTIONS = {
  noop: function () {},

  login: function () { S.page = isMobile() ? 'rooms' : 'room'; },
  logout: function () { S.page = 'login'; },
  goOnboard: function () { S.page = 'onboard'; S.onbStep = 1; S.onbLicense = ''; S.onbShot = false; },
  goAdmin: function () { S.page = 'admin'; S.adminTab = 'usage'; },
  goApp: function () { S.page = isMobile() ? 'rooms' : 'room'; },
  go: function (v) { S.page = v; S.sheet = ''; },

  onbNext: function () {
    if (S.onbStep === 3 && !S.onbLicense.trim()) return;
    S.onbStep = Math.min(S.onbStep + 1, 4);
  },
  onbShot: function () { S.onbShot = true; },
  onbDone: function () { S.page = isMobile() ? 'rooms' : 'room'; },

  adminTab: function (v) { S.adminTab = v; },
  auditF: function (v) { S.auditF = v; },

  tab: function (v) { S.tab = v; },
  open: function (v) { openRoom(v); },
  topic: function (v) { S.topic = v; threadToBottom = true; },
  panel: function (v) { S.panel = v; },
  togglePanel: function () { S.panelOpen = !S.panelOpen; },

  openSearch: function () { S.searchOpen = true; S.query = ''; },
  closeSearch: function () { S.searchOpen = false; S.query = ''; },
  clearGlobalQ: function () { S.globalQ = ''; },

  attach: function () { S.pendingFile = true; },
  clearFile: function () { S.pendingFile = false; },
  toggleStar: function () { S.star = !S.star; },

  send: function () {
    var text = S.draft.trim();
    if (!text && !S.pendingFile) return;
    var room = roomById(S.roomId);
    var tid = S.topic === 'all'
      ? (room.threads[room.threads.length - 1] || {}).id
      : S.topic;
    if (!tid) return;
    var key = room.id + tid;
    var msg = { who:S.me, when:'방금', body:text, star:S.star };
    if (S.pendingFile) { msg.file = 'knee_standing_AP.dcm'; msg.fileSize = '4.2MB · 환자 정보 삭제됨'; }
    S.sent[key] = (S.sent[key] || []).concat([msg]);
    room.last = text || '자료를 올렸습니다';
    room.when = '방금';
    S.draft = '';
    S.star = false;
    S.pendingFile = false;
    threadToBottom = true;
  },

  openNew: function () {
    S.sheet = 'new'; S.formTitle = ''; S.formOpen = true; S.showAllDocs = false;
    S.form = { pname:'', age:'', sex:'', part:'', city:'' };
  },
  openInvite: function () { S.sheet = 'invite'; S.showAllDocs = false; },
  openFiles: function () { S.sheet = 'files'; },
  openFileDetail: function (v) { S.fileId = v; S.sheet = 'file'; },
  openSummary: function () { S.sheet = 'summary'; },

  startVoice: function () { startCall('voice'); },
  startVideo: function () { startCall('video'); },
  toggleMute: function () { if (S.call) S.call.mute = !S.call.mute; },
  toggleCam: function () { if (S.call) S.call.cam = !S.call.cam; },
  endCall: function () { endCall(); },
  openMenu: function () { S.sheet = 'menu'; },
  closeSheet: function () { S.sheet = ''; },
  toggleForm: function () { S.formOpen = !S.formOpen; },
  showAllDocs: function () { S.showAllDocs = true; },
  pick: function (v) { S.picks[v] = !S.picks[v]; },
  fileFilter: function (v) { S.fileFilter = v; },

  submitSheet: function () {
    if (S.sheet === 'invite') {
      DOCTORS.forEach(function (d) {
        if (S.picks[d.k]) { S.joined[d.k] = true; delete S.removed[d.k]; }
      });
      S.sheet = '';
      return;
    }
    var title = S.formTitle.trim();
    if (!title) return;
    var f = S.form;
    var name = (f.pname || '').trim();
    var summary = [f.age ? f.age + '세' : '', f.sex ? f.sex.slice(0, 1) : '', f.part]
      .filter(Boolean).join(' · ');
    var id = 'n' + Date.now();
    S.extraRooms = [{
      id: id,
      name: name || ('이름 미입력' + (f.part ? ' · ' + f.part : '')),
      initial: name ? name.slice(0, 1) : '환',
      tone: 'steel',
      when: '방금',
      summary: summary || '정보 미입력',
      last: '방이 만들어졌습니다',
      chips: [f.age ? f.age + '세' : '나이 미입력', f.sex || '성별 미입력',
              f.part || '부위 미입력', f.city || '거주 미입력'],
      threads: [{ id:'t1', label: title.slice(0, 12) }]
    }].concat(S.extraRooms);
    openRoom(id);
    S.tab = 'all';
    S.formTitle = '';
  },

  removeMember: function (v) { S.removed[v] = true; },
  toggleClosed: function () { toggleFlag('closed', 'closed'); },
  toggleArchived: function () { toggleFlag('archived', 'archive'); },
  toggleTrashed: function () { toggleFlag('trashed', 'archive'); },
  exportRoom: function () { S.sheet = ''; },

  bannerAction: function () {
    var id = S.roomId;
    if (S.trashed[id]) { delete S.trashed[id]; return; }
    if (S.archived[id]) { delete S.archived[id]; return; }
    delete S.closed[id];
  },

  readAll: function () { S.notiRead = true; },
  toggle: function (v) { S.toggles[v] = !S.toggles[v]; },
  switchMe: function (v) { S.me = v; }
};

var INPUTS = {
  globalQ: function (val) { S.globalQ = val; },
  query: function (val) { S.query = val; },
  draft: function (val) { S.draft = val; },
  formTitle: function (val) { S.formTitle = val; },
  formField: function (val, arg) { S.form[arg] = val; },
  onbLicense: function (val) { S.onbLicense = val; }
};

/* ── 19-2. 통화 ─────────────────────────────────────────────────
   타이머는 1초마다 바뀌는 값이라 전체 재렌더 대신 해당 글자만 갈아 끼웁니다. */

var callTimer = null;
var callTick = null;

function startCall(kind) {
  if (S.call) return;
  var who = callTargetKey();
  S.call = { kind:kind, who:who, roomId:S.roomId, phase:'connecting', sec:0, mute:false, cam:true };
  S.sheet = '';

  clearTimeout(callTimer);
  callTimer = setTimeout(function () {
    if (!S.call) return;
    S.call.phase = 'live';
    render();
    clearInterval(callTick);
    callTick = setInterval(function () {
      if (!S.call || S.call.phase !== 'live') return;
      S.call.sec++;
      var el = document.querySelector('[data-call-timer]');
      if (el) el.textContent = callClock(S.call.sec);
    }, 1000);
  }, 1600);
}

function endCall() {
  var c = S.call;
  clearTimeout(callTimer);
  clearInterval(callTick);
  S.call = null;
  if (!c) { render(); return; }

  var p = PEOPLE[c.who] || PEOPLE.kim;
  var room = roomById(c.roomId);
  var label = (c.kind === 'video' ? '영상' : '음성') + ' 협진 통화';

  if (c.phase === 'live' && c.sec > 0) {
    var dur = callDuration(c.sec);
    /* 대화에 통화 기록을 남깁니다 — 무엇을 했는지 대화 안에서 이어 읽히도록 */
    var tid = (room.threads[room.threads.length - 1] || {}).id;
    if (tid) {
      var key = room.id + tid;
      S.sent[key] = (S.sent[key] || []).concat([{
        who: S.me, when:'방금', system:true,
        body: label + ' · ' + dur + ' · ' + PEOPLE[S.me].name + ' ↔ ' + p.name
      }]);
    }
    S.callLog[room.id] = (S.callLog[room.id] || []).concat([{ kind:c.kind, dur:dur, with:p.name }]);
    room.last = label + ' ' + dur;
    room.when = '방금';
    AUDIT_ROWS.unshift(['방금', PEOPLE[S.me].name, '통화',
      room.name + ' · ' + label + ' ' + dur, 'Web · 협진톡', 'call']);
  } else {
    AUDIT_ROWS.unshift(['방금', PEOPLE[S.me].name, '통화',
      room.name + ' · ' + label + ' 연결 취소', 'Web · 협진톡', 'call']);
  }
  threadToBottom = true;
  render();
}

/* ── 20. 렌더 ──────────────────────────────────────────────────── */

var app = document.getElementById('app');

function render() {
  var active = document.activeElement;
  var focusKey = active && active.dataset ? active.dataset.k : null;
  var caret = null;
  if (focusKey) { try { caret = active.selectionStart; } catch (e) { caret = null; } }

  app.querySelectorAll('[data-sk]').forEach(function (el) {
    scrollMem[el.dataset.sk] = el.scrollTop;
  });

  app.innerHTML = view();

  app.querySelectorAll('[data-sk]').forEach(function (el) {
    var k = el.dataset.sk;
    if (k === 'thread' && threadToBottom) { el.scrollTop = el.scrollHeight; return; }
    if (scrollMem[k] != null) el.scrollTop = scrollMem[k];
  });
  var thread = app.querySelector('[data-sk="thread"]');
  if (thread && threadToBottom) { thread.scrollTop = thread.scrollHeight; threadToBottom = false; }

  if (focusKey) {
    var el = app.querySelector('[data-k="' + focusKey + '"]');
    if (el) {
      el.focus({ preventScroll:true });
      if (caret != null) { try { el.setSelectionRange(caret, caret); } catch (e) {} }
    }
  } else if (S.sheet && S.sheet !== lastSheet) {
    var first = app.querySelector('.modal__body [data-k], .modal [data-act]');
    if (first) first.focus({ preventScroll:true });
  }
  lastSheet = S.sheet;
  syncHash();
}

/* ── 21. 이벤트 ────────────────────────────────────────────────── */

app.addEventListener('click', function (e) {
  var stop = e.target.closest('[data-stop]');
  var node = e.target.closest('[data-act]');
  if (!node) return;
  /* 모달 카드 안쪽 클릭은 오버레이 닫기로 새지 않게 합니다 */
  if (node.classList.contains('overlay') && stop) return;
  var act = node.dataset.act;
  if (!ACTIONS[act]) return;
  e.preventDefault();
  ACTIONS[act](node.dataset.arg);
  render();
});

app.addEventListener('input', function (e) {
  var el = e.target;
  if (!el.dataset || !el.dataset.input) return;
  var fn = INPUTS[el.dataset.input];
  if (!fn) return;
  fn(el.value, el.dataset.arg);
  render();
});

/* Esc는 포커스 위치와 무관하게 닫히도록 document에 답니다 */
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape') return;
  if (S.sheet) { S.sheet = ''; render(); return; }
  if (S.searchOpen) { ACTIONS.closeSearch(); render(); }
});

app.addEventListener('keydown', function (e) {
  var el = e.target;
  if (!el.dataset || !el.dataset.enter) return;
  if (e.key !== 'Enter' || e.shiftKey || e.isComposing) return;
  e.preventDefault();
  var spec = el.dataset.enter.split(':');
  ACTIONS[spec[0]](spec[1]);
  render();
});

/* 레일 폭 드래그. 픽셀 단위로 계속 바뀌는 값이라 render()를 통하지 않고
   CSS 변수를 직접 건드립니다 — 매 프레임 전체 HTML을 다시 그리면 무겁고,
   어차피 이 폭은 S(앱 상태)가 아니라 화면 설정이라 재렌더 대상이 아닙니다. */
app.addEventListener('pointerdown', function (e) {
  var handle = e.target.closest('[data-resizer]');
  if (!handle) return;
  e.preventDefault();
  var startX = e.clientX;
  var startW = railWidth;
  try { handle.setPointerCapture(e.pointerId); } catch (err) {}
  document.body.style.cursor = 'col-resize';
  document.body.style.userSelect = 'none';

  function onMove(ev) {
    railWidth = setRailWidth(startW + (ev.clientX - startX));
  }
  function onUp() {
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
    saveRailWidth(railWidth);
  }
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
});

/* 더블클릭으로 기본 폭으로 되돌립니다 */
app.addEventListener('dblclick', function (e) {
  if (!e.target.closest('[data-resizer]')) return;
  railWidth = setRailWidth(RAIL_DEFAULT);
  saveRailWidth(railWidth);
});

/* 키보드로도 조절할 수 있게 — 방향키 16px, Shift+방향키 48px, Home/End는 양끝 */
app.addEventListener('keydown', function (e) {
  var handle = e.target.closest('[data-resizer]');
  if (!handle) return;
  var step = e.shiftKey ? 48 : 16;
  if (e.key === 'ArrowLeft') { e.preventDefault(); railWidth = setRailWidth(railWidth - step); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); railWidth = setRailWidth(railWidth + step); }
  else if (e.key === 'Home') { e.preventDefault(); railWidth = setRailWidth(RAIL_MIN); }
  else if (e.key === 'End') { e.preventDefault(); railWidth = setRailWidth(RAIL_MAX); }
  else { return; }
  saveRailWidth(railWidth);
});

/* 레이아웃이 PC↔모바일을 넘나들 때만 다시 그립니다 */
var mq = window.matchMedia('(max-width: 1009px)');
var onMq = function () {
  if (!isMobile() && S.page === 'rooms') S.page = 'room';
  render();
};
if (mq.addEventListener) mq.addEventListener('change', onMq);
else mq.addListener(onMq);

/* ── 22. 해시 라우팅 ───────────────────────────────────────────── */

var PAGES = ['login','onboard','admin','rooms','room','search','notis','me'];
var hashLock = false;

function syncHash() {
  var want = '#/' + S.page + (S.page === 'room' ? '/' + S.roomId : '');
  if (location.hash !== want) {
    hashLock = true;
    history.replaceState(null, '', want);
    hashLock = false;
  }
}

function applyHash() {
  var parts = location.hash.replace(/^#\/?/, '').split('/');
  var page = parts[0];
  if (PAGES.indexOf(page) < 0) return false;
  if (page === 'room') {
    var id = parts[1];
    if (id && pool().some(function (r) { return r.id === id; })) S.roomId = id;
  }
  if (page === 'rooms' && !isMobile()) page = 'room';
  S.page = page;
  return true;
}

window.addEventListener('hashchange', function () {
  if (hashLock) return;
  if (applyHash()) render();
});

/* ── 23. 시작 ──────────────────────────────────────────────────── */

applyHash();
render();
</script>
