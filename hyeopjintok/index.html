/* ── 9. 레일 / 환자 목록 ───────────────────────────────────────── */

function roomRow(r, active) {
  /* 훑을 때 필요한 건 누구 · 뭐가 문제 · 내 차례인가 셋입니다.
     배지는 4번째 줄을 차지하지 않고 요약 줄 오른쪽에 붙습니다. */
  var marks = [];
  if (S.trashed[r.id]) marks.push('<span class="badge badge--danger">삭제 예정</span>');
  else if (S.archived[r.id]) marks.push('<span class="badge">보관됨</span>');
  else if (S.closed[r.id]) marks.push('<span class="badge">종료</span>');
  /* 문의가 1건이면 아무것도 말해주지 않으므로 2건부터 보여줍니다 */
  else if (r.threads.length > 1) marks.push('<span class="badge">문의 ' + r.threads.length + '</span>');

  var flag = r.unread && live(r)
    ? '<span class="badge badge--count">' + r.unread + '<span class="sr-only">건 안 읽음</span></span>'
    : (needsReply(r) ? '<span class="badge badge--warn">내 차례</span>' : '');

  return '<button type="button" class="' + cls('room-row', active && 'is-active') + '"'
    + ' data-act="open" data-arg="' + esc(r.id) + '"' + (active ? ' aria-current="true"' : '') + '>'
    + avatar(r.initial, r.tone)
    + '<span class="grow truncate" style="display:block">'
      + '<span class="room-row__top">'
        + '<span class="room-row__name truncate">' + esc(pname(r.name, r.id)) + '</span>'
        + '<span class="room-row__when num">' + esc(r.when) + '</span>'
      + '</span>'
      + '<span class="room-row__mid">'
        + '<span class="room-row__summary truncate">' + esc(r.summary) + '</span>'
        + marks.join('') + flag
      + '</span>'
      + '<span class="room-row__last truncate" style="display:block">' + esc(r.last) + '</span>'
    + '</span>'
  + '</button>';
}

/* 상태 탭.
   매일 쓰는 건 앞 세 개입니다. 다섯 개를 한 줄에 넣으려다 레일 폭이
   424px까지 밀려났었습니다 — 목록이 요구한 폭이 아니라 탭이 요구한 폭이었죠.
   종료·보관함은 더보기 안으로 넣고, 그 탭이 켜져 있을 때만 줄에 남깁니다. */
var PRIMARY_TABS = ['all', 'open', 'unread'];
var TAB_LABELS = { all:'전체', open:'진행 중', unread:'안 읽음', closed:'종료', archive:'보관함' };

function tabChip(key, counts) {
  var on = S.tab === key;
  return '<button type="button" class="' + cls('chip', on && 'is-active') + '"'
    + ' data-act="tab" data-arg="' + key + '" aria-pressed="' + on + '">'
    + esc(TAB_LABELS[key]) + ' <span class="num">' + counts[key] + '</span></button>';
}

function stateTabs() {
  var c = tabCounts();
  var extra = ['closed', 'archive'];
  var shown = PRIMARY_TABS.concat(extra.indexOf(S.tab) >= 0 ? [S.tab] : []);
  var hidden = extra.filter(function (k) { return k !== S.tab; });

  return shown.map(function (k) { return tabChip(k, c); }).join('')
    + (hidden.length
        ? '<div class="tabmenu" data-tabmenu>'
          + '<button type="button" class="' + cls('chip', 'chip--more', S.tabMenu && 'is-open') + '"'
            + ' data-act="toggleTabMenu" aria-expanded="' + !!S.tabMenu + '" aria-label="다른 상태 보기">'
            + ic('dots', 16) + '</button>'
          + (S.tabMenu
              ? '<div class="tabmenu__pop">'
                + hidden.map(function (k) {
                    return '<button type="button" class="tabmenu__item" data-act="tab" data-arg="' + k + '">'
                      + '<span class="grow">' + esc(TAB_LABELS[k]) + '</span>'
                      + '<span class="num" style="color:var(--ink-3)">' + c[k] + '</span>'
                    + '</button>';
                  }).join('')
              + '</div>'
              : '')
        + '</div>'
        : '');
}

function roomListBody() {
  var list = shownRooms();
  if (!list.length) {
    var titles = { archive:'보관한 대화가 없습니다', closed:'종료한 협진이 없습니다',
      unread:'안 읽은 대화가 없습니다', all:'대화가 없습니다', open:'진행 중인 협진이 없습니다' };
    var bodies = { archive:'보관하면 목록에서 숨기고 여기에 모입니다', closed:'종료해도 기록과 자료는 남습니다',
      unread:'새 메시지가 오면 여기에 표시됩니다', all:'새 협진 요청으로 시작하세요',
      open:'종료된 협진은 전체 또는 종료 탭에 있습니다' };
    return '<div class="empty-state">'
      + '<div class="empty-state__title">' + esc(titles[S.tab]) + '</div>'
      + '<div class="empty-state__body">' + esc(bodies[S.tab]) + '</div></div>';
  }
  return list.map(function (r) {
    return roomRow(r, r.id === S.roomId && (S.page === 'room' || !isMobile()));
  }).join('');
}

/* 맨 왼쪽 아이콘 레일. 갈 수 있는 곳을 한 줄로 세워 두는 자리입니다.
   모바일 하단 탭바와 목적지를 똑같이 맞춰, 화면 크기가 바뀌어도
   "어디로 가면 되는지"가 달라지지 않게 합니다. */
function navRailView() {
  var me = PEOPLE[S.me];
  var unread = S.notiRead ? 0 : NOTIS.filter(function (n) { return n.unread; }).length;
  var items = [
    { page:'home',   icon:'home',   label:'홈',   match:['home'] },
    { page:'rooms',  icon:'chat',   label:'협진', match:['rooms','room'] },
    { page:'search', icon:'search', label:'검색', match:['search'] },
    { page:'notis',  icon:'bell',   label:'알림', match:['notis'], dot:unread > 0 },
    { page:'admin',  icon:'shield', label:'운영자', match:['admin'] }
  ];
  return '<nav class="navrail" aria-label="주요 화면">'
    + '<div class="navrail__logo" aria-hidden="true">협</div>'
    + items.map(function (t) {
        var on = t.match.indexOf(S.page) >= 0;
        return '<button type="button" class="' + cls('navrail__item', on && 'is-active') + '"'
          + ' data-act="go" data-arg="' + t.page + '"' + (on ? ' aria-current="page"' : '')
          + ' aria-label="' + esc(t.label) + (t.dot ? ' · 읽지 않음 ' + unread + '건' : '') + '">'
          + ic(t.icon, 20)
          + '<span class="navrail__label">' + esc(t.label) + '</span>'
          + (t.dot ? '<span class="navrail__dot"></span>' : '')
        + '</button>';
      }).join('')
    + '<div class="grow"></div>'
    + '<button type="button" class="' + cls('navrail__item', S.page === 'me' && 'is-active') + '"'
      + ' data-act="go" data-arg="me" aria-label="내 정보 · ' + esc(me.name) + '">'
      + avatar(me.initial, me.tone, 'sm')
      + '<span class="navrail__label">내 정보</span>'
    + '</button>'
  + '</nav>';
}

function railView() {
  var c = tabCounts();
  return '<aside class="rail" aria-label="환자 목록">'
    + '<div class="rail__head">'
      + '<div class="grow"><div class="t2">협진</div>'
        + '<div class="t5" style="color:var(--ink-3);font-weight:500;letter-spacing:0">'
          + '진행 중 ' + c.open + '건 · 안 읽음 ' + c.unread + '건</div></div>'
    + '</div>'
    /* + 아이콘만 있으면 무슨 버튼인지 배워야 알 수 있습니다. 글자를 붙이고
       목록 맨 위 한 줄을 통째로 줍니다. 이 화면에서 가장 중요한 동작입니다. */
    + '<div class="rail__tools">'
      + '<button type="button" class="btn btn--primary rail__new" data-act="openNew">'
        + ic('plus', 18) + '새 협진 요청</button>'
      /* 여기서 타이핑해도 목록이 걸러지지 않아 헷갈렸습니다.
         검색은 검색 화면이 하는 일이므로 그리로 보내는 버튼으로 바꿉니다. */
      + '<button type="button" class="searchbox searchbox--btn" data-act="go" data-arg="search">'
        + ic('search', 18)
        + '<span class="grow truncate">환자 · 대화 · 자료 검색</span>'
      + '</button>'
    + '</div>'
    + '<div class="rail__tabs" role="group" aria-label="상태 필터">' + stateTabs() + '</div>'
    + '<div class="scroll" data-sk="rail" style="padding:0 var(--s4) var(--s4)">' + roomListBody() + '</div>'
  + '</aside>';
}

/* 모바일 전용 — 환자 목록 화면 */
function roomsScreen() {
  var unread = S.notiRead ? 0 : NOTIS.filter(function (n) { return n.unread; }).length;
  return '<div class="screen">'
    + '<div class="screen__head">'
      + '<div class="logo" aria-hidden="true">협</div>'
      + '<div class="grow"><div class="t2">협진톡</div></div>'
    + '</div>'
    + '<div style="flex:none;padding:var(--s4) var(--s4) 0">'
      + '<button type="button" class="btn btn--primary rail__new" data-act="openNew">'
        + ic('plus', 18) + '새 협진 요청</button>'
    + '</div>'
    + '<div class="rail__tabs" style="background:var(--surface);border-bottom:1px solid var(--line)"'
      + ' role="group" aria-label="상태 필터">' + stateTabs() + '</div>'
    + '<div class="screen__body" data-sk="rooms" style="padding:var(--s4)">' + roomListBody() + '</div>'
  + '</div>' + (unread ? '' : '');
}

/* ── 10. 협진 방 ───────────────────────────────────────────────── */

function visibleMsgs(room) {
  var active = S.topic === 'all' ? room.threads : room.threads.filter(function (t) { return t.id === S.topic; });
  var out = [];
  active.forEach(function (t) {
    threadMsgs(room.id, t.id).forEach(function (m) {
      var copy = {};
      for (var k in m) copy[k] = m[k];
      copy.topic = room.threads.length > 1 ? t.label : '';
      out.push(copy);
    });
  });
  var q = S.query.trim();
  if (S.searchOpen && q) {
    out = out.filter(function (m) {
      return (m.body || '').indexOf(q) >= 0 || (m.file || '').indexOf(q) >= 0 || (m.img || '').indexOf(q) >= 0;
    });
  }
  return out;
}

/* 데모: 마지막 메시지 두 개는 아직 안 읽은 것으로 둡니다.
   실제로는 서버가 참여자별 읽은 시점을 들고 있어야 합니다. */
function readCount(m) {
  if (m.system) return 0;
  var others = memberKeys().filter(function (k) { return k !== S.me; }).length;
  return m.unread ? 0 : others;
}

function msgView(m, prev) {
  var p = PEOPLE[m.who] || PEOPLE.han;
  var mine = m.who === S.me;
  var grouped = prev && prev.who === m.who && !m.day;
  /* 협진에서 제일 궁금한 건 "상대가 봤나"입니다. 답이 없을 때
     안 본 것과 보고 생각 중인 것을 구분할 수 있어야 합니다. */
  var readBy = mine ? readCount(m) : 0;
  var newTopic = !!m.topic && S.topic === 'all' && (!prev || prev.topic !== m.topic);
  var out = '';

  if (newTopic) {
    out += '<div class="divider-topic">'
      + '<span class="divider-topic__line divider-topic__line--short"></span>'
      + '<span class="divider-topic__label">' + esc(m.topic) + '</span>'
      + '<span class="divider-topic__line"></span></div>';
  } else if (m.day) {
    out += '<div class="divider-day"><span>' + esc(m.day) + '</span></div>';
  }

  /* 통화 기록 같은 시스템 줄은 말풍선이 아니라 가운데 한 줄로 남깁니다 */
  if (m.system) {
    return out + '<div class="msg-system">'
      + ic('phone', 13)
      + '<span>' + esc(m.body) + '</span>'
      + '<span class="num" style="color:var(--ink-3)">' + esc(m.when) + '</span>'
    + '</div>';
  }

  var linked = m.fileId ? fileById(S.roomId, m.fileId) : null;

  /* 첨부에 붙는 자동 계측 캡션. 의사가 쓴 소견과 섞이지 않게 '자동 계측' 배지를 답니다.
     값이 수정되면 여기 글자도 같이 바뀝니다 — 캡션을 계측값에서 만들기 때문입니다. */
  function captionTag(f) {
    if (!f) return '';
    var cap = captionOf(f);
    if (!cap) return '';
    return '<button type="button" class="bubble__caption" data-act="openViewer" data-arg="' + esc(f.id) + '">'
      + '<span class="badge--auto">' + captionKind(f) + '</span>'
      + '<span class="bubble__caption-text">' + esc(cap) + '</span>'
      + ic('next', 14)
    + '</button>';
  }

  var inner = '';
  /* 새 협진을 열 때 적은 환자 정보. 이름은 반드시 pname()을 거칩니다. */
  if (m.intro) {
    var head = [pname(m.intro.name, S.roomId), m.intro.age ? m.intro.age + '세' : '', m.intro.sex]
      .filter(Boolean).join(', ');
    if (head) inner += '<span class="bubble__intro">' + esc(head) + '</span>';
  }
  if (m.body) inner += esc(m.body).replace(/\n/g, '<br>');
  if (m.img) {
    inner += '<span class="bubble__media" style="' + (m.body ? 'margin-top:9px' : 'margin-top:0') + '" role="img"'
      + ' aria-label="' + esc(m.img) + '">'
      + '<span class="bubble__media-tag">' + esc(m.imgTag || '사진') + '</span>'
      + '<span class="t5" style="font-weight:500;letter-spacing:0;color:var(--ink-2)">' + esc(m.img) + '</span></span>';
    inner += captionTag(linked);
  }
  if (m.file) {
    inner += '<span class="bubble__file" style="' + (m.body ? 'margin-top:9px' : 'margin-top:0') + '">'
      + '<span class="bubble__file-icon">' + ic('file', 16) + '</span>'
      + '<span class="grow truncate" style="display:block">'
        + '<span class="bubble__file-name truncate">' + esc(m.file) + '</span>'
        + '<span class="bubble__file-meta truncate">' + esc(m.fileSize || '') + '</span>'
      + '</span></span>';
    inner += captionTag(linked);
  }

  /* 한 번에 올린 자료 묶음 */
  if (m.fileIds && m.fileIds.length) {
    var recs = m.fileIds.map(function (id) { return fileById(S.roomId, id); }).filter(Boolean);
    var removed = m.fileIds.length - recs.length;
    if (removed) {
      inner += '<span class="bubble__gone">' + esc('자료 ' + removed + '건이 삭제되었습니다') + '</span>';
    }
    if (recs.length) {
      inner += '<span class="' + cls('bubble__files', recs.length > 1 && 'is-grid') + '"'
        + ' style="' + (m.body ? 'margin-top:9px' : 'margin-top:0') + '">'
        + recs.map(function (f) {
            return '<button type="button" class="bubble__tile" data-act="openViewer" data-arg="' + esc(f.id) + '"'
              + ' aria-label="' + esc(nameOf(f)) + ' 크게 보기">'
              + (f.url
                  ? '<img class="bubble__tile-img" src="' + esc(f.url) + '" alt="">'
                  : '<span class="bubble__tile-ph">' + ic(tileIcon(f.tag), 20) + '</span>')
              + '<span class="bubble__tile-tag">' + esc(f.tag) + '</span>'
              /* 몇 장이든 이름은 늘 보입니다 — 무엇을 올렸는지 모르면 소용이 없습니다 */
              + '<span class="bubble__tile-name truncate">' + esc(nameOf(f)) + '</span>'
            + '</button>';
          }).join('')
      + '</span>';
      var part = (recs[0].info && recs[0].info.part) || '';
      if (part) {
        inner += '<span class="bubble__caption" style="pointer-events:none">'
          + '<span class="badge--auto">첨부 정보</span>'
          + '<span class="bubble__caption-text">' + esc(part) + '</span></span>';
      }
    }
  }

  out += '<div class="' + cls('msg', mine && 'msg--mine', grouped && !mine && 'msg--grouped') + '">'
    + (!mine && !grouped ? avatar(p.initial, p.tone, 'sm') : '')
    + '<div class="msg__col">'
      + (!mine && !grouped ? '<span class="msg__name">' + esc(p.name) + '</span>' : '')
      + '<div class="bubble">' + inner + '</div>'
      + '<div class="msg__meta">'
        + (m.star ? '<span class="msg__star">' + ic('star', 12, { fill:'currentColor', w:1 }) + ' 중요</span>' : '')
        + (mine
            ? '<span class="msg__read">' + (readBy
                ? '읽음 ' + readBy
                : '<span style="color:var(--ink-3)">안 읽음</span>') + '</span>'
            : '')
        + '<span class="msg__time num">' + esc(m.when) + '</span>'
      + '</div>'
    + '</div>'
  + '</div>';
  return out;
}

/* 협진 요약 카드. 종료 시점에 대화 맨 끝에 남고, 방 관리에서도 열어 볼 수 있습니다. */
function summaryBody(room) {
  var x = buildSummary(room);
  var n = 0;
  var head = function (title, sub) {
    n++;
    return '<div class="sum__h">'
      + '<span class="sum__num">' + n + '</span>'
      + '<span class="sum__h-title">' + esc(title) + '</span>'
      + (sub ? '<span class="sum__h-sub">' + esc(sub) + '</span>' : '')
    + '</div>';
  };
  var who = function (name, body) {
    var p = null;
    Object.keys(PEOPLE).forEach(function (k) { if (PEOPLE[k].name === name) p = PEOPLE[k]; });
    return '<div class="sum__say">'
      + (p ? avatar(p.initial, p.tone, 'sm') : '')
      + '<div class="sum__say-body">'
        + '<div class="sum__say-who">' + esc(name) + '</div>'
        + '<div class="sum__say-text">' + esc(body) + '</div>'
      + '</div>'
    + '</div>';
  };

  var metrics = [
    ['기간', x.span, 'cal'],
    ['대화', x.msgCount + '건', 'chat'],
    ['참여', x.members.length + '명', 'user'],
    ['자료', x.files.count + '건', 'image']
  ].map(function (m) {
    return '<div class="sum__stat">'
      + '<span class="sum__stat-k">' + ic(m[2], 14) + esc(m[0]) + '</span>'
      + '<span class="sum__stat-v">' + esc(m[1]) + '</span>'
    + '</div>';
  }).join('');

  var flow = x.threads.map(function (t) {
    return '<div class="sum__thread">'
      + '<div class="sum__thread-head">'
        + '<span class="sum__thread-name">' + esc(t.label) + '</span>'
        + '<span class="badge">' + t.count + '건</span>'
        + (t.files ? '<span class="badge">자료 ' + t.files + '</span>' : '')
        + (t.waiting ? '<span class="badge badge--danger">미응답</span>' : '')
      + '</div>'
      + who(t.openedBy, t.opened)
      + (t.closed ? who(t.closedBy, t.closed) : '')
    + '</div>';
  }).join('');

  var starred = x.starred.length
    ? x.starred.map(function (m) {
        return '<div class="sum__key">'
          + ic('star', 14, { fill:'currentColor', w:1 })
          + '<div><strong>' + esc(m.who) + '</strong>' + esc(m.body) + '</div>'
        + '</div>';
      }).join('')
    : '<p class="sum__muted">중요로 표시된 의견이 없습니다.</p>';

  var kinds = (x.files.kinds || '').split(' · ').filter(Boolean)
    .map(function (k) { return '<span class="badge">' + esc(k) + '</span>'; }).join('');

  return '<div class="sum">'
    + '<div class="sum__stats">' + metrics + '</div>'

    + head('어떻게 시작했나')
    + '<div class="sum__block">' + who(x.openedBy, x.opened) + '</div>'

    + head('어떻게 진행됐나', x.threads.length + '개 주제')
    + '<div class="sum__block">' + flow + '</div>'

    + head('핵심 의견', x.starred.length ? x.starred.length + '건' : '')
    + '<div class="sum__block sum__block--key">' + starred + '</div>'

    + (x.calls.length
        ? head('통화', x.calls.length + '건')
          + '<div class="sum__block">' + x.calls.map(function (c) {
              return '<div class="sum__line">' + ic('phone', 14)
                + '<span>' + esc(c.kind === 'video' ? '영상' : '음성') + ' · '
                + esc(c.dur) + ' · ' + esc(c.with) + '</span></div>';
            }).join('') + '</div>'
        : '')

    + head('남긴 자료', x.files.count + '건')
    + '<div class="sum__block">'
      + (kinds ? '<div class="sum__chips">' + kinds + '</div>' : '<p class="sum__muted">없음</p>')
      + (x.files.metrics
          ? '<p class="sum__meta">자동 추정 ' + x.files.metrics + '개'
            + (x.files.flagged ? ' · <span style="color:var(--warn);font-weight:600">눈여겨볼 값 '
                + x.files.flagged + '</span>' : '') + '</p>'
          : '')
    + '</div>'

    + head('남은 것')
    + (x.pending.length
        ? '<div class="sum__result sum__result--warn">' + ic('alert', 16)
          + '<span><strong>' + esc(x.pending.map(function (t) { return t.label; }).join(', ')) + '</strong>'
          + ' — 아직 답변이 없습니다.</span></div>'
        : '<div class="sum__result sum__result--ok">' + ic('checkc', 16)
          + '<span>답변을 기다리는 문의가 없습니다.</span></div>')

    + '<p class="sum__note">' + ic('list', 13)
      + '<span>대화에서 그대로 뽑아 정리한 내용입니다. 의무기록이 아니며, 진단·처방을 담지 않습니다.</span></p>'
  + '</div>';
}

function summaryCard(room) {
  return '<div class="sum-card">'
    + '<div class="sum-card__head">'
      + ic('list', 16)
      + '<span class="t4-strong grow">협진 요약</span>'
      + '<span class="badge--auto">자동 정리</span>'
    + '</div>'
    + summaryBody(room)
  + '</div>';
}

function topicBar(room) {
  if (S.searchOpen) {
    var hits = visibleMsgs(room).length;
    return '<div class="topic-bar"><div class="topic-bar__row">'
      + '<div class="searchbox grow" style="min-height:40px">' + ic('search', 18)
        + '<input type="search" data-k="roomq" data-input="query" value="' + esc(S.query) + '"'
        + ' style="height:40px" placeholder="이 방에서 검색" aria-label="이 방에서 검색" autofocus>'
        + (S.query.trim() ? '<span class="t5 num" style="flex:none;color:var(--ink-3)">' + hits + '건</span>' : '')
      + '</div>'
      + '<button type="button" class="btn btn--quiet" style="flex:none" data-act="closeSearch">취소</button>'
    + '</div></div>';
  }

  /* 문의가 하나뿐이면 나눌 게 없으므로 바를 아예 내립니다.
     방 목록이 '문의 1'을 숨기고 '문의 2'부터 보여주는 것과 같은 규칙입니다.
     검색은 문의 개수와 상관없는 기능이라 위에서 먼저 처리했습니다. */
  if (room.threads.length < 2) return '';

  var all = room.threads.reduce(function (n, t) { return n + threadMsgs(room.id, t.id).length; }, 0);
  var chips = [{ id:'all', label:'전체', auto:false, n:all }].concat(room.threads.map(function (t) {
    return { id:t.id, label:t.label, auto:true, n:threadMsgs(room.id, t.id).length };
  })).map(function (t) {
    var on = t.id === S.topic;
    return '<button type="button" class="' + cls('chip', on && 'is-active') + '"'
      + ' data-act="topic" data-arg="' + esc(t.id) + '" aria-pressed="' + on + '">'
      + esc(t.label)
      + (t.auto ? '<span class="badge--auto" style="' + (on ? 'color:var(--accent-ink);background:#fff' : '') + '">자동</span>' : '')
      + '<span class="num" style="' + (on ? 'color:rgba(255,255,255,.8)' : 'color:var(--ink-3)') + '">' + t.n + '</span>'
    + '</button>';
  }).join('');

  return '<div class="topic-bar">'
    + '<div class="topic-bar__row">'
      + '<div class="topic-bar__chips" role="group" aria-label="주제 필터">' + chips + '</div>'
      + (!S.autoSeen
          ? iconBtn('dismissAutoHint', '주제 자동 분류 안내 닫기', ic('x', 16), 'btn--quiet')
          : '')
    + '</div>'
    /* 자동 주제 분류는 이 서비스의 핵심인데 '자동' 두 글자로는 알 수 없습니다.
       처음 한 번만 설명하고, 닫으면 다시 뜨지 않습니다. */
    + (!S.autoSeen
        ? '<p class="topic-hint">' + ic('list', 14)
          + '<span>문의가 길어지면 <strong>시스템이 대화를 읽고 주제를 나눕니다.</strong> '
          + '나누는 기준은 대화 내용이고, 수동으로 문의를 나눌 필요가 없습니다.</span></p>'
        : '')
  + '</div>';
}

function roomView() {
  var room = roomById(S.roomId);
  var closed = !!S.closed[room.id], archived = !!S.archived[room.id], trashed = !!S.trashed[room.id];
  var banner = '';

  if (trashed || archived || closed) {
    var text = trashed ? '삭제 예정입니다. 30일 뒤 영구 삭제되며 그 전에는 복구할 수 있습니다.'
      : (archived ? '보관된 대화입니다. 목록에서는 숨겨지고 보관함과 검색에서 찾을 수 있습니다.'
      : '종료된 협진입니다. 기록과 자료는 그대로 남아 있습니다.');
    var action = trashed ? '복구' : (archived ? '보관 해제' : '다시 열기');
    banner = '<div class="' + cls('state-banner', trashed && 'state-banner--danger') + '">'
      + '<span class="state-banner__text">' + esc(text) + '</span>'
      + (closed && !trashed && !archived
          ? '<button type="button" class="state-banner__action" data-act="openSummary">요약</button>'
          : '')
      + '<button type="button" class="state-banner__action" data-act="bannerAction">' + esc(action) + '</button>'
    + '</div>';
  }

  var msgs = visibleMsgs(room);
  var thread;
  if (S.searchOpen && S.query.trim() && !msgs.length) {
    thread = '<div class="empty-state"><div class="empty-state__title">찾는 내용이 없습니다</div>'
      + '<div class="empty-state__body">다른 말로 검색해 보세요</div></div>';
  } else {
    thread = msgs.map(function (m, i) { return msgView(m, msgs[i - 1]); }).join('');
    /* 협진이 끝나면 그 시점까지의 대화를 정리해 맨 끝에 남깁니다 */
    if (closed && !S.searchOpen) thread += summaryCard(room);
    /* 진행 중이면 같은 자리에 종료 버튼을 둡니다 — 누르면 여기에 요약이 남습니다 */
    /* 상대 답을 기다리는 중에는 종료 버튼이 부담스럽습니다.
       내 차례가 아닐 때, 즉 대화가 한 바퀴 돌았을 때만 띄웁니다. */
    else if (!closed && !archived && !trashed && !S.searchOpen && msgs.length >= 2 && !needsReply(room)) {
      thread += '<div class="close-cta">'
        + '<span class="close-cta__line"></span>'
        + '<button type="button" class="btn btn--quiet close-cta__btn" data-act="askClose">'
          + ic('checkc', 18) + '협진 종료하기</button>'
        + '<span class="close-cta__line"></span>'
      + '</div>';
    }
  }

  var canSend = S.draft.trim().length > 0 || !!(S.pendingFile && S.pendingFile.items.length);

  return '<main class="main">'
    + banner
    + '<header class="room-header">'
      + (isMobile() ? iconBtn('go', '환자 목록으로', ic('back', 20), 'btn--quiet', 'rooms') : '')
      + avatar(room.initial, room.tone, 'md')
      + '<div class="room-header__title truncate">'
        + '<div class="t2 truncate">' + esc(pname(room.name, room.id)) + '</div>'
        + '<div class="t4 truncate">' + esc(room.chips.join(' · ')) + ' · 참여 ' + memberKeys().length + '명</div>'
      + '</div>'
      + '<div class="room-header__actions">'
        + iconBtn('openSearch', '이 방에서 검색', ic('search', 18), 'btn--quiet')
        + '<div class="tabmenu" data-tabmenu>'
          + '<button type="button" class="' + cls('btn', 'btn--icon', S.callMenu ? 'btn--on' : 'btn--quiet') + '"'
            + ' data-act="toggleCallMenu" aria-expanded="' + !!S.callMenu + '"'
            + ' aria-label="협진 통화" title="협진 통화">' + ic('phone', 18) + '</button>'
          + (S.callMenu
              ? '<div class="tabmenu__pop">'
                + '<button type="button" class="tabmenu__item" data-act="startVoice">'
                  + ic('phone', 16) + '<span class="grow">음성 통화</span></button>'
                + '<button type="button" class="tabmenu__item" data-act="startVideo">'
                  + ic('video', 16) + '<span class="grow">영상 통화</span></button>'
              + '</div>'
              : '')
        + '</div>'
        + (isMobile() ? '' : '<button type="button" class="' + cls('btn', 'btn--icon', S.panelOpen ? 'btn--on' : 'btn--quiet')
            + '" data-act="togglePanel" aria-pressed="' + S.panelOpen + '"'
            + ' aria-label="환자 정보 패널" title="환자 정보 패널">' + ic('panel', 18) + '</button>')
        + '<button type="button" class="btn btn--quiet room-header__more" data-act="openMenu">'
          + ic('dots', 18) + '<span class="room-header__more-label">방 관리</span></button>'
      + '</div>'
    + '</header>'
    + topicBar(room)
    + '<div class="thread" data-sk="thread" id="thread">' + thread + '</div>'
    + '<div class="composer">'
      + (S.lastDeleted
          ? '<div class="undo-bar">' + ic('trash', 16)
            + '<span class="grow truncate">' + esc(S.lastDeleted.name) + ' 을(를) 삭제했습니다</span>'
            + '<button type="button" class="link-btn" data-act="undeleteFile">되돌리기</button>'
            + iconBtn('dismissUndo', '닫기', ic('x', 16), '')
          + '</div>'
          : '')
      + (S.pendingFile && S.pendingFile.items.length
          ? '<div class="attach-pending">'
            + '<span class="pend-thumbs">'
              + S.pendingFile.items.slice(0, 4).map(function (x) {
                  return '<span class="pend-thumb" title="' + esc(x.name) + '">'
                    + (x.url ? '<img src="' + esc(x.url) + '" alt="">' : ic(tileIcon(x.tag), 14))
                  + '</span>';
                }).join('')
              + (S.pendingFile.items.length > 4
                  ? '<span class="pend-thumb pend-thumb--more">+' + (S.pendingFile.items.length - 4) + '</span>'
                  : '')
            + '</span>'
            + '<span class="grow truncate">'
              + '<strong>자료 ' + S.pendingFile.items.length + '건</strong> '
              + esc(S.pendingFile.items.map(function (x) { return x.desc || x.name; }).join(', '))
              + '<span class="t5" style="display:block;font-weight:500;letter-spacing:0">'
                + esc((S.pendingFile.part || '').trim() || '부위·소견 없음') + ' · 환자 정보 삭제됨</span>'
            + '</span>'
            + '<button type="button" class="link-btn" data-act="editPending" style="flex:none">고치기</button>'
            + iconBtn('clearFile', '첨부 취소', ic('x', 16), '') + '</div>'
          : '')
      + '<div class="composer__row">'
        + iconBtn('attach', '자료 첨부', ic('clip', 20), 'btn--quiet')
        + '<textarea class="composer__input" data-k="draft" data-input="draft" data-enter="send"'
          + ' placeholder="' + (closed ? '종료된 협진입니다. 다시 열면 이어서 쓸 수 있습니다' : '의견을 입력하세요') + '"'
          + ' aria-label="메시지 입력" rows="1">' + esc(S.draft) + '</textarea>'
        + '<button type="button" class="' + cls('btn', 'btn--icon', canSend ? 'btn--primary' : 'btn--primary is-disabled') + '"'
          + ' data-act="send" aria-label="보내기"' + (canSend ? '' : ' aria-disabled="true"') + '>' + ic('send', 18) + '</button>'
      + '</div>'
      + '<div class="composer__opts">'
        + '<button type="button" class="row" style="gap:var(--s2)" data-act="toggleStar"'
          + ' aria-pressed="' + S.star + '">'
          + '<span class="' + cls('check', 'check--star', S.star && 'is-on') + '">' + ic('check', 12, { w:2.6 }) + '</span>'
          + '<span class="t4' + (S.star ? '-strong' : '') + '" style="color:' + (S.star ? 'var(--warn)' : 'var(--ink-2)') + '">중요 표시</span>'
        + '</button>'
        + '<span class="grow"></span>'
        + '<span class="t5" style="color:var(--ink-3);font-weight:500;letter-spacing:0">자료 보관 기한 없음</span>'
      + '</div>'
    + '</div>'
  + '</main>';
}

/* ── 11. 환자 정보 · 자료 패널 ─────────────────────────────────── */

/* 격자용 썸네일 카드 */
function fileCard(f) {
  return '<button type="button" class="file-card" data-act="openViewer" data-arg="' + esc(f.id) + '"'
    + ' aria-label="' + esc(nameOf(f)) + ' 크게 보기">'
    + '<span class="file-card__thumb">'
      + (f.url ? '<img class="file-card__img" src="' + esc(f.url) + '" alt="">' : '')
      + '<span class="file-card__tag">' + esc(f.tag) + '</span>'
      + (isEdited(f) ? '<span class="file-card__edited">수정됨</span>' : '')
      + (f.url ? '' : '<span class="file-card__ph">' + ic(tileIcon(f.tag), 20) + '</span>')
    + '</span>'
    + '<span class="file-card__name truncate">' + esc(nameOf(f)) + '</span>'
  + '</button>';
}

/* 좁은 열(패널)용 가로 행. 카드보다 훨씬 잘 훑힙니다. */
function fileRow(f) {
  return '<button type="button" class="file-row" data-act="openViewer" data-arg="' + esc(f.id) + '"'
    + ' aria-label="' + esc(nameOf(f)) + ' 크게 보기">'
    + '<span class="file-row__thumb">'
      + (f.url ? '<img src="' + esc(f.url) + '" alt="">' : '')
      + '<span class="file-row__tag">' + esc(f.tag) + '</span>'
      + (isEdited(f) ? '<span class="viewer__item-dot"></span>' : '')
    + '</span>'
    + '<span class="file-row__text">'
      + '<span class="file-row__name truncate">' + esc(nameOf(f)) + '</span>'
      + '<span class="file-row__cap truncate">' + esc(captionOf(f) || f.when) + '</span>'
    + '</span>'
  + '</button>';
}

/* 계측표. 편집 모드면 값이 입력칸이 됩니다. */
function metricRows(f, editing) {
  return metricsOf(f).map(function (m, i) {
    if (editing) {
      var v = S.draftEdits[i] == null ? m[1] : S.draftEdits[i];
      return '<div class="metric-row metric-row--edit">'
        + '<label class="metric-row__k" for="mx' + i + '">' + esc(m[0]) + '</label>'
        + field({ k:'mx' + i, action:'metricEdit', arg:String(i), value:v, ph:'예: ' + m[1] })
      + '</div>';
    }
    var fg = m[2] === 'warn' ? 'var(--warn)' : (m[2] === 'ok' ? 'var(--ok)' : 'var(--ink-2)');
    return '<div class="metric-row">'
      + '<span class="metric-row__k">' + esc(m[0]) + '</span>'
      + '<span class="metric-row__v" style="color:' + fg + '">' + esc(m[1])
        + (m[4] ? ' <span class="metric-row__flag">수정됨</span>' : '') + '</span>'
    + '</div>';
  }).join('');
}

/* 목록에서 쓰는 요약형 계측표 (읽기 전용) */
function fileDetail(f) {
  return '<div class="file-detail">'
    + '<div class="file-detail__head">'
      + '<span class="badge">' + esc(f.tag) + '</span>'
      + '<span class="t3-strong grow truncate">' + esc(nameOf(f)) + '</span>'
      + (isEdited(f) ? '<span class="badge badge--warn">수정됨</span>' : '')
      + '<span class="t5" style="color:var(--ink-3);font-weight:500;letter-spacing:0">'
        + esc(f.when) + ' · ' + esc(f.size || '') + '</span>'
    + '</div>'
    + '<div class="metric-grid">' + metricRows(f, false) + '</div>'
    + (noteOf(f) ? '<p class="t4" style="margin:var(--s4) 0 0;color:var(--ink-2)">' + esc(noteOf(f)) + '</p>' : '')
    + '<button type="button" class="btn btn--quiet" style="width:100%;margin-top:var(--s5)"'
      + ' data-act="openViewer" data-arg="' + esc(f.id) + '">'
      + ic('expand', 16) + '크게 보기 · 계측 수정</button>'
  + '</div>';
}

/* 자료 뷰어 — 확대해 보고, 계측을 고치고, 고친 내역을 확인하는 한 화면 */
function viewerView() {
  if (!S.viewerId) return '';
  var rid = fileRoom(S.viewerId);
  var f = fileById(rid, S.viewerId);
  if (!f) return '';
  var list = filesOf(rid);
  var idx = list.map(function (x) { return x.id; }).indexOf(f.id);
  var hist = historyOf(f.id);
  var editing = S.editing;

  return '<div class="overlay viewer-overlay" data-act="closeViewer" role="dialog" aria-modal="true"'
      + ' aria-label="' + esc(f.name) + ' 자료 보기">'
    + '<div class="viewer" data-stop="1">'
      + '<div class="viewer__head">'
        + '<span class="badge">' + esc(f.tag) + '</span>'
        + '<div class="grow truncate">'
          + '<div class="t2 truncate">' + esc(nameOf(f)) + '</div>'
          + '<div class="t5" style="color:var(--ink-3);font-weight:500;letter-spacing:0">'
            + esc(pname(roomById(rid).name, rid)) + ' · ' + esc(f.when)
            + (f.size ? ' · ' + esc(f.size) : '')
            + (f.fileName && f.fileName !== f.name ? ' · ' + esc(f.fileName) : '') + '</div>'
        + '</div>'
        + iconBtn('closeViewer', '닫기', ic('x', 20), 'btn--quiet')
      + '</div>'

      + '<div class="viewer__body">'
        /* 왼쪽 리스트 — 이 방의 자료를 세워 두고 눌러서 바로 넘어갑니다 */
        + '<nav class="viewer__list" aria-label="이 방의 자료">'
          + '<div class="viewer__list-head">자료 ' + list.length + '건</div>'
          + list.map(function (x) {
              var on = x.id === f.id;
              return '<button type="button" class="' + cls('viewer__item', on && 'is-active') + '"'
                + ' data-act="openViewer" data-arg="' + esc(x.id) + '"'
                + (on ? ' aria-current="true"' : '') + '>'
                + '<span class="viewer__item-thumb">'
                  + (x.url ? '<img src="' + esc(x.url) + '" alt="">' : '')
                  + '<span class="viewer__item-tag">' + esc(x.tag) + '</span>'
                  + (isEdited(x) ? '<span class="viewer__item-dot" title="수정됨"></span>' : '')
                + '</span>'
                + '<span class="viewer__item-text">'
                  + '<span class="viewer__item-name truncate">' + esc(nameOf(x)) + '</span>'
                  + '<span class="viewer__item-when">' + esc(x.when) + '</span>'
                + '</span>'
              + '</button>';
            }).join('')
        + '</nav>'
        + '<div class="viewer__stage">'
          + '<div class="viewer__image">'
            + (f.url
                ? '<img class="viewer__img" src="' + esc(f.url) + '" alt="' + esc(nameOf(f)) + '">'
                : '<span class="t4" style="color:var(--ink-3)">' + esc(nameOf(f)) + '</span>')
            + '<span class="viewer__tag">' + esc(f.tag) + '</span>'
          + '</div>'
          + (list.length > 1
              ? '<div class="viewer__nav">'
                + '<button type="button" class="btn btn--icon btn--quiet" data-act="viewerPrev"'
                  + ' aria-label="이전 자료">' + ic('back', 20) + '</button>'
                + '<span class="t4 num">' + (idx + 1) + ' / ' + list.length + '</span>'
                + '<button type="button" class="btn btn--icon btn--quiet" data-act="viewerNext"'
                  + ' aria-label="다음 자료">' + ic('next', 20) + '</button>'
              + '</div>'
              : '')
        + '</div>'

        + '<div class="viewer__side">'
          + '<div class="viewer__side-head">'
            + '<span class="t5" style="color:var(--ink-3)">'
              + (f.metrics.length ? '자동 추정값 · 참고용' : '첨부 정보') + '</span>'
            + (isEdited(f) ? '<span class="badge badge--warn">수정됨</span>' : '')
            + '<span class="grow"></span>'
            + (editing
                ? ''
                : '<button type="button" class="link-btn" data-act="startEdit">'
                  + ic('pencil', 15) + '수정</button>')
          + '</div>'

          /* 이름·설명도 고칠 수 있어야 합니다. 자동으로 붙은 이름이 틀리면
             대화창 캡션과 자료 목록이 다 같이 틀린 채로 남기 때문입니다. */
          + (editing
              ? '<div class="viewer__fields">'
                + labeled('vname', '자료 이름', false,
                    field({ k:'vname', action:'fileName', value: S.draftName == null ? f.name : S.draftName,
                            ph:'예: 우측 기립 전후면' }))
                + '<div style="height:var(--s4)"></div>'
                + '<label class="field-label" for="vnote">설명 · 메모</label>'
                + '<textarea class="field-area" id="vnote" data-k="vnote" data-input="fileNote"'
                  + ' rows="3" placeholder="이 자료에 대해 남길 말을 적습니다">'
                  + esc(S.draftNote == null ? (f.note || '') : S.draftNote) + '</textarea>'
              + '</div>'
              : (f.info && infoLine(f.info)
                  ? '<div class="attach-info">'
                    + (f.info.part ? '<div class="metric-row"><span class="metric-row__k">부위 · 소견</span>'
                        + '<span class="metric-row__v">' + esc(f.info.part) + '</span></div>' : '')
                    + (f.info.desc ? '<div class="metric-row"><span class="metric-row__k">설명</span>'
                        + '<span class="metric-row__v">' + esc(f.info.desc) + '</span></div>' : '')
                  + '</div>'
                  : ''))

          + (editing || metricsOf(f).length
              ? '<div class="' + cls('metric-list', editing && 'is-editing') + '">'
                + (editing && f.metrics.length ? '<div class="field-label">계측값</div>' : '')
                + metricRows(f, editing) + '</div>'
              : '')
          + (metricsOf(f).length && !editing
              ? '<p class="auto-note"><b>이 값은 사진에서 어림한 참고값입니다.</b> '
                + '재는 방법이나 촬영 각도에 따라 달라지고, 진단 근거가 되지 않습니다. '
                + '틀린 값은 <b>수정</b>으로 직접 고치세요.</p>'
              : '')
          + (!f.metrics.length && !editing
              ? '<p class="field-hint">자동 추정값이 아직 없습니다. 올린 사람이 적은 정보만 있습니다.</p>'
              : '')
          + (editing
              ? '<p class="field-hint">고친 값은 대화창 캡션과 자료 목록에 함께 반영되고, '
                + '누가 언제 무엇을 바꿨는지 남습니다.</p>'
                + '<div class="viewer__edit-actions">'
                  + '<button type="button" class="btn btn--quiet" data-act="cancelEdit">취소</button>'
                  + '<button type="button" class="btn btn--primary grow" data-act="saveEdit">저장</button>'
                + '</div>'
                + '<button type="button" class="btn btn--danger viewer__delete" data-act="deleteFile">'
                  + ic('trash', 16) + '이 자료 삭제</button>'
                + '<p class="field-hint">30일 뒤 영구 삭제되며 그 전에는 되돌릴 수 있습니다.</p>'
              : (noteOf(f) ? '<p class="t4" style="margin:var(--s5) 0 0;color:var(--ink-2)">' + esc(noteOf(f)) + '</p>' : ''))

          + (hist.length
              ? '<div class="viewer__hist">'
                + '<button type="button" class="viewer__hist-toggle" data-act="toggleHist"'
                  + ' aria-expanded="' + S.histOpen + '">'
                  + ic('list', 15)
                  + '<span class="grow">수정 내역 ' + hist.length + '건</span>'
                  + ic(S.histOpen ? 'up' : 'down', 15)
                + '</button>'
                + (S.histOpen
                    ? '<ul class="viewer__hist-list">' + hist.map(function (h) {
                        return '<li class="viewer__hist-item">'
                          + '<div class="t5" style="color:var(--ink-3)">' + esc(h.when) + ' · ' + esc(h.who) + '</div>'
                          + '<div class="t4"><strong>' + esc(h.label) + '</strong> '
                            + '<span class="viewer__from">' + esc(h.from) + '</span> '
                            + ic('next', 12) + ' <strong>' + esc(h.to) + '</strong></div>'
                        + '</li>';
                      }).join('') + '</ul>'
                    : '')
              + '</div>'
              : '')

          + '<p class="viewer__note">자동으로 뽑은 계측값입니다. 값이 실제와 다르면 의사가 고칠 수 있으며, '
            + '판독과 진단은 의사가 합니다.</p>'
        + '</div>'
      + '</div>'
    + '</div>'
  + '</div>';
}

function panelView() {
  var room = roomById(S.roomId);
  var files = filesOf(room.id);
  var tabs = [['info','환자 정보'],['files','자료 ' + files.length]].map(function (t) {
    return '<button type="button" class="' + cls('panel__tab', S.panel === t[0] && 'is-active') + '"'
      + ' data-act="panel" data-arg="' + t[0] + '" aria-pressed="' + (S.panel === t[0]) + '">' + esc(t[1]) + '</button>';
  }).join('');

  var body;
  if (S.panel === 'info') {
    var members = memberKeys().map(function (k) {
      var p = PEOPLE[k];
      return '<div class="member-row">' + avatar(p.initial, p.tone, 'sm')
        + '<div class="grow truncate"><div class="t4-strong truncate">' + esc(p.name) + '</div>'
        + '<div class="t5 truncate" style="font-weight:500;letter-spacing:0;color:var(--ink-3)">' + esc(p.org) + '</div></div>'
        + (k === S.me
            ? '<span class="badge badge--accent" style="flex:none">나</span>'
            : iconBtn('askRemove', p.name + ' 방에서 제외', ic('x', 16), 'btn--quiet', k))
      + '</div>';
    }).join('');

    body = '<div class="panel__section">환자</div>'
      + '<div class="row" style="gap:var(--s2);margin-bottom:var(--s4)">'
        + '<span class="t2 grow truncate">' + esc(pname(room.name, room.id)) + '</span>'
        + (S.toggles.mask
            ? iconBtn('reveal', S.reveal[room.id] ? '이름 다시 가리기' : '이름 잠깐 보기',
                      ic(S.reveal[room.id] ? 'eyeoff' : 'eye', 17), 'btn--quiet', room.id)
            : '')
      + '</div>'
      + '<div class="row" style="flex-wrap:wrap;gap:var(--s2);margin-bottom:var(--s8)">'
        + room.chips.map(function (c) {
          return '<span class="badge" style="padding:5px 9px;border-radius:7px">' + esc(c) + '</span>';
        }).join('')
      + '</div>'
      + '<div class="panel__section">참여 의사 ' + memberKeys().length + '명</div>'
      + members
      + '<button type="button" class="btn btn--quiet" style="width:100%;margin-top:var(--s4)" data-act="openInvite">'
        + ic('userin', 18) + '의사 초대하기</button>';
  } else {
    body = analysisDigest(room.id)
      + '<div class="panel__section" style="margin-top:var(--s7)">자료 ' + files.length + '건</div>'
      + files.slice(0, 5).map(fileRow).join('')
      + '<button type="button" class="btn btn--quiet" style="width:100%;margin-top:var(--s4)" data-act="openFiles">'
        + '자료 분석 전체보기</button>'
      + '<div class="note-ok" style="margin-top:var(--s7)"><strong>보관 기한 없음</strong><br>삭제하기 전까지 그대로 남습니다.</div>';
  }

  return '<aside class="panel" aria-label="환자 정보와 자료">'
    + '<div class="panel__tabs" role="group">' + tabs + '</div>'
    + '<div class="panel__body" data-sk="panel">' + body + '</div>'
  + '</aside>';
}

/* ── 11-2. 홈 ──────────────────────────────────────────────────
   "지금 내가 볼 방이 어디냐"에만 답합니다. 자동 계측 요약과 자료 섬네일은
   홈에서 뺐습니다 — 방에 들어가면 어차피 다시 보이고, 홈에서는 판단할
   근거가 모자란 숫자라 오히려 오해를 만듭니다.

   문구는 한쪽 역할을 전제하지 않습니다. 같은 계정이 어떤 방에서는 묻고
   어떤 방에서는 답하므로, "내 답변 대기"가 아니라 "내 차례"라고 씁니다. */

function isStale(r) {
  /* 데모에는 실제 타임스탬프가 없어 목록 표기로 가늠합니다 */
  return /어제|일$|주$/.test(r.when || '');
}

function homeStats() {
  var list = pool().filter(live).filter(function (r) { return !S.closed[r.id]; });
  var waiting = list.filter(needsReply);
  return {
    open: list.length,
    waiting: waiting,
    unread: list.filter(function (r) { return r.unread; }).length,
    stale: waiting.filter(isStale).length
  };
}

function homeScreen() {
  var me = PEOPLE[S.me];
  var x = homeStats();

  /* 지표는 눌러서 그 목록으로 갈 수 있어야 지표입니다. */
  var cards = [
    { label:'진행 중 협진', n:x.open, unit:'건', act:'homeGo', arg:'open' },
    { label:'내 차례', n:x.waiting.length, unit:'건', act:'homeGo', arg:'open', tone:x.waiting.length ? 'warn' : '' },
    { label:'안 읽음', n:x.unread, unit:'건', act:'homeGo', arg:'unread', tone:x.unread ? 'danger' : '' },
    { label:'24시간 넘게 답 없음', n:x.stale, unit:'건', act:'homeGo', arg:'open', tone:x.stale ? 'danger' : '' }
  ].map(function (c) {
    var fg = c.tone === 'warn' ? 'var(--warn)' : (c.tone === 'danger' ? 'var(--danger)' : 'var(--ink-1)');
    return '<button type="button" class="stat-card stat-card--link" data-act="' + c.act + '" data-arg="' + c.arg + '">'
      + '<span class="stat-card__label">' + esc(c.label) + '</span>'
      + '<span class="stat-card__value" style="color:' + fg + '">' + c.n
        + '<span style="font-size:var(--t4);font-weight:600;margin-left:3px">' + esc(c.unit) + '</span></span>'
    + '</button>';
  }).join('');

  var waiting = x.waiting.length
    ? x.waiting.map(function (r) {
        return '<button type="button" class="result-row" data-act="open" data-arg="' + esc(r.id) + '">'
          + avatar(r.initial, r.tone)
          + '<span class="grow truncate" style="display:block">'
            + '<span class="t3-strong truncate" style="display:block">' + esc(pname(r.name, r.id)) + '</span>'
            + '<span class="room-row__summary truncate" style="display:block;margin:0">' + esc(r.summary) + '</span>'
            + '<span class="t4 truncate" style="display:block;color:var(--ink-3)">' + esc(r.last) + '</span>'
          + '</span>'
          + (isStale(r) ? '<span class="badge badge--danger">' + esc(r.when) + '부터</span>'
                        : '<span class="badge badge--warn">내 차례</span>')
          + ic('next', 18)
        + '</button>';
      }).join('')
    : '<div class="home-empty">' + ic('checkc', 22)
      + '<div><strong>지금 내 차례인 협진이 없습니다</strong>'
      + '<span>상대 선생님이 글을 남기면 여기에 가장 먼저 뜹니다</span></div></div>';

  return '<div class="screen">'
    + '<div class="screen__head">'
      + avatar(me.initial, me.tone, 'md')
      + '<div class="grow truncate">'
        + '<div class="t2 truncate">' + esc(me.name.replace(' 원장', '')) + ' 원장님</div>'
        + '<div class="t4 truncate">' + esc(me.org) + '</div>'
      + '</div>'
      + '<button type="button" class="btn btn--primary" data-act="openNew">'
        + ic('plus', 18) + '새 협진 요청</button>'
    + '</div>'
    + '<div class="screen__body" data-sk="home"><div class="home">'
      + '<div class="stat-grid">' + cards + '</div>'
      + '<section style="margin-top:var(--s9)">'
        + '<div class="row" style="justify-content:space-between;margin:0 0 var(--s4)">'
          + '<h2 class="sec-label" style="margin:0">내가 확인할 협진</h2>'
          + '<button type="button" class="link-btn" data-act="go" data-arg="rooms">전체 보기</button>'
        + '</div>'
        + waiting
      + '</section>'
      + '<p class="legal">협진톡 v2.0 · 초대 전용 폐쇄형 서비스 · '
        + '의료법 제34조에 따른 의료인 간 원격협력 도구입니다.</p>'
    + '</div></div>'
  + '</div>';
}

/* ── 12. 전역 검색 ─────────────────────────────────────────────── */

function searchResults() {
  var q = S.globalQ.trim();
  if (!q) return { patients:[], msgs:[], files:[] };
  var list = pool();
  var patients = list.filter(function (r) {
    return (r.name + ' ' + r.summary + ' ' + r.chips.join(' ')).indexOf(q) >= 0;
  });
  var msgs = [];
  list.forEach(function (r) {
    r.threads.forEach(function (t) {
      threadMsgs(r.id, t.id).forEach(function (m) {
        if ((m.body || '').indexOf(q) >= 0) {
          var p = PEOPLE[m.who] || PEOPLE.han;
          msgs.push({ rid:r.id, room:pname(r.name, r.id), who:p.name, when:m.when, body:m.body });
        }
      });
    });
  });
  var files = [];
  list.forEach(function (r) {
    filesOf(r.id).forEach(function (f) {
      if ((f.name + f.tag + captionOf(f) + r.name + r.summary).indexOf(q) >= 0) {
        files.push({ rec:f, room:pname(r.name, r.id) });
      }
    });
  });
  return { patients:patients, msgs:msgs.slice(0, 5), files:files.slice(0, 6) };
}

function searchScreen() {

var ATTACH_MAX = 10;

/* 파일 이름과 MIME으로 종류를 추론합니다. 의사가 매번 고르게 하지 않습니다. */
function tileIcon(tag) {
  if (tag === '영상') return 'video';
  if (tag === '문서' || tag === 'PDF') return 'file';
  if (tag === '사진') return 'image';
  return 'chart';
}

function inferTag(name, type) {
  var n = String(name || '').toLowerCase();
  if (/\.(dcm|dicom)$/.test(n)) return 'X-ray';
  if (/mri/.test(n)) return 'MRI';
  if (/(^|[^a-z])ct([^a-z]|$)/.test(n)) return 'CT';
  if (type && type.indexOf('video/') === 0) return '영상';
  if (type && type.indexOf('image/') === 0) return '사진';
  if (/\.(mp4|mov|avi|webm)$/.test(n)) return '영상';
  if (/\.(jpg|jpeg|png|heic|webp|gif)$/.test(n)) return '사진';
  if (/\.(pdf|docx?|hwp|txt)$/.test(n)) return '문서';
  if (/\.zip$/.test(n)) return 'MRI';
  return '자료';
}

function humanSize(n) {
  if (!n) return '';
  return n >= 1048576 ? (n / 1048576).toFixed(1) + 'MB' : Math.max(1, Math.round(n / 1024)) + 'KB';
}

/* 자료를 올릴 때 적는 것은 두 가지뿐입니다.
   이 묶음 전체에 붙는 부위·소견 하나, 그리고 자료마다 한 줄 설명.
   종류·측·시점을 따로 묻던 것은 칩이 14개나 되어 되레 걸림돌이었습니다 —
   좌우와 시점은 부위·소견 한 줄에 같이 쓰는 편이 빠릅니다. */
function attachSheetBody() {
  var a = S.attach || { part:'', items:[] };
  var items = a.items || [];

  var list = items.map(function (it, i) {
    return '<div class="up-item">'
      + '<div class="up-item__head">'
        + '<span class="up-item__thumb">'
          + (it.url
              ? '<img src="' + esc(it.url) + '" alt="">'
              : ic(tileIcon(it.tag), 20))
        + '</span>'

/* ── 16-2. 협진 통화 ────────────────────────────────────────────
   화면 흐름만 시연합니다. 시그널링 서버와 TURN이 없어 실제로 두 의사가
   연결되지는 않으며, 그 사실을 화면 안에 적어 둡니다. */

function callTargetKey() {
  var keys = memberKeys().filter(function (k) { return k !== S.me; });
  return keys[0] || 'kim';
}

function callDuration(sec) {
  var m = Math.floor(sec / 60), r = sec % 60;
  return m + '분 ' + (r < 10 ? '0' + r : r) + '초';
}
function callClock(sec) {
  var m = Math.floor(sec / 60), r = sec % 60;
  return (m < 10 ? '0' + m : m) + ':' + (r < 10 ? '0' + r : r);
}

function callView() {

  var stage = video && !connecting
    ? '<div class="call__stage">'
        + '<div class="call__remote">'

  var controls = [

    video ? { act:'toggleCam', on:!c.cam, icon: c.cam ? 'video' : 'videoOff', label: c.cam ? '카메라 끄기' : '카메라 켜기' } : null
  ].filter(Boolean).map(function (b) {
    return '<button type="button" class="' + cls('call__btn', b.on && 'is-off') + '"'
      + ' data-act="' + b.act + '" aria-pressed="' + !!b.on + '" aria-label="' + esc(b.label) + '">'
      + ic(b.icon, 22) + '</button>';
  }).join('');

  return '<div class="' + cls('call', video && 'call--video') + '" role="dialog" aria-modal="true"'
    + ' aria-label="협진 통화">'

      + '<span class="call__room truncate">' + esc(pname(room.name, room.id)) + '</span>'

        + ic('phoneOff', 22) + '</button>'

      + '통화 시각과 참여자는 감사 로그에 남습니다.</p>'

/* ── 18. 레일 폭 조절 ──────────────────────────────────────────── */
/* 환자 목록 폭은 뷰어마다 취향이 다를 수 있어 직접 늘리고 줄일 수 있게 합니다.
   상태(S)가 아니라 여기서만 관리합니다 — 서버도 없고 다른 뷰어와 공유할 값도
   아닌, 이 브라우저 안에서만 기억하면 되는 화면 설정이기 때문입니다. */

var COLS = {
  rail:  { min:260, max:560, def:320, cssVar:'--rail-w',  key:'hjt-rail-w',  dir:1 },
  panel: { min:260, max:480, def:320, cssVar:'--panel-w', key:'hjt-panel-w', dir:-1 }
};
var colWidth = {};

function loadColWidth(name) {
  var c = COLS[name];
  try {
    var v = parseInt(localStorage.getItem(c.key), 10);
    if (v >= c.min && v <= c.max) return v;
  } catch (e) {}
  return c.def;
}
function saveColWidth(name) {
  try { localStorage.setItem(COLS[name].key, String(colWidth[name])); } catch (e) {}
}
function setColWidth(name, v) {
  var c = COLS[name];
  v = Math.max(c.min, Math.min(c.max, Math.round(v)));
  document.documentElement.style.setProperty(c.cssVar, v + 'px');
  var handle = document.querySelector('[data-resizer="' + name + '"]');
  if (handle) handle.setAttribute('aria-valuenow', v);
  colWidth[name] = v;
  return v;
}
Object.keys(COLS).forEach(function (k) { setColWidth(k, loadColWidth(k)); });

}

/* 상태를 바꾸면 해당 탭으로 옮겨 어디로 갔는지 보이게 합니다 */
function toggleFlag(map, tabWhenOn) {
  var id = S.roomId;
  if (S[map][id]) { delete S[map][id]; S.tab = 'open'; }
  else { S[map][id] = true; S.tab = tabWhenOn; }
  S.sheet = '';
}

var ACTIONS = {
  noop: function () {},

  login: function () { S.page = 'home'; },
  logout: function () { S.page = 'login'; },
  goOnboard: function () { S.page = 'onboard'; S.onbStep = 1; S.onbLicense = ''; S.onbShot = false; },
  goAdmin: function () { S.page = 'admin'; S.adminTab = 'usage'; },
  goApp: function () { S.page = 'home'; },
  go: function (v) {
    /* PC에는 목록이 늘 왼쪽에 있으므로 '협진'은 곧 방 화면입니다.
       'rooms'로 두면 방 화면인데도 환자 정보 패널이 사라집니다. */
    if (v === 'rooms' && !isMobile()) v = 'room';
    S.page = v; S.sheet = '';
  },

  onbNext: function () {
    if (S.onbStep === 3 && !S.onbLicense.trim()) return;
    S.onbStep = Math.min(S.onbStep + 1, 4);
  },
  onbShot: function () { S.onbShot = true; },
  onbDone: function () { S.page = 'home'; },

  adminTab: function (v) { S.adminTab = v; },
  auditF: function (v) { S.auditF = v; },

  tab: function (v) { S.tab = v; S.tabMenu = false; },
  toggleTabMenu: function () { S.tabMenu = !S.tabMenu; },
  toggleCallMenu: function () { S.callMenu = !S.callMenu; },
  dismissAutoHint: function () { S.autoSeen = true; },
  open: function (v) { openRoom(v); },
  topic: function (v) { S.topic = v; threadToBottom = true; },
  panel: function (v) { S.panel = v; },
  togglePanel: function () { S.panelOpen = !S.panelOpen; },

  openSearch: function () { S.searchOpen = true; S.query = ''; },
  closeSearch: function () { S.searchOpen = false; S.query = ''; },
  clearGlobalQ: function () { S.globalQ = ''; },

  attach: function () {
    if (!S.attach) S.attach = { part:'', items:[] };
    S.sheet = 'attach';
  },
  pickFiles: function () {
    var el = document.getElementById('attach-input');
    if (el) el.click();
  },
  attachRemove: function (v) {
    if (!S.attach) return;
    S.attach.items.splice(parseInt(v, 10), 1);
    S.attachOver = 0;
  },
  attachClear: function () { if (S.attach) S.attach.items = []; S.attachOver = 0; },
  clearFile: function () { S.pendingFile = null; },
  editPending: function () {
    if (S.pendingFile) { S.attach = S.pendingFile; S.sheet = 'attach'; }
  },
  toggleStar: function () { S.star = !S.star; },

  send: function () {
    var text = S.draft.trim();
    if (!text && !S.pendingFile) return;
    var room = roomById(S.roomId);
    var tid = S.topic === 'all'
      ? (room.threads[room.threads.length - 1] || {}).id
      : S.topic;
    if (!tid) return;
    var key = room.id + tid;
    var msg = { who:S.me, when:'방금', body:text, star:S.star, unread:true };
    var a = S.pendingFile;
    if (a && a.items && a.items.length) {
      /* 올린 자료를 이 방의 자료 목록에 등록하고 메시지에 연결합니다 —
         그래야 대화창, 패널, 자료 분석, 뷰어에서 모두 같은 것을 봅니다. */
      var part = (a.part || '').trim();
      var stamp = Date.now();
      var recs = a.items.map(function (it, i) {
        return {

          note: '올린 사람이 적은 정보입니다. 자동 추정값은 아직 없습니다.'
        };
      });
      S.extraFiles[room.id] = (S.extraFiles[room.id] || []).concat(recs);
      msg.fileIds = recs.map(function (r) { return r.id; });
    }
    S.sent[key] = (S.sent[key] || []).concat([msg]);
    room.last = text || (a && a.items ? '자료 ' + a.items.length + '건 올렸습니다' : '자료를 올렸습니다');

  },

  homeGo: function (v) { S.tab = v; S.page = isMobile() ? 'rooms' : 'room'; },
  openNew: function () {

       있다가 그릴 때 pname()을 거칩니다. */
    S.sent[id + 't1'] = [{

function stepViewer(dir) {

}

/* 실행 뒤 다시 그리면 안 되는 동작 */

/* ── 19-2. 통화 ─────────────────────────────────────────────────
   타이머는 1초마다 바뀌는 값이라 전체 재렌더 대신 해당 글자만 갈아 끼웁니다. */

var callTimer = null;
var callTick = null;

function startCall(kind) {
  if (S.call) return;
  var who = callTargetKey();
  S.call = { kind:kind, who:who, roomId:S.roomId, phase:'connecting', sec:0, mute:false, cam:true };
  S.sheet = '';

  clearTimeout(callTimer);
  callTimer = setTimeout(function () {
    if (!S.call) return;
    S.call.phase = 'live';
    render();
    clearInterval(callTick);
    callTick = setInterval(function () {
      if (!S.call || S.call.phase !== 'live') return;
      S.call.sec++;
      var el = document.querySelector('[data-call-timer]');
      if (el) el.textContent = callClock(S.call.sec);
    }, 1000);
  }, 1600);
}

function endCall() {
  var c = S.call;
  clearTimeout(callTimer);
  clearInterval(callTick);
  S.call = null;
  if (!c) { render(); return; }

  var p = PEOPLE[c.who] || PEOPLE.kim;
  var room = roomById(c.roomId);
  var label = (c.kind === 'video' ? '영상' : '음성') + ' 협진 통화';

  if (c.phase === 'live' && c.sec > 0) {
    var dur = callDuration(c.sec);
    /* 대화에 통화 기록을 남깁니다 — 무엇을 했는지 대화 안에서 이어 읽히도록 */
    var tid = (room.threads[room.threads.length - 1] || {}).id;
    if (tid) {
      var key = room.id + tid;
      S.sent[key] = (S.sent[key] || []).concat([{
        who: S.me, when:'방금', system:true,
        body: label + ' · ' + dur + ' · ' + PEOPLE[S.me].name + ' ↔ ' + p.name
      }]);
    }
    S.callLog[room.id] = (S.callLog[room.id] || []).concat([{ kind:c.kind, dur:dur, with:p.name }]);
    room.last = label + ' ' + dur;
    room.when = '방금';
    AUDIT_ROWS.unshift(['방금', PEOPLE[S.me].name, '통화',
      room.name + ' · ' + label + ' ' + dur, 'Web · 협진톡', 'call']);
  } else {
    AUDIT_ROWS.unshift(['방금', PEOPLE[S.me].name, '통화',
      room.name + ' · ' + label + ' 연결 취소', 'Web · 협진톡', 'call']);
  }
  threadToBottom = true;
  render();
}

/* ── 20. 렌더 ──────────────────────────────────────────────────── */

var app = document.getElementById('app');

/* ── 다시 그리기 ────────────────────────────────────────────────
   글을 쓰는 중에는 innerHTML을 통째로 갈아끼우면 안 됩니다.
   입력칸이 새로 만들어지면서 조합 중이던 한글이 끊기고,
   "수술"이 "수르 ㅣ"처럼 자모로 흩어집니다.
   그래서 입력 중에는 살아 있는 입력칸만 비켜 가며 바꿉니다. */

function syncAttrs(oldEl, newEl, isLive) {
  for (var i = 0; i < newEl.attributes.length; i++) {
    var a = newEl.attributes[i];
    /* 값은 사용자가 쥐고 있으므로 덮어쓰지 않습니다 */
    if (isLive && (a.name === 'value' || a.name === 'checked')) continue;
    if (oldEl.getAttribute(a.name) !== a.value) oldEl.setAttribute(a.name, a.value);
  }
  for (var j = oldEl.attributes.length - 1; j >= 0; j--) {
    var b = oldEl.attributes[j];
    if (!newEl.hasAttribute(b.name)) oldEl.removeAttribute(b.name);
  }
}

function morph(oldNode, newNode, keep) {
  if (oldNode === keep) { syncAttrs(oldNode, newNode, true); return; }
  if (oldNode.nodeType !== newNode.nodeType || oldNode.nodeName !== newNode.nodeName) {
    oldNode.replaceWith(newNode); return;
  }
  if (oldNode.nodeType === 3 || oldNode.nodeType === 8) {
    if (oldNode.nodeValue !== newNode.nodeValue) oldNode.nodeValue = newNode.nodeValue;
    return;
  }
  if (oldNode.nodeType !== 1) return;
  /* 살아 있는 입력칸이 없는 가지는 통째로 바꿔도 됩니다 */
  if (!oldNode.contains(keep)) { oldNode.replaceWith(newNode); return; }

  syncAttrs(oldNode, newNode, false);
  var oc = Array.prototype.slice.call(oldNode.childNodes);
  var nc = Array.prototype.slice.call(newNode.childNodes);
  var n = Math.max(oc.length, nc.length);
  for (var i = 0; i < n; i++) {
    if (!nc[i]) { if (oc[i] && !oc[i].contains(keep)) oldNode.removeChild(oc[i]); continue; }
    if (!oc[i]) { oldNode.appendChild(nc[i]); continue; }
    morph(oc[i], nc[i], keep);
  }
}

function render() {
  var active = document.activeElement;
  var focusKey = active && active.dataset ? active.dataset.k : null;
  var live = focusKey && active.dataset.input != null && app.contains(active) ? active : null;
  var caret = null;
  if (focusKey && !live) { try { caret = active.selectionStart; } catch (e) { caret = null; } }

  app.querySelectorAll('[data-sk]').forEach(function (el) {
    scrollMem[el.dataset.sk] = el.scrollTop;
  });

  if (live) {
    var next = document.createElement('div');
    next.innerHTML = view();
    morph(app, next, live);
    app.className = 'app';
  } else {
    app.innerHTML = view();
  }

  app.querySelectorAll('[data-sk]').forEach(function (el) {
    var k = el.dataset.sk;
    if (k === 'thread' && threadToBottom) { el.scrollTop = el.scrollHeight; return; }
    if (scrollMem[k] != null) el.scrollTop = scrollMem[k];
  });
  var thread = app.querySelector('[data-sk="thread"]');
  if (thread && threadToBottom) { thread.scrollTop = thread.scrollHeight; threadToBottom = false; }

  if (focusKey && !live) {
    var el = app.querySelector('[data-k="' + focusKey + '"]');
    if (el) {
      el.focus({ preventScroll:true });
      if (caret != null) { try { el.setSelectionRange(caret, caret); } catch (e) {} }
    }
  } else if (!live && S.sheet && S.sheet !== lastSheet) {
    var first = app.querySelector('.modal__body [data-k], .modal [data-act]');
    if (first) first.focus({ preventScroll:true });
  }
  lastSheet = S.sheet;
  syncHash();
}

/* ── 21. 이벤트 ────────────────────────────────────────────────── */

app.addEventListener('click', function (e) {
  var stop = e.target.closest('[data-stop]');
  var node = e.target.closest('[data-act]');
  /* 더보기 메뉴는 바깥을 누르면 닫힙니다 */
  if ((S.tabMenu || S.callMenu) && !e.target.closest('[data-tabmenu]')) {
    S.tabMenu = false; S.callMenu = false;
    if (!node) { render(); return; }
  }
  if (!node) return;
  /* 모달 카드 안쪽 클릭은 오버레이 닫기로 새지 않게 합니다 */
  if (node.classList.contains('overlay') && stop) return;
  var act = node.dataset.act;
  if (!ACTIONS[act]) return;
  e.preventDefault();
  ACTIONS[act](node.dataset.arg);
  /* 파일 대화상자를 연 직후 다시 그리면 그 input이 DOM에서 떨어져 나가고,
     사용자가 고른 파일이 change로 돌아오지 못합니다. */
  if (NO_RENDER[act]) return;
  render();
});

/* 한글 IME 대응.
   입력마다 render()가 innerHTML을 갈아끼우면 조합 중인 입력칸이 새로 만들어져
   조합이 끊깁니다 — "안녕"이 "ㅇㅏㄴㄴㅕㅇ"으로 확정되던 원인입니다.
   조합 중에는 상태만 갱신하고 다시 그리지 않다가, 조합이 끝나면 그립니다. */
var composing = false;

/* 진짜 파일을 고릅니다. 브라우저 안에서만 도니까 서버가 없어도 됩니다.
   FileList는 다시 그리면 사라지므로 고르는 즉시 필요한 것만 뽑아 상태에 넣습니다. */
app.addEventListener('change', function (e) {
  var el = e.target;
  if (!el.dataset || el.dataset.filepick === undefined) return;
  if (!S.attach) S.attach = { part:'', items:[] };
  var room = 0;
  Array.prototype.slice.call(el.files || []).forEach(function (f) {
    if (S.attach.items.length >= ATTACH_MAX) { room++; return; }
    var isImg = f.type && f.type.indexOf('image/') === 0;
    S.attach.items.push({
      name: f.name,
      tag: inferTag(f.name, f.type),
      size: humanSize(f.size),
      desc: '',
      url: isImg ? URL.createObjectURL(f) : ''
    });
  });
  S.attachOver = room || 0;
  el.value = '';
  render();
});

app.addEventListener('compositionstart', function () { composing = true; });

app.addEventListener('compositionend', function (e) {
  composing = false;
  var el = e.target;
  if (!el.dataset || !el.dataset.input) return;
  var fn = INPUTS[el.dataset.input];
  if (!fn) return;
  fn(el.value, el.dataset.arg);
  render();
});

app.addEventListener('input', function (e) {
  var el = e.target;
  if (!el.dataset || !el.dataset.input) return;
  var fn = INPUTS[el.dataset.input];
  if (!fn) return;
  fn(el.value, el.dataset.arg);
  render();
});

/* Esc는 포커스 위치와 무관하게 닫히도록 document에 답니다 */
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape') return;
  if (S.viewerId) { ACTIONS.closeViewer(); render(); return; }
  if (S.sheet) { S.sheet = ''; render(); return; }
  if (S.searchOpen) { ACTIONS.closeSearch(); render(); }
});

app.addEventListener('keydown', function (e) {
  var el = e.target;
  if (!el.dataset || !el.dataset.enter) return;
  if (e.key !== 'Enter' || e.shiftKey || e.isComposing || composing || e.keyCode === 229) return;
  e.preventDefault();
  var spec = el.dataset.enter.split(':');
  ACTIONS[spec[0]](spec[1]);
  render();
});

/* 레일 폭 드래그. 픽셀 단위로 계속 바뀌는 값이라 render()를 통하지 않고
   CSS 변수를 직접 건드립니다 — 매 프레임 전체 HTML을 다시 그리면 무겁고,
   어차피 이 폭은 S(앱 상태)가 아니라 화면 설정이라 재렌더 대상이 아닙니다. */
app.addEventListener('pointerdown', function (e) {
  var handle = e.target.closest('[data-resizer]');
  if (!handle) return;
  e.preventDefault();
  var name = handle.dataset.resizer;
  var dir = COLS[name].dir;
  var startX = e.clientX;
  var startW = colWidth[name];
  try { handle.setPointerCapture(e.pointerId); } catch (err) {}
  document.body.style.cursor = 'col-resize';
  document.body.style.userSelect = 'none';

  function onMove(ev) {
    setColWidth(name, startW + (ev.clientX - startX) * dir);
  }
  function onUp() {
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
    saveColWidth(name);
  }
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
});

/* 더블클릭으로 기본 폭으로 되돌립니다 */
app.addEventListener('dblclick', function (e) {
  var handle = e.target.closest('[data-resizer]');
  if (!handle) return;
  var name = handle.dataset.resizer;
  setColWidth(name, COLS[name].def);
  saveColWidth(name);
});

/* 키보드로도 조절할 수 있게 — 방향키 16px, Shift+방향키 48px, Home/End는 양끝 */
app.addEventListener('keydown', function (e) {
  var handle = e.target.closest('[data-resizer]');
  if (!handle) return;
  var name = handle.dataset.resizer, c = COLS[name];
  var step = (e.shiftKey ? 48 : 16) * c.dir;
  if (e.key === 'ArrowLeft') { e.preventDefault(); setColWidth(name, colWidth[name] - step); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); setColWidth(name, colWidth[name] + step); }
  else if (e.key === 'Home') { e.preventDefault(); setColWidth(name, c.dir > 0 ? c.min : c.max); }
  else if (e.key === 'End') { e.preventDefault(); setColWidth(name, c.dir > 0 ? c.max : c.min); }
  else { return; }
  saveColWidth(name);
});

/* 레이아웃이 PC↔모바일을 넘나들 때만 다시 그립니다 */
var mq = window.matchMedia('(max-width: 1009px)');
var onMq = function () {
  if (!isMobile() && S.page === 'rooms') S.page = 'room';
  render();
};
if (mq.addEventListener) mq.addEventListener('change', onMq);
else mq.addListener(onMq);

/* ── 22. 해시 라우팅 ───────────────────────────────────────────── */

var PAGES = ['login','onboard','admin','home','rooms','room','search','notis','me'];
var hashLock = false;

function syncHash() {
  var want = '#/' + S.page + (S.page === 'room' ? '/' + S.roomId : '');
  if (location.hash !== want) {
    hashLock = true;
    history.replaceState(null, '', want);
    hashLock = false;
  }
}

function applyHash() {
  var parts = location.hash.replace(/^#\/?/, '').split('/');
  var page = parts[0];
  if (PAGES.indexOf(page) < 0) return false;
  if (page === 'room') {
    var id = parts[1];
    if (id && pool().some(function (r) { return r.id === id; })) S.roomId = id;
  }
  if (page === 'rooms' && !isMobile()) page = 'room';
  S.page = page;
  return true;
}

window.addEventListener('hashchange', function () {
  if (hashLock) return;
  if (applyHash()) render();
});

/* ── 23. 시작 ──────────────────────────────────────────────────── */

loadEdits();
applyHash();
render();
</script>
