<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>협진톡 — 의사 간 협진 메신저</title>
<meta name="description" content="베트남 현지 의사와 한국 의사가 환자별로 대화하고 자료를 남기는 폐쇄형 협진 메신저. 환자 1명 = 방 1개, 자료 보관 기한 없음. 의료법 제34조 원격협력 구조의 의사 간 커뮤니케이션 도구입니다.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#33586F">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2333586F'/%3E%3Ctext x='16' y='22' font-family='sans-serif' font-size='17' font-weight='700' fill='%23fff' text-anchor='middle'%3E%ED%98%91%3C/text%3E%3C/svg%3E">
<style>
/* ==========================================================================
   협진톡 (HyeopjinTalk) — Design System
   의사 간 협진 메신저 · 채도를 낮춘 진료실 도구 톤
   ========================================================================== */


/* --------------------------------------------------------------------------
   1. Tokens
   -------------------------------------------------------------------------- */

:root {
  /* Ink — 텍스트 3단계 */
  --ink-1: #14181D;
  --ink-2: #3E464F;
  --ink-3: #5B646E;

  /* Surface — 면 */
  --surface: #FFFFFF;
  --canvas: #F4F5F6;
  --canvas-2: #EFF1F2;
  --page: #EAECEE;
  --line: #E3E6E9;
  --line-2: #D7DBDF;

  /* Accent — 강조 하나만 */
  --accent: #33586F;
  --accent-ink: #244052;
  --accent-soft: #E5ECF1;
  --accent-field: #EAF0F4;

  /* Status — 채도 낮춤 */
  --ok: #2F5D4C;
  --ok-soft: #E5EDE9;
  --warn: #8A6321;
  --warn-soft: #F4EDE1;
  --danger: #9E3B37;
  --danger-soft: #F7EBEA;

  /* Etc */
  --disabled: #D8DCDF;
  --placeholder: #616A76;
  --media: #DFE3E6;

  /* Avatar tones */
  --tone-steel-fg: #244052;  --tone-steel-bg: #E5ECF1;
  --tone-sage-fg:  #2F5D4C;  --tone-sage-bg:  #E5EDE9;
  --tone-plum-fg:  #5A4462;  --tone-plum-bg:  #EDE8F0;
  --tone-clay-fg:  #6B4A32;  --tone-clay-bg:  #F1E9E3;
  --tone-slate-fg: #3E464F;  --tone-slate-bg: #E9EBED;

  /* Typography — 5단계만 */
  --font: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, sans-serif;
  --t1: 22px;    --t1-ls: -0.03em;   --t1-lh: 1.35;
  --t2: 17px;    --t2-ls: -0.025em;  --t2-lh: 1.4;
  --t3: 14.5px;  --t3-lh: 1.6;
  --t4: 13px;    --t4-lh: 1.6;
  --t5: 11.5px;  --t5-ls: 0.02em;

  /* Spacing */
  --s1: 4px;  --s2: 6px;  --s3: 8px;  --s4: 10px; --s5: 12px;
  --s6: 14px; --s7: 16px; --s8: 18px; --s9: 20px; --s10: 22px;

  /* Radius */
  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 12px;
  --r-xl: 14px;
  --r-pill: 999px;

  /* Shadow */
  --sh-card: 0 1px 2px rgba(20, 24, 29, .06);
  --sh-raised: 0 1px 2px rgba(20, 24, 29, .08);
  --sh-frame: 0 1px 2px rgba(20, 24, 29, .08), 0 14px 32px -18px rgba(20, 24, 29, .35);
  --sh-modal: 0 24px 48px -16px rgba(20, 24, 29, .45);

  /* Layout */
  --rail-w: 432px;   /* 상태 탭 5개(전체·진행 중·안 읽음·종료·보관함)가 줄바꿈 없이 들어가는 폭 + 여유 8px */
  --rail-min-w: 260px;
  --rail-max-w: 560px;
  --panel-w: 264px;
  --main-min: 440px;
  --shell-min: 1150px;
  --tap: 44px; /* 최소 터치 타깃 */
}

/* --------------------------------------------------------------------------
   2. Base
   -------------------------------------------------------------------------- */

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--page);
  color: var(--ink-1);
  font-family: var(--font);
  line-height: 1.6;
  word-break: keep-all;
  text-wrap: pretty;
}

a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-ink); }

button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  background: none;
  padding: 0;
  color: inherit;
  text-align: left;
}

input, textarea {
  font-family: inherit;
  resize: none;
  border: none;
  background: transparent;
  color: var(--ink-1);
}

input::placeholder,
textarea::placeholder {
  color: var(--placeholder);   /* 4.5:1 on --canvas */
  font-weight: 400;
}

/* 포커스 링은 제거하지 않습니다 */
input:focus-visible,
textarea:focus-visible,
button:focus-visible,
[tabindex]:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: var(--r-sm);
}

/* --------------------------------------------------------------------------
   3. Typography utilities
   -------------------------------------------------------------------------- */

.t1 { font-size: var(--t1); font-weight: 700; letter-spacing: var(--t1-ls); line-height: var(--t1-lh); }
.t2 { font-size: var(--t2); font-weight: 700; letter-spacing: var(--t2-ls); line-height: var(--t2-lh); }
.t3 { font-size: var(--t3); font-weight: 500; line-height: var(--t3-lh); }
.t3-strong { font-size: var(--t3); font-weight: 600; line-height: var(--t3-lh); }
.t4 { font-size: var(--t4); font-weight: 500; line-height: var(--t4-lh); color: var(--ink-3); }
.t4-strong { font-size: var(--t4); font-weight: 600; line-height: var(--t4-lh); }
.t5 { font-size: var(--t5); font-weight: 700; letter-spacing: var(--t5-ls); color: var(--ink-2); }

.muted { color: var(--ink-3); }
.num { font-variant-numeric: tabular-nums; }
.truncate { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nowrap { white-space: nowrap; }

/* --------------------------------------------------------------------------
   4. Layout — 셸
   각 열에 min-width를 명시하고 컨테이너가 가로 스크롤합니다.
   고정폭 열 + flex:1 본문 조합에서 본문이 0으로 굶는 것을 막기 위함입니다.
   -------------------------------------------------------------------------- */

.frame {
  background: var(--surface);
  border-radius: var(--r-xl);
  overflow-x: auto;
  overflow-y: hidden;
  box-shadow: var(--sh-frame);
}

.shell {
  position: relative;
  display: flex;
  height: 740px;            /* min-height가 아니라 height — 내부 스크롤의 전제 */
  min-width: var(--shell-min);
  overflow: hidden;
}

.rail {
  flex: none;
  width: var(--rail-w);
  min-height: 0;
  background: var(--surface);
  display: flex;
  flex-direction: column;
}

/* 레일 폭 조절 손잡이. 시각적으로는 얇은 구분선(1px)이지만
   히트 영역은 ::before로 넓혀 드래그하기 쉽게 합니다. */
.rail-resizer {
  flex: none;
  width: 1px;
  min-height: 0;
  background: var(--line);
  position: relative;
  cursor: col-resize;
  touch-action: none;
}
.rail-resizer::before {
  content: '';
  position: absolute;
  top: 0; bottom: 0;
  left: -5px; right: -5px;
}
.rail-resizer:hover, .rail-resizer:focus-visible {
  background: var(--accent);
}

.main {
  flex: 1;
  min-width: var(--main-min);
  min-height: 0;
  display: flex;
  flex-direction: column;
  background: var(--canvas);
}

.panel {
  flex: none;
  width: var(--panel-w);
  min-height: 0;
  border-left: 1px solid var(--line);
  background: var(--surface);
  display: flex;
  flex-direction: column;
}

/* 스크롤 영역 공통 */
.scroll {
  flex: 1 1 0;
  min-height: 0;
  overflow-y: auto;
}

@media (max-width: 1009px) {
  .shell { flex-direction: column; min-width: 0; height: 760px; }
  .rail, .panel { display: none; }
  .main { min-width: 0; }
}

/* --------------------------------------------------------------------------
   5. Buttons
   -------------------------------------------------------------------------- */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--s2);
  min-height: var(--tap);
  padding: 0 13px;
  border-radius: var(--r-md);
  font-size: var(--t4);
  font-weight: 600;
  white-space: nowrap;
}

.btn--primary { background: var(--accent); color: #fff; }
.btn--primary[disabled],
.btn--primary.is-disabled { background: var(--disabled); color: #fff; cursor: default; }

.btn--quiet { background: var(--canvas); color: var(--ink-2); }
.btn--ghost { background: transparent; color: var(--accent); }
.btn--danger { background: var(--danger-soft); color: var(--danger); }

.btn--lg { height: 50px; font-size: 15px; }
.btn--icon { width: var(--tap); height: var(--tap); padding: 0; }

/* 아이콘 전용 버튼에는 반드시 aria-label */

/* --------------------------------------------------------------------------
   6. Fields — 테두리 없이 면으로 구분
   비었을 때 회색 면, 값이 들어오면 배경이 진해지고 글자가 굵어집니다.
   -------------------------------------------------------------------------- */

.field-label {
  display: block;
  font-size: var(--t5);
  font-weight: 700;
  letter-spacing: var(--t5-ls);
  color: var(--ink-2);
  margin-bottom: var(--s2);
}
.field-label .req { color: var(--danger); }

.field {
  width: 100%;
  height: var(--tap);
  border-radius: var(--r-md);
  padding: 0 12px;
  font-size: 14px;
  background: var(--canvas);
  font-weight: 400;
}
.field--lg { height: 48px; font-size: var(--t3); padding: 0 14px; }
.field.is-filled { background: var(--accent-field); font-weight: 600; }

.field-hint {
  font-size: var(--t4);
  color: var(--ink-3);
  line-height: 1.6;
  margin-top: var(--s2);
}

.field-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(112px, 1fr));
  gap: var(--s3);
}

/* 읽기 전용 값 표시 */
.field-readonly {
  height: 48px;
  border-radius: var(--r-md);
  background: var(--canvas-2);
  display: flex;
  align-items: center;
  padding: 0 14px;
  font-size: var(--t3);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}

.field-code {
  height: 48px;
  border-radius: var(--r-md);
  background: var(--accent-field);
  box-shadow: inset 0 0 0 1.5px var(--accent);
  display: flex;
  align-items: center;
  padding: 0 14px;
}
.field-code .code { flex: 1; font-size: var(--t3); font-weight: 600; letter-spacing: .32em; font-variant-numeric: tabular-nums; }
.field-code .timer { flex: none; font-size: var(--t4); font-weight: 600; color: var(--danger); font-variant-numeric: tabular-nums; }

/* --------------------------------------------------------------------------
   7. Chips / Badges
   -------------------------------------------------------------------------- */

.chip {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: var(--s2);
  height: 34px;
  padding: 0 12px;
  border-radius: var(--r-pill);
  font-size: var(--t4);
  font-weight: 500;
  background: var(--canvas);
  color: var(--ink-2);
  white-space: nowrap;
}
.chip.is-active { background: var(--accent); color: #fff; font-weight: 600; }

.chip-sq {
  height: 34px;
  padding: 0 12px;
  border-radius: var(--r-sm);
  font-size: var(--t4);
  font-weight: 500;
  background: var(--canvas);
  color: var(--ink-2);
  white-space: nowrap;
}
.chip-sq.is-active { background: var(--ink-1); color: #fff; font-weight: 600; }

.badge {
  display: inline-block;
  font-size: var(--t5);
  font-weight: 600;
  padding: 2px 7px;
  border-radius: 5px;
  white-space: nowrap;
  background: var(--canvas-2);
  color: var(--ink-2);
}
.badge--auto { font-size: 11px; font-weight: 700; padding: 1px 5px; border-radius: 4px; background: var(--line); color: var(--ink-3); }
.badge--ok { background: var(--ok-soft); color: var(--ok); }
.badge--warn { background: var(--warn-soft); color: var(--warn); }
.badge--danger { background: var(--danger-soft); color: var(--danger); }
.badge--accent { background: var(--accent-soft); color: var(--accent-ink); }
.badge--count {
  font-size: var(--t5);
  font-weight: 700;
  color: #fff;
  background: var(--danger);
  padding: 1px 7px;
  border-radius: var(--r-pill);
}

/* --------------------------------------------------------------------------
   8. Avatar
   -------------------------------------------------------------------------- */

.avatar {
  flex: none;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 38px;
  height: 38px;
  border-radius: 11px;
  font-size: var(--t4);
  font-weight: 700;
}
.avatar--sm { width: 30px; height: 30px; border-radius: 9px; font-size: var(--t5); }
.avatar--md { width: 36px; height: 36px; border-radius: 11px; }
.avatar--lg { width: 52px; height: 52px; border-radius: 15px; font-size: var(--t2); }

.tone-steel { background: var(--tone-steel-bg); color: var(--tone-steel-fg); }
.tone-sage  { background: var(--tone-sage-bg);  color: var(--tone-sage-fg); }
.tone-plum  { background: var(--tone-plum-bg);  color: var(--tone-plum-fg); }
.tone-clay  { background: var(--tone-clay-bg);  color: var(--tone-clay-fg); }
.tone-slate { background: var(--tone-slate-bg); color: var(--tone-slate-fg); }

/* --------------------------------------------------------------------------
   9. Room list
   -------------------------------------------------------------------------- */

.room-row {
  display: flex;
  width: 100%;
  gap: 11px;
  align-items: flex-start;
  min-height: 72px;
  padding: 12px 10px;
  border-radius: var(--r-md);
  margin-bottom: 2px;
  background: var(--surface);
}
.room-row.is-active { background: var(--accent-soft); }

.room-row__top { display: flex; align-items: baseline; gap: 7px; margin-bottom: 1px; }
.room-row__name { flex: 1; font-size: var(--t3); font-weight: 600; letter-spacing: -.02em; }
.room-row__when { flex: none; font-size: var(--t5); font-weight: 500; letter-spacing: 0; color: var(--ink-3); }

/* 환자 요약 — 이름만으로 식별이 어려워 반드시 노출합니다 */
.room-row__summary {
  font-size: var(--t4);
  font-weight: 600;
  color: var(--accent);
  margin-bottom: 2px;
}
.room-row__last { font-size: var(--t4); color: var(--ink-3); margin-bottom: 5px; }
.room-row__meta { display: flex; align-items: center; gap: 5px; }

.empty-state { padding: 48px 20px; text-align: center; }
.empty-state__title { font-size: var(--t3); font-weight: 600; color: var(--ink-2); margin-bottom: 4px; }
.empty-state__body { font-size: var(--t4); color: var(--ink-3); line-height: 1.6; }

/* --------------------------------------------------------------------------
   10. Room header / topic bar
   -------------------------------------------------------------------------- */

.room-header {
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  padding: 12px var(--s7);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--s4);
}
.room-header__title { flex: 1 1 160px; min-width: 150px; }

.state-banner {
  display: flex;
  align-items: center;
  gap: var(--s4);
  padding: 10px var(--s7);
  background: var(--line);
}
.state-banner__text { flex: 1; font-size: var(--t4); font-weight: 500; color: var(--ink-2); }
.state-banner__action { flex: none; height: 36px; padding: 0 10px; font-size: var(--t4); font-weight: 700; color: var(--accent); }
.state-banner--danger { background: var(--danger-soft); }
.state-banner--danger .state-banner__text { color: #8A3A38; }
.state-banner--danger .state-banner__action { color: var(--danger); }

.topic-bar {
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  padding: 9px var(--s6);
}
.topic-bar__row { display: flex; align-items: center; gap: 7px; }
.topic-bar__chips { flex: 1; min-width: 0; display: flex; align-items: center; gap: var(--s2); overflow-x: auto; }

/* --------------------------------------------------------------------------
   11. Messages
   -------------------------------------------------------------------------- */

.thread {
  flex: 1 1 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: var(--s5);
  padding: var(--s8) var(--s7);
  overflow-y: auto;
}

.divider-topic { display: flex; align-items: center; gap: var(--s3); margin: 2px 0; }
.divider-topic__line { flex: 1; height: 1px; background: var(--line-2); }
.divider-topic__line--short { flex: none; width: 14px; }
.divider-topic__label {
  flex: none;
  font-size: var(--t5);
  font-weight: 700;
  letter-spacing: var(--t5-ls);
  color: var(--accent);
  background: var(--accent-soft);
  padding: 4px var(--s4);
  border-radius: var(--r-pill);
  white-space: nowrap;
}

.divider-day { display: flex; justify-content: center; }
.divider-day span {
  font-size: var(--t5);
  font-weight: 600;
  letter-spacing: 0;
  color: var(--ink-2);
  background: var(--line);
  padding: 4px 11px;
  border-radius: var(--r-pill);
  white-space: nowrap;
}

.msg { display: flex; gap: 9px; }
.msg--mine { justify-content: flex-end; }
.msg--grouped { padding-left: 39px; }

.msg__col { max-width: 66%; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; }
.msg--mine .msg__col { align-items: flex-end; }

.msg__name { font-size: var(--t4); font-weight: 600; color: var(--ink-2); margin-bottom: 4px; white-space: nowrap; }

.bubble {
  border-radius: 12px 12px 12px 4px;
  padding: 11px var(--s6);
  background: var(--surface);
  box-shadow: var(--sh-card);
  color: var(--ink-1);
  font-size: var(--t3);
  line-height: 1.7;
}
.msg--mine .bubble {
  border-radius: 12px 12px 4px 12px;
  background: var(--accent);
  box-shadow: none;
  color: #fff;
}

.bubble__media {
  margin-top: 9px;
  border-radius: 9px;
  overflow: hidden;
  background: var(--media);
  width: 220px;
  height: 146px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  font-size: var(--t4);
  color: var(--ink-2);
}
.bubble__media-tag {
  position: absolute;
  top: 7px; left: 7px;
  font-size: 11px;
  font-weight: 700;
  color: var(--ink-1);
  background: rgba(255, 255, 255, .94);
  padding: 2px 7px;
  border-radius: 5px;
}

.bubble__file {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-top: 9px;
  background: var(--canvas);
  border-radius: 9px;
  padding: 9px 11px;
}
.msg--mine .bubble__file { background: rgba(255, 255, 255, .16); }
.bubble__file-icon {
  flex: none; width: 28px; height: 28px;
  border-radius: 8px;
  background: var(--line);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: var(--ink-2);
}
.msg--mine .bubble__file-icon { background: rgba(255, 255, 255, .22); color: #fff; }
.bubble__file-name { display: block; font-size: var(--t4); font-weight: 600; }
.bubble__file-meta { display: block; font-size: var(--t5); font-weight: 500; letter-spacing: 0; color: var(--ink-3); }
.msg--mine .bubble__file-name { color: #fff; }
.msg--mine .bubble__file-meta { color: rgba(255, 255, 255, .85); }

.msg__meta { display: flex; align-items: center; gap: var(--s2); margin-top: 4px; }
.msg__time { font-size: var(--t5); font-weight: 500; letter-spacing: 0; color: var(--ink-3); }
.msg__star { font-size: var(--t5); font-weight: 700; letter-spacing: 0; color: var(--warn); }

@media (max-width: 1009px) {
  .msg__col { max-width: 78%; }
  .bubble__media { width: 186px; height: 126px; }
}

/* --------------------------------------------------------------------------
   12. Composer
   -------------------------------------------------------------------------- */

.composer {
  background: var(--surface);
  border-top: 1px solid var(--line);
  padding: 11px var(--s6) var(--s6);
}
.composer__row { display: flex; gap: var(--s3); align-items: flex-end; }
.composer__input {
  flex: 1;
  min-width: 0;
  min-height: var(--tap);
  max-height: 96px;
  border-radius: var(--r-md);
  background: var(--canvas);
  padding: 12px var(--s6);
  font-size: var(--t3);
  line-height: 1.6;
}
.composer__opts { display: flex; align-items: center; gap: var(--s4); margin-top: var(--s3); }

.attach-pending {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 9px;
  background: var(--ok-soft);
  border-radius: 9px;
  padding: 9px 11px;
  font-size: var(--t4);
  font-weight: 600;
  color: var(--ok);
}

.check {
  flex: none;
  width: 20px; height: 20px;
  border-radius: var(--r-sm);
  background: var(--surface);
  box-shadow: inset 0 0 0 1.5px #D2D7DB;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; color: transparent;
}
.check.is-on { background: var(--accent); color: #fff; box-shadow: none; }
.check--star.is-on { background: var(--warn); }

/* --------------------------------------------------------------------------
   13. Panel
   -------------------------------------------------------------------------- */

.panel__tabs { display: flex; gap: 5px; padding: var(--s6) var(--s6) var(--s4); border-bottom: 1px solid var(--line); }
.panel__tab { flex: 1; text-align: center; height: 36px; border-radius: 9px; font-size: var(--t4); font-weight: 500; background: var(--canvas); color: var(--ink-2); }
.panel__tab.is-active { background: var(--ink-1); color: #fff; font-weight: 600; }
.panel__body { flex: 1 1 0; min-height: 0; overflow-y: auto; padding: var(--s7) var(--s6); }
.panel__section { font-size: var(--t5); font-weight: 700; letter-spacing: var(--t5-ls); color: var(--ink-2); margin-bottom: var(--s3); }

.member-row { display: flex; align-items: center; gap: 9px; min-height: 48px; }

.file-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s3); }
.file-card { border-radius: var(--r-md); overflow: hidden; background: var(--media); min-width: 0; }
.file-card__thumb {
  height: 76px;
  display: flex; align-items: center; justify-content: center;
  position: relative;
  font-size: var(--t5); font-weight: 500; letter-spacing: 0;
  color: var(--ink-2);
  text-align: center;
  padding: 0 7px;
}
.file-card__tag {
  position: absolute; top: 6px; left: 6px;
  font-size: 11px; font-weight: 700;
  color: var(--ink-1);
  background: rgba(255, 255, 255, .94);
  padding: 1px 6px; border-radius: 4px;
}

.note-ok {
  background: var(--ok-soft);
  border-radius: var(--r-md);
  padding: 12px 13px;
  font-size: var(--t4);
  color: var(--ok);
  line-height: 1.6;
}

/* --------------------------------------------------------------------------
   14. Modal
   본문 스크롤 영역은 flex:0 1 auto — flex:1 1 0으로 하면
   카드 높이가 내용 기반일 때 0으로 접힙니다.
   -------------------------------------------------------------------------- */

.overlay {
  position: absolute;
  inset: 0;
  z-index: 30;
  background: rgba(20, 24, 29, .42);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 28px 20px;
}

.modal {
  width: 100%;
  max-width: 540px;
  background: var(--surface);
  border-radius: var(--r-xl);
  box-shadow: var(--sh-modal);
  display: flex;
  flex-direction: column;
  max-height: 100%;
  overflow: hidden;
}
.modal--sm { max-width: 380px; }
.modal--md { max-width: 460px; }
.modal--lg { max-width: 700px; }

.modal__head {
  display: flex;
  align-items: center;
  gap: var(--s4);
  padding: var(--s8) var(--s9);
  border-bottom: 1px solid var(--line);
}
.modal__body { flex: 0 1 auto; min-height: 0; overflow-y: auto; padding: var(--s9); }
.modal__foot { display: flex; gap: var(--s3); padding: var(--s6) var(--s9); border-top: 1px solid var(--line); }
.modal__foot .btn { height: 48px; font-size: var(--t3); font-weight: 600; }
.modal__foot .btn--primary { flex: 1; }

.action-card {
  display: flex;
  align-items: flex-start;
  gap: var(--s5);
  min-height: 56px;
  padding: 13px;
  border-radius: var(--r-md);
  background: var(--canvas);
}
.action-card--accent { background: var(--accent-soft); }
.action-card--danger { background: var(--danger-soft); }
.action-card__icon {
  flex: none; width: 28px; height: 28px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: var(--t4);
  background: var(--line); color: var(--ink-2);
}
.action-card__label { display: block; font-size: var(--t3); font-weight: 600; }
.action-card__sub { display: block; font-size: var(--t4); color: var(--ink-3); line-height: 1.6; margin-top: 1px; }

.pick-row {
  display: flex;
  align-items: center;
  gap: 11px;
  min-height: 56px;
  padding: 9px 12px;
  border-radius: var(--r-md);
  background: var(--canvas);
}
.pick-row.is-picked { background: var(--accent-field); }
.pick-row__box {
  flex: none; width: 22px; height: 22px;
  border-radius: var(--r-sm);
  background: var(--surface);
  box-shadow: inset 0 0 0 1.5px #D2D7DB;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; color: transparent;
}
.pick-row.is-picked .pick-row__box { background: var(--accent); color: #fff; box-shadow: none; }

@media (max-width: 1009px) {
  .overlay { align-items: flex-end; padding: 0; }
  .modal { border-radius: var(--r-xl) var(--r-xl) 0 0; max-width: none; }
}

/* --------------------------------------------------------------------------
   15. Onboarding
   -------------------------------------------------------------------------- */

.onb { background: var(--canvas); display: flex; align-items: flex-start; justify-content: center; padding: 32px var(--s10); }
.onb__inner { width: 100%; max-width: 400px; }
.onb__steps { display: flex; align-items: center; gap: 7px; margin-bottom: var(--s9); }
.onb__dot { flex: none; width: 8px; height: 8px; border-radius: var(--r-pill); background: var(--disabled); }
.onb__dot.is-done { background: var(--accent); }
.onb__dot.is-current { width: 22px; background: var(--accent); }
.onb__card { background: var(--surface); border-radius: var(--r-xl); padding: var(--s10); box-shadow: var(--sh-card); }

.upload-box {
  display: flex;
  width: 100%;
  min-height: 96px;
  border-radius: var(--r-md);
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: var(--s2);
  background: var(--canvas);
}
.upload-box.is-done { background: var(--ok-soft); box-shadow: inset 0 0 0 1.5px #A9CBBC; color: var(--ok); }

/* --------------------------------------------------------------------------
   16. Settings / toggle
   -------------------------------------------------------------------------- */

.setting-row {
  display: flex;
  width: 100%;
  align-items: center;
  gap: var(--s5);
  min-height: 60px;
  padding: var(--s5) 0;
  border-bottom: 1px solid var(--canvas-2);
}
.setting-row:last-child { border-bottom: none; }

.toggle {
  flex: none;
  width: 46px; height: 28px;
  border-radius: var(--r-pill);
  background: var(--disabled);
  display: flex; align-items: center;
  padding: 3px;
  justify-content: flex-start;
}
.toggle.is-on { background: var(--accent); justify-content: flex-end; }
.toggle__knob { width: 22px; height: 22px; border-radius: 50%; background: var(--surface); display: block; }

.card-list { background: var(--surface); border-radius: var(--r-lg); padding: 0 var(--s6); box-shadow: var(--sh-card); }

/* --------------------------------------------------------------------------
   17. Admin
   -------------------------------------------------------------------------- */

.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--s4); }
.stat-card { background: var(--surface); border-radius: var(--r-lg); padding: 15px var(--s7); box-shadow: var(--sh-card); }
.stat-card__label { font-size: var(--t5); font-weight: 700; letter-spacing: var(--t5-ls); color: var(--ink-3); margin-bottom: 7px; }
.stat-card__value { font-size: var(--t1); font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.stat-card__delta { font-size: var(--t5); font-weight: 500; letter-spacing: 0; margin-top: 4px; }

.bars { display: flex; align-items: flex-end; gap: var(--s3); height: 120px; }
.bars__col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: var(--s2); min-width: 0; }
.bars__bar { width: 100%; border-radius: 5px 5px 0 0; background: #B8C6D1; }
.bars__bar.is-high { background: var(--accent); }

.table { background: var(--surface); border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--sh-card); }
.table__head,
.table__row { display: grid; gap: var(--s4); align-items: center; }
.table__head {
  padding: var(--s4) var(--s8);
  background: #FAFBFB;
  border-bottom: 1px solid var(--line);
  font-size: var(--t5);
  font-weight: 700;
  letter-spacing: var(--t5-ls);
  color: var(--ink-3);
}
.table__row { padding: 13px var(--s8); border-bottom: 1px solid var(--canvas-2); font-size: 14px; }
.table__row:last-child { border-bottom: none; }

/* 열 정의 — 모두 minmax(0, …)으로 좁은 폭에서 붕괴하지 않게 */
.cols-users { grid-template-columns: minmax(140px, 1.6fr) minmax(0, .8fr) minmax(0, .8fr) minmax(0, 1fr) minmax(0, .9fr); }
.cols-audit { grid-template-columns: minmax(96px, .9fr) minmax(110px, 1.1fr) minmax(0, .9fr) minmax(150px, 2fr) minmax(0, .9fr); }

.notice {
  background: var(--tone-clay-bg);
  border-radius: var(--r-md);
  padding: 13px 15px;
  font-size: var(--t4);
  color: var(--tone-clay-fg);
  line-height: 1.7;
}

/* --------------------------------------------------------------------------
   18. Mobile tab bar
   -------------------------------------------------------------------------- */

.tabbar {
  flex: none;
  display: flex;
  background: var(--surface);
  border-top: 1px solid var(--line);
  padding: var(--s2) 0 var(--s4);
}
.tabbar__item {
  flex: 1;
  min-height: 52px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  position: relative;
  color: #8A939C;
}
.tabbar__item.is-active { color: var(--accent); }
.tabbar__label { font-size: var(--t5); font-weight: 500; letter-spacing: 0; color: var(--ink-3); }
.tabbar__item.is-active .tabbar__label { font-weight: 700; color: var(--accent); }
.tabbar__dot {
  position: absolute; top: 6px; left: 50%; margin-left: 7px;
  width: 7px; height: 7px; border-radius: 50%; background: var(--danger);
}

/* --------------------------------------------------------------------------
   19. Motion
   이 디자인은 의도적으로 모션이 거의 없습니다.
   상태 변화는 색으로 표현합니다.
   -------------------------------------------------------------------------- */

@media (prefers-reduced-motion: no-preference) {
  .btn, .chip, .room-row, .pick-row { transition: background-color .12s ease, color .12s ease; }
}

/* ==========================================================================
   20. 배포 적응 — 핸드오프의 데모 프레임(고정 740px) 대신 뷰포트를 채웁니다.
   ========================================================================== */

html, body { height: 100%; }
body { overscroll-behavior: none; }

.app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  position: relative;
  background: var(--surface);
  overflow-x: auto;
  overflow-y: hidden;
}

/* 셸은 프레임이 아니라 앱 본체. 높이는 부모가 확정합니다. */
.shell { height: auto; flex: 1 1 0; min-height: 0; border-radius: 0; }

.ic { flex: none; display: block; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.row { display: flex; align-items: center; gap: var(--s3); }
.grow { flex: 1; min-width: 0; }

/* ── 레일 ─────────────────────────────────────────────────────── */
.rail__head { flex: none; display: flex; align-items: center; gap: 9px; padding: var(--s6) var(--s6) var(--s4); }
.rail__tools { flex: none; padding: 0 var(--s6) var(--s4); display: flex; flex-direction: column; gap: var(--s3); }
/* 상태 탭 5개는 기본 레일 폭(432px)에서 줄바꿈 없이 한 줄에 다 들어갑니다.
   레일을 직접 좁게 줄인 경우에만 가로 스크롤로 대응합니다. */
.rail__tabs {
  flex: none;
  display: flex;
  flex-wrap: nowrap;
  gap: var(--s2);
  padding: 5px var(--s6) var(--s5);
  overflow-x: auto;
}
.rail__foot { flex: none; border-top: 1px solid var(--line); padding: var(--s4) var(--s6); display: flex; align-items: center; gap: 9px; }

.logo {
  flex: none; width: 34px; height: 34px;
  border-radius: var(--r-md); background: var(--accent); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: var(--t4); font-weight: 700;
}
.logo--lg { width: 48px; height: 48px; border-radius: var(--r-xl); font-size: var(--t2); }

.searchbox {
  display: flex; align-items: center; gap: var(--s3);
  min-height: var(--tap); border-radius: var(--r-md);
  background: var(--canvas); padding: 0 var(--s5); color: var(--ink-3);
}
.searchbox input { flex: 1; min-width: 0; height: var(--tap); font-size: var(--t4); font-weight: 500; }
.searchbox--lg input { height: 48px; font-size: var(--t3); }

/* ── 단일 화면(검색·알림·내 정보) ─────────────────────────────── */
.screen { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; background: var(--canvas); }
.screen__head {
  flex: none; display: flex; align-items: center; gap: var(--s4);
  padding: var(--s5) var(--s7); background: var(--surface); border-bottom: 1px solid var(--line);
}
.screen__body { flex: 1 1 0; min-height: 0; overflow-y: auto; padding: var(--s7); }
.screen__body--narrow { max-width: 620px; width: 100%; margin: 0 auto; }

.sec-label { font-size: var(--t5); font-weight: 700; letter-spacing: var(--t5-ls); color: var(--ink-3); margin: var(--s8) 0 var(--s3); }
.sec-label:first-child { margin-top: 0; }

.noti-row {
  display: flex; width: 100%; gap: var(--s5); align-items: flex-start;
  min-height: 68px; padding: var(--s5) var(--s6);
  border-radius: var(--r-lg); background: var(--canvas-2);
  margin-bottom: var(--s3); text-align: left;
}
.noti-row.is-unread { background: var(--surface); box-shadow: var(--sh-card); }
.noti-row__dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); margin-top: 7px; }

.result-card {
  display: block; width: 100%; text-align: left;
  background: var(--surface); border-radius: var(--r-lg);
  padding: var(--s5) var(--s6); box-shadow: var(--sh-card); margin-bottom: var(--s3);
}
.result-row {
  display: flex; width: 100%; align-items: center; gap: var(--s5);
  min-height: 64px; padding: var(--s3) var(--s6); text-align: left;
  background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--sh-card); margin-bottom: var(--s3);
}
.thumb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: var(--s3); }
.thumb-grid--modal { grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); }

/* ── 로그인 ───────────────────────────────────────────────────── */
.login { flex: 1 1 0; min-height: 0; overflow-y: auto; background: var(--canvas); display: flex; align-items: center; justify-content: center; padding: 40px var(--s10); }
.login__inner { width: 100%; max-width: 340px; }
.legal { margin-top: var(--s7); font-size: var(--t4); color: var(--ink-3); line-height: 1.7; }

/* 온보딩은 스크롤 컨테이너 */
.onb { flex: 1 1 0; min-height: 0; overflow-y: auto; }

/* ── 운영자 ───────────────────────────────────────────────────── */
.admin { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; background: var(--page); }
.admin__bar {
  flex: none; display: flex; align-items: center; gap: var(--s4); flex-wrap: wrap;
  padding: var(--s5) var(--s9); background: var(--surface); border-bottom: 1px solid var(--line);
}
.admin__body { flex: 1 1 0; min-height: 0; overflow-y: auto; padding: var(--s9); }
.admin__inner { max-width: 1080px; margin: 0 auto; }
.table-scroll { overflow-x: auto; }
.table-scroll .table { min-width: 720px; }

/* ── 모달: 실제 배포에서는 뷰포트 기준 고정 ───────────────────── */
.overlay { position: fixed; }
.modal { max-height: calc(100dvh - 56px); }

/* button으로 쓰는 행 컴포넌트는 폭이 줄어들지 않게 명시합니다 */
.pick-row, .action-card, .setting-row, .room-row { width: 100%; }
.pick-row { margin-bottom: var(--s2); text-align: left; }
.action-card { margin-bottom: var(--s3); }
.action-card:last-child { margin-bottom: 0; }

/* 칩·탭은 디자인상 34~36px입니다. 시각 높이는 그대로 두고
   보이지 않는 히트 영역만 44px로 넓혀 터치 타깃 규칙을 지킵니다. */
.chip, .chip-sq, .panel__tab, .state-banner__action, .tabbar__item { position: relative; }
.composer__opts > button { min-height: var(--tap); }
.chip::after, .chip-sq::after, .panel__tab::after, .state-banner__action::after {
  content: '';
  position: absolute;
  left: 0; right: 0; top: 50%;
  height: var(--tap);
  transform: translateY(-50%);
}

/* ── 자료 분석 · 캡션 ─────────────────────────────────────────── */

/* 첨부 아래 붙는 자동 계측 한 줄. 말풍선 안에서도 읽히도록 면으로만 구분합니다. */
.bubble__caption {
  display: flex;
  align-items: center;
  gap: var(--s2);
  width: 100%;
  margin-top: var(--s2);
  padding: 7px 9px;
  border-radius: 8px;
  background: var(--canvas);
  color: var(--ink-2);
  text-align: left;
}
.bubble__caption-text {
  flex: 1;
  min-width: 0;
  font-size: var(--t4);
  font-weight: 600;
  line-height: 1.5;
}
.msg--mine .bubble__caption {
  background: rgba(255, 255, 255, .16);
  color: #fff;
}
.msg--mine .bubble__caption .badge--auto {
  background: rgba(255, 255, 255, .22);
  color: #fff;
}

/* 방 전체 자료를 한 덩어리로 정리한 블록 */
.digest {
  background: var(--accent-soft);
  border-radius: var(--r-md);
  padding: var(--s5) var(--s6);
}
.digest__head { display: flex; align-items: center; gap: var(--s2); color: var(--accent-ink); margin-bottom: var(--s4); }
.digest__grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: var(--s4) var(--s5); }
.digest__k {
  display: block;
  font-size: var(--t5); font-weight: 700; letter-spacing: var(--t5-ls);
  color: var(--accent-ink); opacity: .75; margin-bottom: 2px;
}
.digest__v { display: block; font-size: var(--t4); font-weight: 600; color: var(--ink-1); }

/* 자료 하나의 계측표 */
.file-detail {
  background: var(--surface);
  border-radius: var(--r-lg);
  padding: var(--s6);
  box-shadow: var(--sh-card);
  margin-bottom: var(--s3);
}
.file-detail__head { display: flex; align-items: center; gap: var(--s3); margin-bottom: var(--s5); }
.metric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--s2) var(--s5); }
.metric-row {
  display: flex; align-items: baseline; gap: var(--s3);
  min-height: 30px;
  border-bottom: 1px solid var(--canvas-2);
}
.metric-row__k { flex: 1; min-width: 0; font-size: var(--t4); color: var(--ink-3); }
.metric-row__v { flex: none; font-size: var(--t4); font-weight: 600; font-variant-numeric: tabular-nums; }

.file-card__caption {
  padding: 8px 9px;
  background: var(--surface);
  font-size: var(--t5);
  font-weight: 500;
  letter-spacing: 0;
  line-height: 1.5;
  color: var(--ink-2);
}
.file-card { box-shadow: var(--sh-card); margin-bottom: var(--s3); }

/* ── 상담 요약 ────────────────────────────────────────────────── */

/* 대화 끝에 남는 요약 카드 — 말풍선과 구별되도록 폭을 다 쓰고 면을 달리합니다 */
.sum-card {
  /* .thread는 세로 flex 컨테이너입니다. overflow:hidden인 항목은 자동 최소 높이가
     0이 되어 내용이 넘칠 때 납작하게 눌립니다 — flex:none으로 줄어들지 않게 못박습니다. */
  flex: none;
  background: var(--surface);

function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}
function cls() {
  return Array.prototype.filter.call(arguments, Boolean).join(' ');
}
function isMobile() {
  return window.matchMedia('(max-width: 1009px)').matches;
}
function pool() {
  return S.extraRooms.concat(ROOMS);
}
function roomById(id) {
  var list = pool();
  for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
  return list[0];
}
function threadMsgs(roomId, threadId) {
  var key = roomId + threadId;
  return (MSGS[key] || []).concat(S.sent[key] || []);
}
function filesOf(roomId) {
  return FILES[roomId] || [];
}
function fileById(roomId, id) {
  var list = filesOf(roomId);
  for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
  return null;
}
/* 방 전체 자료를 한 덩어리로 정리합니다 — 종류별 건수, 기간, 눈여겨볼 계측값 수 */
function filesDigest(roomId) {
  var list = filesOf(roomId);
  var byTag = {}, order = [], flagged = 0, metrics = 0;
  list.forEach(function (f) {
    if (byTag[f.tag] == null) { byTag[f.tag] = 0; order.push(f.tag); }
    byTag[f.tag]++;
    (f.metrics || []).forEach(function (m) {
      metrics++;
      if (m[2] === 'warn') flagged++;
    });
  });
  var days = list.map(function (f) { return f.when; });
  return {
    count: list.length,
    kinds: order.map(function (t) { return t + ' ' + byTag[t]; }).join(' · '),
    span: days.length ? (days[0] === days[days.length - 1] ? days[0] : days[0] + ' ~ ' + days[days.length - 1]) : '',
    metrics: metrics,
    flagged: flagged
  };
}

/* ── 상담 요약 ──────────────────────────────────────────────────
   대화가 끝나는 시점에 "어떻게 시작했고, 어떻게 진행됐고, 무엇이 오갔는지"를
   빠짐없이 짧게 정리합니다. 문장을 지어내지 않고 실제 대화에서 뽑아 씁니다 —
   ★로 표시한 의견이 결론이 되고, 주제·자료·기간은 세어서 채웁니다. */

function firstSentence(t, max) {
  t = String(t || '').trim();
  var cut = t.search(/[.!?。]\s|[.!?。]$/);
  if (cut > 0) t = t.slice(0, cut + 1);
  max = max || 60;
  return t.length > max ? t.slice(0, max - 1) + '…' : t;
}

function buildSummary(room) {
  var threads = [];
  var all = [];
  room.threads.forEach(function (t) {
    var ms = threadMsgs(room.id, t.id);
    if (!ms.length) return;
    var asked = ms[0];
    var answered = null;
    for (var i = ms.length - 1; i >= 0; i--) {
      if (ms[i].who !== asked.who) { answered = ms[i]; break; }
    }
    threads.push({
      label: t.label,
      count: ms.length,
      opened: firstSentence(asked.body, 72),
      openedBy: (PEOPLE[asked.who] || PEOPLE.han).name,
      closed: answered ? firstSentence(answered.body, 72) : '',
      closedBy: answered ? (PEOPLE[answered.who] || PEOPLE.han).name : '',
      waiting: !answered,
      files: ms.filter(function (m) { return m.img || m.file; }).length
    });
    ms.forEach(function (m) { all.push(m); });
  });

  var days = all.map(function (m) { return m.day; }).filter(Boolean);
  var starred = all.filter(function (m) { return m.star; }).map(function (m) {
    return { who: (PEOPLE[m.who] || PEOPLE.han).name, body: m.body };
  });
  var opener = all[0] || {};
  var calls = (S.callLog[room.id] || []);

  return {
    span: days.length ? (days.length > 1 ? days[0] + ' ~ ' + days[days.length - 1] : days[0]) : '기간 정보 없음',
    msgCount: all.length,
    members: memberKeys().map(function (k) { return PEOPLE[k].name; }),
    openedBy: (PEOPLE[opener.who] || PEOPLE.han).name,
    opened: firstSentence(opener.body, 90),
    threads: threads,
    starred: starred,
    calls: calls,
    files: filesDigest(room.id),
    pending: threads.filter(function (t) { return t.waiting; })
  };
}

function memberKeys() {
  var keys = BASE_MEMBERS.slice();
  Object.keys(S.joined).forEach(function (k) { if (keys.indexOf(k) < 0) keys.push(k); });
  return keys.filter(function (k) { return !S.removed[k]; });
}
function live(r) {
  return !S.archived[r.id] && !S.trashed[r.id];
}
function tabCounts() {
  var list = pool();
  return {
    all: list.filter(live).length,
    open: list.filter(function (r) { return live(r) && !S.closed[r.id]; }).length,
    unread: list.filter(function (r) { return r.unread && live(r) && !S.closed[r.id]; }).length,
    closed: list.filter(function (r) { return S.closed[r.id] && live(r); }).length,
    archive: list.filter(function (r) { return S.archived[r.id] || S.trashed[r.id]; }).length
  };
}
function shownRooms() {
  var list = pool();
  if (S.tab === 'unread') return list.filter(function (r) { return r.unread && live(r) && !S.closed[r.id]; });
  if (S.tab === 'closed') return list.filter(function (r) { return S.closed[r.id] && live(r); });
  if (S.tab === 'archive') return list.filter(function (r) { return S.archived[r.id] || S.trashed[r.id]; });
  if (S.tab === 'all') return list.filter(live);
  return list.filter(function (r) { return live(r) && !S.closed[r.id]; });
}

function ic(name, size, opts) {
  opts = opts || {};
  var s = size || 20;
  return '<svg class="ic" width="' + s + '" height="' + s + '" viewBox="0 0 24 24"'
    + ' fill="' + (opts.fill || 'none') + '" stroke="currentColor" stroke-width="' + (opts.w || 1.8) + '"'
    + ' stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">'
    + PATHS[name] + '</svg>';
}

/* ── 5. 공통 조각 ──────────────────────────────────────────────── */

function avatar(initial, tone, size) {
  return '<span class="avatar ' + (size ? 'avatar--' + size + ' ' : '') + 'tone-' + tone + '" aria-hidden="true">'
    + esc(initial) + '</span>';
}

function field(opts) {
  var filled = String(opts.value || '').trim().length > 0;
  return '<input class="' + cls('field', opts.lg && 'field--lg', filled && 'is-filled') + '"'
    + ' data-k="' + opts.k + '" data-input="' + opts.action + '"'
    + (opts.arg != null ? ' data-arg="' + esc(opts.arg) + '"' : '')
    + ' id="' + opts.k + '" type="' + (opts.type || 'text') + '"'
    + ' inputmode="' + (opts.inputmode || 'text') + '"'
    + ' value="' + esc(opts.value || '') + '"'
    + ' placeholder="' + esc(opts.ph || '') + '">';
}

/* 라벨은 입력칸 위에 따로 둡니다 — 플레이스홀더로 대신하지 않습니다 */
function labeled(id, label, required, inner) {
  return '<label class="field-label" for="' + id + '">' + esc(label)
    + (required ? ' <span class="req">필수</span>' : '') + '</label>' + inner;
}

function iconBtn(action, label, icon, extraClass, arg) {
  return '<button type="button" class="' + cls('btn', 'btn--icon', extraClass) + '"'
    + ' data-act="' + action + '"' + (arg != null ? ' data-arg="' + esc(arg) + '"' : '')
    + ' aria-label="' + esc(label) + '" title="' + esc(label) + '">' + icon + '</button>';
}

function badgeStyle(tone) {
  var map = {
    ok:     'color:var(--ok);background:var(--ok-soft)',
    warn:   'color:var(--warn);background:var(--warn-soft)',
    danger: 'color:var(--danger);background:var(--danger-soft)',
    accent: 'color:var(--accent-ink);background:var(--accent-soft)',
    plain:  'color:var(--ink-2);background:var(--canvas-2)'
  };
  return map[tone] || map.plain;
}

/* ── 9. 레일 / 환자 목록 ───────────────────────────────────────── */

function roomRow(r, active) {
  var badges = [];
  badges.push('<span class="badge">문의 ' + r.threads.length + '건</span>');
  if (S.closed[r.id] && !S.archived[r.id] && !S.trashed[r.id]) {
    badges.push('<span class="badge" style="background:var(--line);color:var(--ink-2)">종료</span>');
  }
  if (S.trashed[r.id]) {
    badges.push('<span class="badge badge--danger">삭제 예정 30일</span>');
  } else if (S.archived[r.id]) {
    badges.push('<span class="badge" style="background:var(--line);color:var(--ink-2)">보관됨</span>');
  }
  if (r.unread && live(r)) {
    badges.push('<span class="badge badge--count">' + r.unread + '<span class="sr-only">건 안 읽음</span></span>');
  }

  return '<button type="button" class="' + cls('room-row', active && 'is-active') + '"'
    + ' data-act="open" data-arg="' + esc(r.id) + '"' + (active ? ' aria-current="true"' : '') + '>'
    + avatar(r.initial, r.tone)
    + '<span class="grow truncate" style="display:block">'
      + '<span class="room-row__top">'
        + '<span class="room-row__name truncate">' + esc(r.name) + '</span>'
        + '<span class="room-row__when num">' + esc(r.when) + '</span>'
      + '</span>'
      + '<span class="room-row__summary truncate" style="display:block">' + esc(r.summary) + '</span>'
      + '<span class="room-row__last truncate" style="display:block">' + esc(r.last) + '</span>'
      + '<span class="room-row__meta">' + badges.join('') + '</span>'
    + '</span>'
  + '</button>';
}

function stateTabs() {
  var c = tabCounts();
  return [['all','전체',c.all],['open','진행 중',c.open],['unread','안 읽음',c.unread],
          ['closed','종료',c.closed],['archive','보관함',c.archive]].map(function (t) {
    return '<button type="button" class="' + cls('chip', S.tab === t[0] && 'is-active') + '"'
      + ' data-act="tab" data-arg="' + t[0] + '" aria-pressed="' + (S.tab === t[0]) + '">'
      + esc(t[1]) + ' <span class="num">' + t[2] + '</span></button>';
  }).join('');
}

function roomListBody() {
  var list = shownRooms();
  if (!list.length) {
    var titles = { archive:'보관한 대화가 없습니다', closed:'종료한 상담이 없습니다',
      unread:'안 읽은 대화가 없습니다', all:'대화가 없습니다', open:'진행 중인 협진이 없습니다' };
    var bodies = { archive:'보관하면 목록에서 숨기고 여기에 모입니다', closed:'종료해도 기록과 자료는 남습니다',
      unread:'새 메시지가 오면 여기에 표시됩니다', all:'새 협진 요청으로 시작하세요',
      open:'종료된 상담은 전체 또는 종료 탭에 있습니다' };
    return '<div class="empty-state">'
      + '<div class="empty-state__title">' + esc(titles[S.tab]) + '</div>'
      + '<div class="empty-state__body">' + esc(bodies[S.tab]) + '</div></div>';
  }
  return list.map(function (r) {
    return roomRow(r, r.id === S.roomId && (S.page === 'room' || !isMobile()));
  }).join('');
}

function railView() {
  var me = PEOPLE[S.me];
  var unread = S.notiRead ? 0 : NOTIS.filter(function (n) { return n.unread; }).length;
  return '<aside class="rail" aria-label="환자 목록">'
    + '<div class="rail__head">'
      + '<div class="logo" aria-hidden="true">협</div>'
      + '<div class="grow"><div class="t2">협진톡</div></div>'
      + '<button type="button" class="btn btn--icon" data-act="go" data-arg="notis"'
        + ' aria-label="알림' + (unread ? ' · 읽지 않음 ' + unread + '건' : '') + '" style="position:relative">'
        + ic('bell', 20)
        + (unread ? '<span class="tabbar__dot" style="top:9px;margin-left:5px"></span>' : '')
      + '</button>'
    + '</div>'
    + '<div class="rail__tools">'
      + '<div class="searchbox">' + ic('search', 18)
        + '<input type="search" data-k="railq" data-input="globalQ" value="' + esc(S.globalQ) + '"'
        + ' placeholder="환자 · 대화 · 자료 검색" aria-label="전체 검색" data-enter="go:search">'
      + '</div>'
      + '<button type="button" class="btn btn--primary" style="width:100%" data-act="openNew">'
        + ic('plus', 18) + '새 협진 요청</button>'
    + '</div>'
    + '<div class="rail__tabs" role="group" aria-label="상태 필터">' + stateTabs() + '</div>'
    + '<div class="scroll" data-sk="rail" style="padding:0 var(--s4) var(--s4)">' + roomListBody() + '</div>'
    + '<div class="rail__foot">'
      + avatar(me.initial, me.tone, 'sm')
      + '<div class="grow truncate"><div class="t4-strong truncate">' + esc(me.name) + '</div>'
        + '<div class="t5 truncate" style="font-weight:500;letter-spacing:0;color:var(--ink-3)">' + esc(me.org) + '</div></div>'
      + iconBtn('go', '내 정보', ic('user', 18), 'btn--quiet', 'me')
    + '</div>'
  + '</aside>';
}

/* 모바일 전용 — 환자 목록 화면 */
function roomsScreen() {
  var unread = S.notiRead ? 0 : NOTIS.filter(function (n) { return n.unread; }).length;
  return '<div class="screen">'
    + '<div class="screen__head">'
      + '<div class="logo" aria-hidden="true">협</div>'
      + '<div class="grow"><div class="t2">협진톡</div></div>'
      + iconBtn('openNew', '새 협진 요청', ic('plus', 20), 'btn--quiet')
    + '</div>'
    + '<div class="rail__tabs" style="background:var(--surface);border-bottom:1px solid var(--line)"'
      + ' role="group" aria-label="상태 필터">' + stateTabs() + '</div>'
    + '<div class="screen__body" data-sk="rooms" style="padding:var(--s4)">' + roomListBody() + '</div>'
  + '</div>' + (unread ? '' : '');
}

/* ── 10. 협진 방 ───────────────────────────────────────────────── */

function visibleMsgs(room) {
  var active = S.topic === 'all' ? room.threads : room.threads.filter(function (t) { return t.id === S.topic; });
  var out = [];
  active.forEach(function (t) {
    threadMsgs(room.id, t.id).forEach(function (m) {
      var copy = {};
      for (var k in m) copy[k] = m[k];
      copy.topic = t.label;
      out.push(copy);
    });
  });
  var q = S.query.trim();
  if (S.searchOpen && q) {
    out = out.filter(function (m) {
      return (m.body || '').indexOf(q) >= 0 || (m.file || '').indexOf(q) >= 0 || (m.img || '').indexOf(q) >= 0;
    });
  }
  return out;
}

function msgView(m, prev) {
  var p = PEOPLE[m.who] || PEOPLE.han;
  var mine = m.who === S.me;
  var grouped = prev && prev.who === m.who && !m.day;
  var newTopic = S.topic === 'all' && (!prev || prev.topic !== m.topic);
  var out = '';

  if (newTopic) {
    out += '<div class="divider-topic">'
      + '<span class="divider-topic__line divider-topic__line--short"></span>'
      + '<span class="divider-topic__label">' + esc(m.topic) + '</span>'
      + '<span class="divider-topic__line"></span></div>';
  } else if (m.day) {
    out += '<div class="divider-day"><span>' + esc(m.day) + '</span></div>';
  }

  /* 통화 기록 같은 시스템 줄은 말풍선이 아니라 가운데 한 줄로 남깁니다 */
  if (m.system) {
    return out + '<div class="msg-system">'
      + ic('phone', 13)
      + '<span>' + esc(m.body) + '</span>'
      + '<span class="num" style="color:var(--ink-3)">' + esc(m.when) + '</span>'
    + '</div>';
  }

  var linked = m.fileId ? fileById(S.roomId, m.fileId) : null;

  /* 첨부에 붙는 자동 계측 캡션. 의사가 쓴 소견과 섞이지 않게 '자동 계측' 배지를 답니다. */
  function captionOf(f) {
    if (!f || !f.caption) return '';
    return '<button type="button" class="bubble__caption" data-act="openFileDetail" data-arg="' + esc(f.id) + '">'
      + '<span class="badge--auto">자동 계측</span>'
      + '<span class="bubble__caption-text">' + esc(f.caption) + '</span>'
      + ic('next', 14)
    + '</button>';
  }

  var inner = '';
  if (m.body) inner += esc(m.body).replace(/\n/g, '<br>');
  if (m.img) {
    inner += '<span class="bubble__media" style="' + (m.body ? 'margin-top:9px' : 'margin-top:0') + '" role="img"'
      + ' aria-label="' + esc(m.img) + '">'
      + '<span class="bubble__media-tag">' + esc(m.imgTag || '사진') + '</span>'
      + '<span class="t5" style="font-weight:500;letter-spacing:0;color:var(--ink-2)">' + esc(m.img) + '</span></span>';
    inner += captionOf(linked);
  }
  if (m.file) {
    inner += '<span class="bubble__file" style="' + (m.body ? 'margin-top:9px' : 'margin-top:0') + '">'
      + '<span class="bubble__file-icon">' + ic('file', 16) + '</span>'
      + '<span class="grow truncate" style="display:block">'
        + '<span class="bubble__file-name truncate">' + esc(m.file) + '</span>'
        + '<span class="bubble__file-meta truncate">' + esc(m.fileSize || '') + '</span>'
      + '</span></span>';
    inner += captionOf(linked);
  }

  out += '<div class="' + cls('msg', mine && 'msg--mine', grouped && !mine && 'msg--grouped') + '">'
    + (!mine && !grouped ? avatar(p.initial, p.tone, 'sm') : '')
    + '<div class="msg__col">'
      + (!mine && !grouped ? '<span class="msg__name">' + esc(p.name) + '</span>' : '')
      + '<div class="bubble">' + inner + '</div>'
      + '<div class="msg__meta">'
        + (m.star ? '<span class="msg__star">' + ic('star', 12, { fill:'currentColor', w:1 }) + ' 중요</span>' : '')
        + '<span class="msg__time num">' + esc(m.when) + '</span>'
      + '</div>'
    + '</div>'
  + '</div>';
  return out;
}

/* 상담 요약 카드. 종료 시점에 대화 맨 끝에 남고, 방 관리에서도 열어 볼 수 있습니다. */
function summaryBody(room) {
  var x = buildSummary(room);

  var flow = x.threads.map(function (t) {
    return '<li class="sum__item">'
      + '<div class="sum__item-head">'
        + '<span class="t4-strong">' + esc(t.label) + '</span>'
        + '<span class="badge">' + t.count + '건</span>'
        + (t.files ? '<span class="badge">자료 ' + t.files + '</span>' : '')
        + (t.waiting ? '<span class="badge badge--danger">답변 대기</span>' : '')
      + '</div>'
      + '<div class="sum__line"><span class="sum__who">' + esc(t.openedBy) + '</span>'
        + esc(t.opened) + '</div>'
      + (t.closed
          ? '<div class="sum__line"><span class="sum__who">' + esc(t.closedBy) + '</span>'
            + esc(t.closed) + '</div>'
          : '')
    + '</li>';
  }).join('');

  var starred = x.starred.length
    ? x.starred.map(function (m) {
        return '<li class="sum__line sum__line--star">'
          + ic('star', 13, { fill:'currentColor', w:1 })
          + '<span class="sum__who">' + esc(m.who) + '</span>'
          + '<span>' + esc(m.body) + '</span>'
        + '</li>';
      }).join('')
    : '<li class="sum__line"><span class="muted">중요로 표시된 의견이 없습니다.</span></li>';

  return '<div class="sum">'
    + '<div class="sum__meta">'
      + '<div><span class="digest__k">기간</span><span class="digest__v">' + esc(x.span) + '</span></div>'
      + '<div><span class="digest__k">대화</span><span class="digest__v">' + x.msgCount + '건</span></div>'
      + '<div><span class="digest__k">참여</span><span class="digest__v">' + x.members.length + '명</span></div>'
      + '<div><span class="digest__k">자료</span><span class="digest__v">' + x.files.count + '건</span></div>'
    + '</div>'

    + '<h4 class="sum__h">어떻게 시작했나</h4>'
    + '<p class="sum__line"><span class="sum__who">' + esc(x.openedBy) + '</span>' + esc(x.opened) + '</p>'

    + '<h4 class="sum__h">어떻게 진행됐나</h4>'
    + '<ol class="sum__list">' + flow + '</ol>'

    + '<h4 class="sum__h">핵심 의견</h4>'
    + '<ul class="sum__list">' + starred + '</ul>'

    + (x.calls.length
        ? '<h4 class="sum__h">통화</h4>'
          + '<ul class="sum__list">' + x.calls.map(function (c) {
              return '<li class="sum__line">' + esc(c.kind === 'video' ? '영상' : '음성')
                + ' · ' + esc(c.dur) + ' · ' + esc(c.with) + '</li>';
            }).join('') + '</ul>'
        : '')

    + '<h4 class="sum__h">남긴 자료</h4>'
    + '<p class="sum__line">' + esc(x.files.kinds || '없음')
      + (x.files.metrics ? ' · 자동 계측 ' + x.files.metrics + '개'
          + (x.files.flagged ? ' (눈여겨볼 값 ' + x.files.flagged + ')' : '') : '')
    + '</p>'

    + '<h4 class="sum__h">남은 것</h4>'
    + '<p class="sum__line">'
      + (x.pending.length
          ? esc(x.pending.map(function (t) { return t.label; }).join(', ')) + ' — 아직 답변이 없습니다.'
          : '답변을 기다리는 문의가 없습니다.')
    + '</p>'

    + '<p class="sum__note">대화에서 그대로 뽑아 정리한 내용입니다. 의무기록이 아니며, '
      + '진단·처방을 담지 않습니다.</p>'
  + '</div>';
}

function summaryCard(room) {
  return '<div class="sum-card">'
    + '<div class="sum-card__head">'
      + ic('list', 16)
      + '<span class="t4-strong grow">상담 요약</span>'
      + '<span class="badge--auto">자동 정리</span>'
    + '</div>'
    + summaryBody(room)
  + '</div>';
}

function topicBar(room) {
  if (S.searchOpen) {
    var hits = visibleMsgs(room).length;
    return '<div class="topic-bar"><div class="topic-bar__row">'
      + '<div class="searchbox grow" style="min-height:40px">' + ic('search', 18)
        + '<input type="search" data-k="roomq" data-input="query" value="' + esc(S.query) + '"'
        + ' style="height:40px" placeholder="이 방에서 검색" aria-label="이 방에서 검색" autofocus>'
        + (S.query.trim() ? '<span class="t5 num" style="flex:none;color:var(--ink-3)">' + hits + '건</span>' : '')
      + '</div>'
      + '<button type="button" class="btn btn--quiet" style="flex:none" data-act="closeSearch">취소</button>'
    + '</div></div>';
  }

  var all = room.threads.reduce(function (n, t) { return n + threadMsgs(room.id, t.id).length; }, 0);
  var chips = [{ id:'all', label:'전체', auto:false, n:all }].concat(room.threads.map(function (t) {
    return { id:t.id, label:t.label, auto:true, n:threadMsgs(room.id, t.id).length };
  })).map(function (t) {
    var on = t.id === S.topic;
    return '<button type="button" class="' + cls('chip', on && 'is-active') + '"'
      + ' data-act="topic" data-arg="' + esc(t.id) + '" aria-pressed="' + on + '">'
      + esc(t.label)
      + (t.auto ? '<span class="badge--auto" style="' + (on ? 'color:var(--accent-ink);background:#fff' : '') + '">자동</span>' : '')
      + '<span class="num" style="' + (on ? 'color:rgba(255,255,255,.8)' : 'color:var(--ink-3)') + '">' + t.n + '</span>'
    + '</button>';
  }).join('');

  return '<div class="topic-bar"><div class="topic-bar__row">'
    + '<div class="topic-bar__chips" role="group" aria-label="주제 필터">' + chips + '</div>'
    + iconBtn('openSearch', '이 방에서 검색', ic('search', 18), 'btn--quiet')
    + '<button type="button" class="btn btn--quiet" style="flex:none" data-act="openFiles">'
      + ic('image', 18) + '자료 ' + filesOf(room.id).length + '</button>'
  + '</div></div>';
}

function roomView() {
  var room = roomById(S.roomId);
  var closed = !!S.closed[room.id], archived = !!S.archived[room.id], trashed = !!S.trashed[room.id];
  var banner = '';

  if (trashed || archived || closed) {
    var text = trashed ? '삭제 예정입니다. 30일 뒤 영구 삭제되며 그 전에는 복구할 수 있습니다.'
      : (archived ? '보관된 대화입니다. 목록에서는 숨겨지고 보관함과 검색에서 찾을 수 있습니다.'
      : '종료된 상담입니다. 기록과 자료는 그대로 남아 있습니다.');
    var action = trashed ? '복구' : (archived ? '보관 해제' : '다시 열기');
    banner = '<div class="' + cls('state-banner', trashed && 'state-banner--danger') + '">'
      + '<span class="state-banner__text">' + esc(text) + '</span>'
      + (closed && !trashed && !archived
          ? '<button type="button" class="state-banner__action" data-act="openSummary">요약</button>'
          : '')
      + '<button type="button" class="state-banner__action" data-act="bannerAction">' + esc(action) + '</button>'
    + '</div>';
  }

  var msgs = visibleMsgs(room);
  var thread;
  if (S.searchOpen && S.query.trim() && !msgs.length) {
    thread = '<div class="empty-state"><div class="empty-state__title">찾는 내용이 없습니다</div>'
      + '<div class="empty-state__body">다른 말로 검색해 보세요</div></div>';
  } else {
    thread = msgs.map(function (m, i) { return msgView(m, msgs[i - 1]); }).join('');
    /* 상담이 끝나면 그 시점까지의 대화를 정리해 맨 끝에 남깁니다 */
    if (closed && !S.searchOpen) thread += summaryCard(room);
  }

  var canSend = S.draft.trim().length > 0 || S.pendingFile;

  return '<main class="main">'
    + banner
    + '<header class="room-header">'
      + (isMobile() ? iconBtn('go', '환자 목록으로', ic('back', 20), 'btn--quiet', 'rooms') : '')
      + avatar(room.initial, room.tone, 'md')
      + '<div class="room-header__title truncate">'
        + '<div class="t2 truncate">' + esc(room.name) + '</div>'
        + '<div class="t4 truncate">' + esc(room.chips.join(' · ')) + ' · 참여 ' + memberKeys().length + '명</div>'
      + '</div>'
      + iconBtn('startVoice', '음성 협진 통화', ic('phone', 18), 'btn--quiet')
      + iconBtn('startVideo', '영상 협진 통화', ic('video', 18), 'btn--quiet')
      + (isMobile() ? '' : '<button type="button" class="' + cls('btn', S.panelOpen ? 'btn--ghost' : 'btn--quiet')
          + '" style="flex:none;' + (S.panelOpen ? 'background:var(--accent-soft);color:var(--accent-ink)' : '') + '"'
          + ' data-act="togglePanel" aria-pressed="' + S.panelOpen + '">'
          + ic('panel', 18) + (S.panelOpen ? '패널 닫기' : '환자 정보') + '</button>')
      + '<button type="button" class="btn btn--quiet" style="flex:none" data-act="openMenu">방 관리</button>'
    + '</header>'
    + topicBar(room)
    + '<div class="thread" data-sk="thread" id="thread">' + thread + '</div>'
    + '<div class="composer">'
      + (S.pendingFile
          ? '<div class="attach-pending">' + ic('check', 16)
            + '<span class="grow">knee_standing_AP.dcm · 환자 정보 삭제됨</span>'
            + iconBtn('clearFile', '첨부 취소', ic('x', 16), '') + '</div>'
          : '')
      + '<div class="composer__row">'
        + iconBtn('attach', '자료 첨부', ic('clip', 20), 'btn--quiet')
        + '<textarea class="composer__input" data-k="draft" data-input="draft" data-enter="send"'
          + ' placeholder="' + (closed ? '종료된 상담입니다. 다시 열면 이어서 쓸 수 있습니다' : '의견을 입력하세요') + '"'
          + ' aria-label="메시지 입력" rows="1">' + esc(S.draft) + '</textarea>'
        + '<button type="button" class="' + cls('btn', 'btn--icon', canSend ? 'btn--primary' : 'btn--primary is-disabled') + '"'
          + ' data-act="send" aria-label="보내기"' + (canSend ? '' : ' aria-disabled="true"') + '>' + ic('send', 18) + '</button>'
      + '</div>'
      + '<div class="composer__opts">'
        + '<button type="button" class="row" style="gap:var(--s2)" data-act="toggleStar"'
          + ' aria-pressed="' + S.star + '">'
          + '<span class="' + cls('check', 'check--star', S.star && 'is-on') + '">' + ic('check', 12, { w:2.6 }) + '</span>'
          + '<span class="t4' + (S.star ? '-strong' : '') + '" style="color:' + (S.star ? 'var(--warn)' : 'var(--ink-2)') + '">중요 표시</span>'
        + '</button>'
        + '<span class="grow"></span>'
        + '<span class="t5" style="color:var(--ink-3);font-weight:500;letter-spacing:0">자료 보관 기한 없음</span>'
      + '</div>'
    + '</div>'
  + '</main>';
}

/* ── 11. 환자 정보 · 자료 패널 ─────────────────────────────────── */

function fileCard(f, withCaption) {
  return '<div class="file-card">'
    + '<div class="file-card__thumb">'
      + '<span class="file-card__tag">' + esc(f.tag) + '</span>'
      + '<span>' + esc(f.name) + '</span>'
    + '</div>'
    + (withCaption && f.caption
        ? '<div class="file-card__caption">'
          + '<span class="badge--auto">자동 계측</span> ' + esc(f.caption)
        + '</div>'
        : '')
  + '</div>';
}

/* 자료 하나를 계측표까지 펼쳐 보여줍니다 */
function fileDetail(f) {
  var rows = (f.metrics || []).map(function (m) {
    var fg = m[2] === 'warn' ? 'var(--warn)' : (m[2] === 'ok' ? 'var(--ok)' : 'var(--ink-2)');
    return '<div class="metric-row">'
      + '<span class="metric-row__k">' + esc(m[0]) + '</span>'
      + '<span class="metric-row__v" style="color:' + fg + '">' + esc(m[1]) + '</span>'
    + '</div>';
  }).join('');
  return '<div class="file-detail">'
    + '<div class="file-detail__head">'
      + '<span class="badge badge--accent">' + esc(f.tag) + '</span>'
      + '<span class="t3-strong grow truncate">' + esc(f.name) + '</span>'
      + '<span class="t5" style="color:var(--ink-3);font-weight:500;letter-spacing:0">'
        + esc(f.when) + ' · ' + esc(f.size || '') + '</span>'
    + '</div>'
    + (rows ? '<div class="metric-grid">' + rows + '</div>' : '')
    + (f.note ? '<p class="t4" style="margin:var(--s4) 0 0;color:var(--ink-2)">' + esc(f.note) + '</p>' : '')
  + '</div>';
}

function panelView() {
  var room = roomById(S.roomId);
  var files = filesOf(room.id);
  var tabs = [['info','환자 정보'],['files','자료 ' + files.length]].map(function (t) {
    return '<button type="button" class="' + cls('panel__tab', S.panel === t[0] && 'is-active') + '"'
      + ' data-act="panel" data-arg="' + t[0] + '" aria-pressed="' + (S.panel === t[0]) + '">' + esc(t[1]) + '</button>';
  }).join('');

  var body;
  if (S.panel === 'info') {
    var members = memberKeys().map(function (k) {
      var p = PEOPLE[k];

/* ── 12. 전역 검색 ─────────────────────────────────────────────── */

function searchResults() {
  var q = S.globalQ.trim();
  if (!q) return { patients:[], msgs:[], files:[] };
  var list = pool();
  var patients = list.filter(function (r) {
    return (r.name + ' ' + r.summary + ' ' + r.chips.join(' ')).indexOf(q) >= 0;
  });
  var msgs = [];
  list.forEach(function (r) {
    r.threads.forEach(function (t) {
      threadMsgs(r.id, t.id).forEach(function (m) {
        if ((m.body || '').indexOf(q) >= 0) {
          var p = PEOPLE[m.who] || PEOPLE.han;
          msgs.push({ rid:r.id, room:r.name, who:p.name, when:m.when, body:m.body });
        }
      });
    });
  });
  var files = [];
  list.forEach(function (r) {
    filesOf(r.id).forEach(function (f) {
      if ((f.name + f.tag + (f.caption || '') + r.name + r.summary).indexOf(q) >= 0) {
        files.push({ kind:f.name, tag:f.tag, room:r.name, when:f.when, caption:f.caption });
      }
    });
  });
  return { patients:patients, msgs:msgs.slice(0, 5), files:files.slice(0, 6) };
}

function searchScreen() {
  var r = searchResults();
  var body = '';

  if (!S.globalQ.trim()) {
    body = '<div class="empty-state"><div class="empty-state__title">환자 · 대화 · 자료를 한 번에 찾습니다</div>'
      + '<div class="empty-state__body">보관한 대화도 검색에는 잡힙니다</div></div>';
  } else if (!r.patients.length && !r.msgs.length && !r.files.length) {
    body = '<div class="empty-state"><div class="empty-state__title">찾는 내용이 없습니다</div>'
      + '<div class="empty-state__body">환자 이름, 부위, 자료 이름으로도 찾을 수 있습니다</div></div>';
  } else {
    if (r.patients.length) {
      body += '<h2 class="sec-label">환자 ' + r.patients.length + '명</h2>'
        + r.patients.map(function (p) {
          return '<button type="button" class="result-row" data-act="open" data-arg="' + esc(p.id) + '">'
            + avatar(p.initial, p.tone)
            + '<span class="grow truncate" style="display:block">'
              + '<span class="t3-strong truncate" style="display:block">' + esc(p.name) + '</span>'
              + '<span class="room-row__summary truncate" style="display:block;margin:0">' + esc(p.summary) + '</span>'
            + '</span>' + ic('next', 18)
          + '</button>';
        }).join('');
    }
    if (r.msgs.length) {
      body += '<h2 class="sec-label">대화 ' + r.msgs.length + '건</h2>'
        + r.msgs.map(function (m) {
          return '<button type="button" class="result-card" data-act="open" data-arg="' + esc(m.rid) + '">'
            + '<span class="t4-strong" style="color:var(--accent)">' + esc(m.room) + '</span>'
            + '<span class="t5" style="display:block;font-weight:500;letter-spacing:0;color:var(--ink-3);margin:2px 0 5px">'
              + esc(m.who) + ' · ' + esc(m.when) + '</span>'
            + '<span class="t4" style="display:block;color:var(--ink-1)">' + esc(m.body) + '</span>'
          + '</button>';
        }).join('');

    if (r.files.length) {

        + '<div class="thumb-grid">' + r.files.map(function (f) {

          + '</div></div>';
        }).join('') + '</div>';

  return '<div class="screen">'

        + ' placeholder="환자 · 대화 · 자료 검색" aria-label="전체 검색">'
        + (S.globalQ ? iconBtn('clearGlobalQ', '검색어 지우기', ic('x', 16), '') : '')
      + '</div>'
    + '</div>'

  + '</div>';
}

  if (!d.count) return '';

    + '<div class="digest__head">'
      + ic('chart', 16)
      + '<span class="t5" style="color:var(--accent-ink)">자료 분석 정리</span>'
      + '<span class="badge--auto">자동</span>'
    + '</div>'
    + '<div class="digest__grid">'
      + '<div><span class="digest__k">자료</span><span class="digest__v">' + d.count + '건</span></div>'
      + '<div><span class="digest__k">종류</span><span class="digest__v">' + esc(d.kinds) + '</span></div>'
      + '<div><span class="digest__k">기간</span><span class="digest__v">' + esc(d.span) + '</span></div>'
      + '<div><span class="digest__k">계측값</span><span class="digest__v">' + d.metrics + '개'
        + (d.flagged ? ' <span style="color:var(--warn)">· 눈여겨볼 값 ' + d.flagged + '</span>' : '') + '</span></div>'
    + '</div>'
  + '</div>';
}

    { act:'toggleClosed', icon: S.closed[id] ? 'reopen' : 'checkc',

    { act:'toggleArchived', icon:'archive',
      label: S.archived[id] ? '보관 해제' : '대화 보관',
      sub: S.archived[id] ? '진행 중 목록으로 되돌립니다' : '목록에서 숨기고 보관함으로 옮깁니다', tone:'plain' },
    { act:'exportRoom', icon:'down', label:'대화 내보내기', sub:'PDF로 전체 기록과 자료 목록을 받습니다', tone:'plain' },
    { act:'toggleTrashed', icon:'trash',

      + ' data-act="' + m.act + '">'

      + '<span class="grow" style="display:block">'
        + '<span class="action-card__label"' + (m.tone === 'danger' ? ' style="color:var(--danger)"' : '') + '>'
          + esc(m.label) + '</span>'
        + '<span class="action-card__sub"' + (m.tone === 'danger' ? ' style="color:#8A5B58"' : '') + '>'
          + esc(m.sub) + '</span>'

  }).join('');
}

function sheetView() {

    menu:   { w:'modal--sm',   title:'방 관리',     sub:room.name, body:menuSheetBody, action:null }

              + ' data-act="submitSheet"' + (canSubmit ? '' : ' aria-disabled="true"') + '>'

/* ── 16-2. 협진 통화 ────────────────────────────────────────────
   화면 흐름만 시연합니다. 시그널링 서버와 TURN이 없어 실제로 두 의사가
   연결되지는 않으며, 그 사실을 화면 안에 적어 둡니다. */

function callTargetKey() {
  var keys = memberKeys().filter(function (k) { return k !== S.me; });
  return keys[0] || 'kim';
}

function callDuration(sec) {
  var m = Math.floor(sec / 60), r = sec % 60;
  return m + '분 ' + (r < 10 ? '0' + r : r) + '초';
}
function callClock(sec) {
  var m = Math.floor(sec / 60), r = sec % 60;
  return (m < 10 ? '0' + m : m) + ':' + (r < 10 ? '0' + r : r);
}

function callView() {
  var c = S.call;
  if (!c) return '';
  var p = PEOPLE[c.who] || PEOPLE.kim;
  var room = roomById(c.roomId);
  var video = c.kind === 'video';
  var connecting = c.phase === 'connecting';

  var stage = video && !connecting
    ? '<div class="call__stage">'
        + '<div class="call__remote">'
          + '<span class="call__placeholder">' + esc(p.name) + '의 화면</span>'
        + '</div>'
        + '<div class="call__self">'
          + '<span class="call__placeholder">' + (c.cam ? '내 화면' : '카메라 꺼짐') + '</span>'
        + '</div>'
      + '</div>'
    : '<div class="call__stage call__stage--voice">'
        + avatar(p.initial, p.tone, 'lg')
        + '<div class="call__name">' + esc(p.name) + '</div>'
        + '<div class="call__org">' + esc(p.org) + '</div>'
      + '</div>';

  var controls = [
    { act:'toggleMute', on:c.mute, icon: c.mute ? 'micOff' : 'mic', label: c.mute ? '음소거 해제' : '음소거' },
    video ? { act:'toggleCam', on:!c.cam, icon: c.cam ? 'video' : 'videoOff', label: c.cam ? '카메라 끄기' : '카메라 켜기' } : null
  ].filter(Boolean).map(function (b) {
    return '<button type="button" class="' + cls('call__btn', b.on && 'is-off') + '"'
      + ' data-act="' + b.act + '" aria-pressed="' + !!b.on + '" aria-label="' + esc(b.label) + '">'
      + ic(b.icon, 22) + '</button>';
  }).join('');

  return '<div class="call" role="dialog" aria-modal="true" aria-label="협진 통화">'
    + '<div class="call__top">'
      + '<span class="badge badge--accent">' + (video ? '영상' : '음성') + ' 협진 통화</span>'
      + '<span class="call__room truncate">' + esc(room.name) + '</span>'
      + '<span class="call__timer num" data-call-timer>'
        + (connecting ? '연결 중…' : callClock(c.sec)) + '</span>'
    + '</div>'
    + stage
    + '<div class="call__bar">'
      + controls
      + '<button type="button" class="call__btn call__btn--end" data-act="endCall" aria-label="통화 종료">'
        + ic('phoneOff', 22) + '</button>'
    + '</div>'
    + '<p class="call__note">데모 화면입니다. 실제 통화는 연결되지 않습니다. '
      + '통화 시각과 참여자는 감사 로그에 남습니다.</p>'
  + '</div>';
}

/* ── 17. 앱 조립 ───────────────────────────────────────────────── */

function mainArea() {
  var page = S.page;
  if (page === 'search') return searchScreen();
  if (page === 'notis') return notisScreen();

function railResizer() {
  return '<div class="rail-resizer" data-resizer="1" role="separator" aria-orientation="vertical"'
    + ' aria-label="환자 목록 폭 조절" aria-valuemin="' + RAIL_MIN + '" aria-valuemax="' + RAIL_MAX + '"'
    + ' aria-valuenow="' + railWidth + '" tabindex="0"></div>';
}

function appView() {
  var showPanel = !isMobile() && S.page === 'room' && S.panelOpen;
  return '<div class="shell">'
      + (isMobile() ? '' : railView() + railResizer())
      + mainArea()

function view() {
