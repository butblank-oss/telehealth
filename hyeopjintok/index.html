<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>협진톡 — 의사 간 협진 메신저</title>
<meta name="description" content="베트남 현지 의사와 한국 의사가 환자별로 대화하고 자료를 남기는 폐쇄형 협진 메신저. 환자 1명 = 방 1개, 자료 보관 기한 없음. 의료법 제34조 원격협력 구조의 의사 간 커뮤니케이션 도구입니다.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1B64DA">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231B64DA'/%3E%3Ctext x='16' y='22' font-family='sans-serif' font-size='17' font-weight='700' fill='%23fff' text-anchor='middle'%3E%ED%98%91%3C/text%3E%3C/svg%3E">
<style>
/* ==========================================================================
   협진톡 (HyeopjinTalk) — Design System
   의사 간 협진 메신저 · 채도를 낮춘 진료실 도구 톤
   ========================================================================== */


/* --------------------------------------------------------------------------
   1. Tokens
   -------------------------------------------------------------------------- */

:root {
  /* 토스 톤(TDS) 기반. 값은 전부 흰 배경/면 위에서 4.5:1을 넘도록 한 단계씩
     낮춰 잡았습니다 — 토스 원색(blue500 #3182F6, red500 #F04452)은 작은 글자에
     쓰면 3.7:1이라 이 디자인의 대비 규칙을 지키지 못합니다. */

  /* Ink — 텍스트 3단계 (grey900 / grey700 / grey600 계열) */
  --ink-1: #191F28;
  --ink-2: #4E5968;
  --ink-3: #5C6675;

  /* Surface — 면 */
  --surface: #FFFFFF;
  --canvas: #F2F4F6;
  --canvas-2: #EAEDF1;
  --page: #E8EBEE;
  --line: #E5E8EB;
  --line-2: #D1D6DB;

  /* Accent — 토스 블루 */
  --accent: #1B64DA;
  --accent-ink: #1250B0;
  --accent-soft: #E8F3FF;
  --accent-field: #EFF5FF;

  /* Status */
  --ok: #07734B;
  --ok-soft: #E6F6EF;
  --warn: #8F5500;
  --warn-soft: #FDF3E3;
  --danger: #C41F30;
  --danger-soft: #FDECEE;

  /* Etc */
  --disabled: #D1D6DB;
  --placeholder: #5C6675;
  --media: #DDE1E6;

  /* Avatar tones */
  --tone-steel-fg: #1B64DA;  --tone-steel-bg: #E8F3FF;
  --tone-sage-fg:  #07734B;  --tone-sage-bg:  #E6F6EF;
  --tone-plum-fg:  #6B3FA0;  --tone-plum-bg:  #F2ECFB;
  --tone-clay-fg:  #93520F;  --tone-clay-bg:  #FBF1E4;
  --tone-slate-fg: #4E5968;  --tone-slate-bg: #EDEFF2;

  /* Typography — 5단계만 */
  --font: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, sans-serif;
  --t1: 22px;    --t1-ls: -0.03em;   --t1-lh: 1.35;
  --t2: 17px;    --t2-ls: -0.025em;  --t2-lh: 1.4;
  --t3: 14.5px;  --t3-lh: 1.6;
  --t4: 13px;    --t4-lh: 1.6;
  --t5: 11.5px;  --t5-ls: 0.02em;

  /* Spacing */
  --s1: 4px;  --s2: 6px;  --s3: 8px;  --s4: 10px; --s5: 12px;
  --s6: 14px; --s7: 16px; --s8: 18px; --s9: 20px; --s10: 22px;

  /* Radius */
  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 12px;
  --r-xl: 14px;
  --r-pill: 999px;

  /* Shadow */
  --sh-card: 0 1px 2px rgba(25, 31, 40, .06);
  --sh-raised: 0 1px 2px rgba(25, 31, 40, .08);
  --sh-frame: 0 1px 2px rgba(25, 31, 40, .08), 0 14px 32px -18px rgba(25, 31, 40, .35);
  --sh-modal: 0 24px 48px -16px rgba(25, 31, 40, .45);

  /* Layout */
  --rail-w: 320px;   /* 상태 탭 3개 + 더보기가 한 줄에 들어가는 폭. 나머지는 더보기 안에 있습니다 */
  --rail-min-w: 260px;
  --rail-max-w: 560px;
  --panel-w: 320px;
  --main-min: 440px;
  --shell-min: 1164px;
  --tap: 44px; /* 최소 터치 타깃 */
}

/* --------------------------------------------------------------------------
   2. Base
   -------------------------------------------------------------------------- */

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--page);
  color: var(--ink-1);
  font-family: var(--font);
  line-height: 1.6;
  word-break: keep-all;
  text-wrap: pretty;
}

a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-ink); }

button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  background: none;
  padding: 0;
  color: inherit;
  text-align: left;
}

input, textarea {
  font-family: inherit;
  resize: none;
  border: none;
  background: transparent;
  color: var(--ink-1);
}

input::placeholder,
textarea::placeholder {
  color: var(--placeholder);   /* 4.5:1 on --canvas */
  font-weight: 400;
}

/* 포커스 링은 제거하지 않습니다 */
input:focus-visible,
textarea:focus-visible,
button:focus-visible,
[tabindex]:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: var(--r-sm);
}

/* --------------------------------------------------------------------------
   3. Typography utilities
   -------------------------------------------------------------------------- */

.t1 { font-size: var(--t1); font-weight: 700; letter-spacing: var(--t1-ls); line-height: var(--t1-lh); }
.t2 { font-size: var(--t2); font-weight: 700; letter-spacing: var(--t2-ls); line-height: var(--t2-lh); }
.t3 { font-size: var(--t3); font-weight: 500; line-height: var(--t3-lh); }
.t3-strong { font-size: var(--t3); font-weight: 600; line-height: var(--t3-lh); }
.t4 { font-size: var(--t4); font-weight: 500; line-height: var(--t4-lh); color: var(--ink-3); }
.t4-strong { font-size: var(--t4); font-weight: 600; line-height: var(--t4-lh); }
.t5 { font-size: var(--t5); font-weight: 700; letter-spacing: var(--t5-ls); color: var(--ink-2); }

.muted { color: var(--ink-3); }
.num { font-variant-numeric: tabular-nums; }
.truncate { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nowrap { white-space: nowrap; }

/* --------------------------------------------------------------------------
   4. Layout — 셸
   각 열에 min-width를 명시하고 컨테이너가 가로 스크롤합니다.
   고정폭 열 + flex:1 본문 조합에서 본문이 0으로 굶는 것을 막기 위함입니다.
   -------------------------------------------------------------------------- */

.frame {
  background: var(--surface);
  border-radius: var(--r-xl);
  overflow-x: auto;
  overflow-y: hidden;
  box-shadow: var(--sh-frame);
}

.shell {
  position: relative;
  display: flex;
  height: 740px;            /* min-height가 아니라 height — 내부 스크롤의 전제 */
  min-width: var(--shell-min);
  overflow: hidden;
}

.rail {
  flex: none;
  width: var(--rail-w);
  min-height: 0;
  background: var(--surface);
  display: flex;
  flex-direction: column;
}

/* 레일 폭 조절 손잡이. 시각적으로는 얇은 구분선(1px)이지만
   히트 영역은 ::before로 넓혀 드래그하기 쉽게 합니다. */
.rail-resizer {
  flex: none;
  width: 1px;
  min-height: 0;
  background: var(--line);
  position: relative;
  cursor: col-resize;
  touch-action: none;
}
.rail-resizer::before {
  content: '';
  position: absolute;
  top: 0; bottom: 0;
  left: -5px; right: -5px;
}
.rail-resizer:hover, .rail-resizer:focus-visible {
  background: var(--accent);
}

.main {
  flex: 1;
  min-width: var(--main-min);
  min-height: 0;
  display: flex;
  flex-direction: column;
  background: var(--canvas);
}

.panel {
  flex: none;
  width: var(--panel-w);
  min-height: 0;
  background: var(--surface);
  display: flex;
  flex-direction: column;
}

/* 스크롤 영역 공통 */
.scroll {
  flex: 1 1 0;
  min-height: 0;
  overflow-y: auto;
}

@media (max-width: 1009px) {
  .shell { flex-direction: column; min-width: 0; height: 760px; }
  .rail, .panel { display: none; }
  .main { min-width: 0; }
}

/* --------------------------------------------------------------------------
   5. Buttons
   -------------------------------------------------------------------------- */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--s2);
  min-height: var(--tap);
  padding: 0 13px;
  border-radius: var(--r-md);
  font-size: var(--t4);
  font-weight: 600;
  white-space: nowrap;
}

.btn--primary { background: var(--accent); color: #fff; }
.btn--primary[disabled],
.btn--primary.is-disabled { background: var(--disabled); color: #fff; cursor: default; }

.btn--quiet { background: var(--canvas); color: var(--ink-2); }
.btn--ghost { background: transparent; color: var(--accent); }
.btn--danger { background: var(--danger-soft); color: var(--danger); }

.btn--lg { height: 50px; font-size: 15px; }
.btn--icon { width: var(--tap); height: var(--tap); padding: 0; }

/* 아이콘 전용 버튼에는 반드시 aria-label */

/* --------------------------------------------------------------------------
   6. Fields — 테두리 없이 면으로 구분
   비었을 때 회색 면, 값이 들어오면 배경이 진해지고 글자가 굵어집니다.
   -------------------------------------------------------------------------- */

.field-label {
  display: block;
  font-size: var(--t5);
  font-weight: 700;
  letter-spacing: var(--t5-ls);
  color: var(--ink-2);
  margin-bottom: var(--s2);
}
.field-label .req { color: var(--danger); }

.field {
  width: 100%;
  height: var(--tap);
  border-radius: var(--r-md);
  padding: 0 12px;
  font-size: 14px;
  background: var(--canvas);
  font-weight: 400;
}
.field--lg { height: 48px; font-size: var(--t3); padding: 0 14px; }
.field.is-filled { background: var(--accent-field); font-weight: 600; }

.field-hint {
  font-size: var(--t4);
  color: var(--ink-3);
  line-height: 1.6;
  margin-top: var(--s2);
}

.field-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(112px, 1fr));
  gap: var(--s3);
}

/* 읽기 전용 값 표시 */
.field-readonly {
  height: 48px;
  border-radius: var(--r-md);
  background: var(--canvas-2);
  display: flex;
  align-items: center;
  padding: 0 14px;
  font-size: var(--t3);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}

.field-code {
  height: 48px;
  border-radius: var(--r-md);
  background: var(--accent-field);
  box-shadow: inset 0 0 0 1.5px var(--accent);
  display: flex;
  align-items: center;
  padding: 0 14px;
}
.field-code .code { flex: 1; font-size: var(--t3); font-weight: 600; letter-spacing: .32em; font-variant-numeric: tabular-nums; }
.field-code .timer { flex: none; font-size: var(--t4); font-weight: 600; color: var(--danger); font-variant-numeric: tabular-nums; }

/* --------------------------------------------------------------------------
   7. Chips / Badges
   -------------------------------------------------------------------------- */

/* 값이 몇 개 안 되는 선택. 입력칸과 같은 면·높이·모서리를 쓰고
   오른쪽 꺾쇠로만 "고르는 칸"임을 알립니다. 고르기 전에는 [선택]이
   자리를 지키고, 고르면 입력칸이 채워졌을 때와 같은 색이 됩니다. */
.pick-field {
  width: 100%;
  height: var(--tap);
  border: 0;
  border-radius: var(--r-md);
  padding: 0 32px 0 12px;
  font-size: 14px;
  font-weight: 400;
  background: var(--canvas) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%234E5968' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>") no-repeat right 10px center;
  color: var(--placeholder);
  appearance: none;
  -webkit-appearance: none;
}
.pick-field.is-filled { background-color: var(--accent-field); color: var(--ink-1); font-weight: 600; }

.chip {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: var(--s2);
  height: 34px;
  padding: 0 12px;
  border-radius: var(--r-pill);
  font-size: var(--t4);
  font-weight: 500;
  background: var(--canvas);
  color: var(--ink-2);
  white-space: nowrap;
}
.chip.is-active { background: var(--accent); color: #fff; font-weight: 600; }

.chip-sq {
  height: 34px;
  padding: 0 12px;
  border-radius: var(--r-sm);
  font-size: var(--t4);
  font-weight: 500;
  background: var(--canvas);
  color: var(--ink-2);
  white-space: nowrap;
}
.chip-sq.is-active { background: var(--ink-1); color: #fff; font-weight: 600; }

.badge {
  display: inline-block;
  font-size: var(--t5);
  font-weight: 600;
  padding: 2px 7px;
  border-radius: 5px;
  white-space: nowrap;
  background: var(--canvas-2);
  color: var(--ink-2);
}
.drop-list { margin: 0; padding-left: 18px; color: var(--ink-2); font-size: var(--t4); line-height: 1.7; }
.drop-list b { color: var(--ink-1); font-weight: 600; }
.badge--auto { font-size: 11px; font-weight: 700; padding: 1px 5px; border-radius: 4px; background: var(--line); color: var(--ink-3); }
/* 추정값 줄 전체를 감싸는 안내. 자료를 열 때마다 한 번씩 다시 말해 줍니다. */
.auto-note {
  margin: var(--s4) 0 0; padding: 9px 11px;
  border: 1px dashed var(--line-2); border-radius: 8px;
  font-size: var(--t5); line-height: 1.5; font-weight: 500; letter-spacing: 0;
  color: var(--ink-2); background: transparent;
}
.auto-note b { color: var(--ink-1); }
.badge--ok { background: var(--ok-soft); color: var(--ok); }
.badge--warn { background: var(--warn-soft); color: var(--warn); }
.badge--danger { background: var(--danger-soft); color: var(--danger); }
.badge--accent { background: var(--accent-soft); color: var(--accent-ink); }
.badge--count {
  font-size: var(--t5);
  font-weight: 700;
  color: #fff;
  background: var(--danger);
  padding: 1px 7px;
  border-radius: var(--r-pill);
}

/* --------------------------------------------------------------------------
   8. Avatar
   -------------------------------------------------------------------------- */

.avatar {
  flex: none;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 38px;
  height: 38px;
  border-radius: 11px;
  font-size: var(--t4);
  font-weight: 700;
}
.avatar--sm { width: 30px; height: 30px; border-radius: 9px; font-size: var(--t5); }
.avatar--md { width: 36px; height: 36px; border-radius: 11px; }
.avatar--lg { width: 52px; height: 52px; border-radius: 15px; font-size: var(--t2); }

.tone-steel { background: var(--tone-steel-bg); color: var(--tone-steel-fg); }
.tone-sage  { background: var(--tone-sage-bg);  color: var(--tone-sage-fg); }
.tone-plum  { background: var(--tone-plum-bg);  color: var(--tone-plum-fg); }
.tone-clay  { background: var(--tone-clay-bg);  color: var(--tone-clay-fg); }
.tone-slate { background: var(--tone-slate-bg); color: var(--tone-slate-fg); }

/* --------------------------------------------------------------------------
   9. Room list
   -------------------------------------------------------------------------- */

.room-row {
  display: flex;
  width: 100%;
  gap: 11px;
  align-items: flex-start;
  min-height: 72px;
  padding: 11px 10px;
  border-radius: var(--r-md);
  margin-bottom: 2px;
  background: var(--surface);
}
.room-row.is-active { background: var(--accent-soft); }

.room-row__top { display: flex; align-items: baseline; gap: 7px; margin-bottom: 1px; }
.room-row__name { flex: 1; font-size: var(--t3); font-weight: 600; letter-spacing: -.02em; }
.room-row__when { flex: none; font-size: var(--t5); font-weight: 500; letter-spacing: 0; color: var(--ink-3); }

/* 환자 요약 — 이름만으로 식별이 어려워 반드시 노출합니다.
   누를 수 있는 것도 선택된 것도 아니므로 색이 아니라 굵기로 세웁니다. */
.room-row__summary {
  font-size: var(--t4);
  font-weight: 600;
  color: var(--ink-1);
  margin-bottom: 2px;
}
.room-row__last { font-size: var(--t4); color: var(--ink-3); }
.room-row__mid { display: flex; align-items: center; gap: 5px; margin-bottom: 2px; }
.room-row__mid .room-row__summary { flex: 1; min-width: 0; margin-bottom: 0; }
.room-row__mid .badge { flex: none; }

.empty-state { padding: 48px 20px; text-align: center; }
.empty-state__title { font-size: var(--t3); font-weight: 600; color: var(--ink-2); margin-bottom: 4px; }
.empty-state__body { font-size: var(--t4); color: var(--ink-3); line-height: 1.6; }

/* --------------------------------------------------------------------------
   10. Room header / topic bar
   -------------------------------------------------------------------------- */

.room-header {
  flex: none;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  padding: 12px var(--s7);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--s4);
}
.room-header__title { flex: 1 1 160px; min-width: 150px; }

.state-banner {
  flex: none;
  display: flex;
  align-items: center;
  gap: var(--s4);
  padding: 10px var(--s7);
  background: var(--line);
}
.state-banner__text { flex: 1; font-size: var(--t4); font-weight: 500; color: var(--ink-2); }
.state-banner__action { flex: none; height: 36px; padding: 0 10px; font-size: var(--t4); font-weight: 700; color: var(--accent); }
.state-banner--danger { background: var(--danger-soft); }
.state-banner--danger .state-banner__text { color: #A61B2B; }
.state-banner--danger .state-banner__action { color: var(--danger); }

.topic-bar {
  flex: none;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  padding: 9px var(--s6);
}
.topic-bar__row { display: flex; align-items: center; gap: 7px; }
.topic-bar__chips { flex: 1; min-width: 0; display: flex; align-items: center; gap: var(--s2); overflow-x: auto; }

/* --------------------------------------------------------------------------
   11. Messages
   -------------------------------------------------------------------------- */

.thread {
  flex: 1 1 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: var(--s5);
  padding: var(--s8) var(--s7);
  overflow-y: auto;
}

.divider-topic { display: flex; align-items: center; gap: var(--s3); margin: 2px 0; }
.divider-topic__line { flex: 1; height: 1px; background: var(--line-2); }
.divider-topic__line--short { flex: none; width: 14px; }
.divider-topic__label {
  flex: none;
  font-size: var(--t5);
  font-weight: 700;
  letter-spacing: var(--t5-ls);
  color: var(--ink-2);
  background: var(--line);
  padding: 4px var(--s4);
  border-radius: var(--r-pill);
  white-space: nowrap;
}

.divider-day { display: flex; justify-content: center; }
.divider-day span {
  font-size: var(--t5);
  font-weight: 600;
  letter-spacing: 0;
  color: var(--ink-2);
  background: var(--line);
  padding: 4px 11px;
  border-radius: var(--r-pill);
  white-space: nowrap;
}

.msg { display: flex; gap: 9px; }
.msg--mine { justify-content: flex-end; }
.msg--grouped { padding-left: 39px; }

.msg__col { max-width: 66%; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; }
.msg--mine .msg__col { align-items: flex-end; }

.msg__name { font-size: var(--t4); font-weight: 600; color: var(--ink-2); margin-bottom: 4px; white-space: nowrap; }

.bubble {
  border-radius: 12px 12px 12px 4px;
  padding: 11px var(--s6);
  background: var(--surface);
  box-shadow: var(--sh-card);
  color: var(--ink-1);
  font-size: var(--t3);
  line-height: 1.7;
}
.bubble__intro {
  display: block;
  margin-bottom: 3px;
  font-size: var(--t4);
  font-weight: 600;
  color: var(--ink-2);
}
.msg--mine .bubble__intro { color: rgba(255, 255, 255, .82); }
.msg--mine .bubble {
  border-radius: 12px 12px 4px 12px;
  background: var(--accent);
  box-shadow: none;
  color: #fff;
}

.bubble__media {
  margin-top: 9px;
  border-radius: 9px;
  overflow: hidden;
  background: var(--media);
  width: 220px;
  height: 146px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  font-size: var(--t4);
  color: var(--ink-2);
}
.bubble__media-tag {
  position: absolute;
  top: 7px; left: 7px;
  font-size: 11px;
  font-weight: 700;
  color: var(--ink-1);
  background: rgba(255, 255, 255, .94);
  padding: 2px 7px;
  border-radius: 5px;
}

.bubble__file {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-top: 9px;
  background: var(--canvas);
  border-radius: 9px;
  padding: 9px 11px;
}
.msg--mine .bubble__file { background: rgba(255, 255, 255, .16); }
.bubble__file-icon {
  flex: none; width: 28px; height: 28px;
  border-radius: 8px;
  background: var(--line);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: var(--ink-2);
}
.msg--mine .bubble__file-icon { background: rgba(255, 255, 255, .22); color: #fff; }
.bubble__file-name { display: block; font-size: var(--t4); font-weight: 600; }
.bubble__file-meta { display: block; font-size: var(--t5); font-weight: 500; letter-spacing: 0; color: var(--ink-3); }
.msg--mine .bubble__file-name { color: #fff; }
.msg--mine .bubble__file-meta { color: rgba(255, 255, 255, .85); }

.msg__meta { display: flex; align-items: center; gap: var(--s2); margin-top: 4px; }
.msg__time { font-size: var(--t5); font-weight: 500; letter-spacing: 0; color: var(--ink-3); }
.msg__star { font-size: var(--t5); font-weight: 700; letter-spacing: 0; color: var(--warn); }

@media (max-width: 1009px) {
  .msg__col { max-width: 78%; }
  .bubble__media { width: 186px; height: 126px; }
}

/* --------------------------------------------------------------------------
   12. Composer
   -------------------------------------------------------------------------- */

.composer {
  flex: none;
  background: var(--surface);
  border-top: 1px solid var(--line);
  padding: 11px var(--s6) var(--s6);
}
.composer__row { display: flex; gap: var(--s3); align-items: flex-end; }
.composer__input {
  flex: 1;
  min-width: 0;
  min-height: var(--tap);
  max-height: 96px;
  border-radius: var(--r-md);
  background: var(--canvas);
  padding: 12px var(--s6);
  font-size: var(--t3);
  line-height: 1.6;
}
.composer__opts { display: flex; align-items: center; gap: var(--s4); margin-top: var(--s3); }

.attach-pending {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 9px;
  background: var(--ok-soft);
  border-radius: 9px;
  padding: 9px 11px;
  font-size: var(--t4);
  font-weight: 600;
  color: var(--ok);
}

.check {
  flex: none;
  width: 20px; height: 20px;
  border-radius: var(--r-sm);
  background: var(--surface);
  box-shadow: inset 0 0 0 1.5px #D1D6DB;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; color: transparent;
}
.check.is-on { background: var(--accent); color: #fff; box-shadow: none; }
.check--star.is-on { background: var(--warn); }

/* --------------------------------------------------------------------------
   13. Panel
   -------------------------------------------------------------------------- */

.panel__tabs { display: flex; gap: 5px; padding: var(--s6) var(--s6) var(--s4); border-bottom: 1px solid var(--line); }
.panel__tab { flex: 1; text-align: center; height: 36px; border-radius: 9px; font-size: var(--t4); font-weight: 500; background: var(--canvas); color: var(--ink-2); }
.panel__tab.is-active { background: var(--ink-1); color: #fff; font-weight: 600; }
.panel__body { flex: 1 1 0; min-height: 0; overflow-y: auto; padding: var(--s7) var(--s6); }
.panel__section { font-size: var(--t5); font-weight: 700; letter-spacing: var(--t5-ls); color: var(--ink-2); margin-bottom: var(--s3); }

.member-row { display: flex; align-items: center; gap: 9px; min-height: 48px; }

.file-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s3); }
.file-card { border-radius: var(--r-md); overflow: hidden; background: var(--media); min-width: 0; }
.file-card__thumb {
  height: 76px;
  display: flex; align-items: center; justify-content: center;
  position: relative;
  font-size: var(--t5); font-weight: 500; letter-spacing: 0;
  color: var(--ink-2);
  text-align: center;
  padding: 0 7px;
}
.file-card__tag {
  position: absolute; top: 6px; left: 6px;
  font-size: 11px; font-weight: 700;
  color: var(--ink-1);
  background: rgba(255, 255, 255, .94);
  padding: 1px 6px; border-radius: 4px;
}

.note-ok {
  background: var(--ok-soft);
  border-radius: var(--r-md);
  padding: 12px 13px;
  font-size: var(--t4);
  color: var(--ok);
  line-height: 1.6;
}

/* --------------------------------------------------------------------------
   14. Modal
   본문 스크롤 영역은 flex:0 1 auto — flex:1 1 0으로 하면
   카드 높이가 내용 기반일 때 0으로 접힙니다.
   -------------------------------------------------------------------------- */

.overlay {
  position: absolute;
  inset: 0;
  z-index: 30;
  background: rgba(25, 31, 40, .42);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 28px 20px;
}

.modal {
  width: 100%;
  max-width: 540px;
  background: var(--surface);
  border-radius: var(--r-xl);
  box-shadow: var(--sh-modal);
  display: flex;
  flex-direction: column;
  max-height: 100%;
  overflow: hidden;
}
.modal--sm { max-width: 380px; }
.modal--md { max-width: 460px; }
.modal--lg { max-width: 700px; }

.modal__head {
  display: flex;
  align-items: center;
  gap: var(--s4);
  padding: var(--s8) var(--s9);
  border-bottom: 1px solid var(--line);
}
.modal__body { flex: 0 1 auto; min-height: 0; overflow-y: auto; padding: var(--s9); }
.modal__foot { display: flex; gap: var(--s3); padding: var(--s6) var(--s9); border-top: 1px solid var(--line); }
.modal__foot .btn { height: 48px; font-size: var(--t3); font-weight: 600; }
.modal__foot .btn--primary { flex: 1; }

.action-card {
  display: flex;
  align-items: flex-start;
  gap: var(--s5);
  min-height: 56px;
  padding: 13px;
  border-radius: var(--r-md);
  background: var(--canvas);
}
.action-card--accent { background: var(--accent-soft); }
.action-card--danger { background: var(--danger-soft); }
.action-card__icon {
  flex: none; width: 28px; height: 28px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: var(--t4);
  background: var(--line); color: var(--ink-2);
}
.action-card__label { display: block; font-size: var(--t3); font-weight: 600; }
.action-card__sub { display: block; font-size: var(--t4); color: var(--ink-3); line-height: 1.6; margin-top: 1px; }

.pick-row {
  display: flex;
  align-items: center;
  gap: 11px;
  min-height: 56px;
  padding: 9px 12px;
  border-radius: var(--r-md);
  background: var(--canvas);
}
.pick-row.is-picked { background: var(--accent-field); }
.pick-row__box {
  flex: none; width: 22px; height: 22px;
  border-radius: var(--r-sm);
  background: var(--surface);
  box-shadow: inset 0 0 0 1.5px #D1D6DB;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; color: transparent;
}
.pick-row.is-picked .pick-row__box { background: var(--accent); color: #fff; box-shadow: none; }

@media (max-width: 1009px) {
  .overlay { align-items: flex-end; padding: 0; }
  .modal { border-radius: var(--r-xl) var(--r-xl) 0 0; max-width: none; }
}

/* --------------------------------------------------------------------------
   15. Onboarding
   -------------------------------------------------------------------------- */

.onb { background: var(--canvas); display: flex; align-items: flex-start; justify-content: center; padding: 32px var(--s10); }
.onb__inner { width: 100%; max-width: 400px; }
.onb__steps { display: flex; align-items: center; gap: 7px; margin-bottom: var(--s9); }
.onb__dot { flex: none; width: 8px; height: 8px; border-radius: var(--r-pill); background: var(--disabled); }
.onb__dot.is-done { background: var(--accent); }
.onb__dot.is-current { width: 22px; background: var(--accent); }
.onb__card { background: var(--surface); border-radius: var(--r-xl); padding: var(--s10); box-shadow: var(--sh-card); }

.upload-box {
  display: flex;
  width: 100%;
  min-height: 96px;
  border-radius: var(--r-md);
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: var(--s2);
  background: var(--canvas);
}
.upload-box.is-done { background: var(--ok-soft); box-shadow: inset 0 0 0 1.5px #8FCFB4; color: var(--ok); }

/* --------------------------------------------------------------------------
   16. Settings / toggle
   -------------------------------------------------------------------------- */

.setting-row {
  display: flex;
  width: 100%;
  align-items: center;
  gap: var(--s5);
  min-height: 60px;
  padding: var(--s5) 0;
  border-bottom: 1px solid var(--canvas-2);
}
.setting-row:last-child { border-bottom: none; }

.toggle {
  flex: none;
  width: 46px; height: 28px;
  border-radius: var(--r-pill);
  background: var(--disabled);
  display: flex; align-items: center;
  padding: 3px;
  justify-content: flex-start;
}
.toggle.is-on { background: var(--accent); justify-content: flex-end; }
.toggle__knob { width: 22px; height: 22px; border-radius: 50%; background: var(--surface); display: block; }

.card-list { background: var(--surface); border-radius: var(--r-lg); padding: 0 var(--s6); box-shadow: var(--sh-card); }

/* --------------------------------------------------------------------------
   17. Admin
   -------------------------------------------------------------------------- */

.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--s4); }
.stat-card { background: var(--surface); border-radius: var(--r-lg); padding: 15px var(--s7); box-shadow: var(--sh-card); }
.stat-card__label { font-size: var(--t5); font-weight: 700; letter-spacing: var(--t5-ls); color: var(--ink-3); margin-bottom: 7px; }
.stat-card__value { font-size: var(--t1); font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.stat-card__delta { font-size: var(--t5); font-weight: 500; letter-spacing: 0; margin-top: 4px; }

.bars { display: flex; align-items: flex-end; gap: var(--s3); height: 120px; }
.bars__col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: var(--s2); min-width: 0; }
.bars__bar { width: 100%; border-radius: 5px 5px 0 0; background: #C3CCD6; }
.bars__bar.is-high { background: var(--accent); }

.table { background: var(--surface); border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--sh-card); }
.table__head,
.table__row { display: grid; gap: var(--s4); align-items: center; }
.table__head {
  padding: var(--s4) var(--s8);
  background: #F9FAFB;
  border-bottom: 1px solid var(--line);
  font-size: var(--t5);
  font-weight: 700;
  letter-spacing: var(--t5-ls);
  color: var(--ink-3);
}
.table__row { padding: 13px var(--s8); border-bottom: 1px solid var(--canvas-2); font-size: 14px; }
.table__row:last-child { border-bottom: none; }

/* 열 정의 — 모두 minmax(0, …)으로 좁은 폭에서 붕괴하지 않게 */
.cols-users { grid-template-columns: minmax(140px, 1.6fr) minmax(0, .8fr) minmax(0, .8fr) minmax(0, 1fr) minmax(0, .9fr); }
.cols-audit { grid-template-columns: minmax(96px, .9fr) minmax(110px, 1.1fr) minmax(0, .9fr) minmax(150px, 2fr) minmax(0, .9fr); }

.notice {
  background: var(--tone-clay-bg);
  border-radius: var(--r-md);
  padding: 13px 15px;
  font-size: var(--t4);
  color: var(--tone-clay-fg);
  line-height: 1.7;
}

/* --------------------------------------------------------------------------
   18. Mobile tab bar
   -------------------------------------------------------------------------- */

.tabbar {
  flex: none;
  display: flex;
  background: var(--surface);
  border-top: 1px solid var(--line);
  padding: var(--s2) 0 var(--s4);
}
.tabbar__item {
  flex: 1;
  min-height: 52px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  position: relative;
  color: #8B95A1;
}
.tabbar__item.is-active { color: var(--accent); }
.tabbar__label { font-size: var(--t5); font-weight: 500; letter-spacing: 0; color: var(--ink-3); }
.tabbar__item.is-active .tabbar__label { font-weight: 700; color: var(--accent); }
.tabbar__dot {
  position: absolute; top: 6px; left: 50%; margin-left: 7px;
  width: 7px; height: 7px; border-radius: 50%; background: var(--danger);
}

/* --------------------------------------------------------------------------
   19. Motion
   이 디자인은 의도적으로 모션이 거의 없습니다.
   상태 변화는 색으로 표현합니다.
   -------------------------------------------------------------------------- */

@media (prefers-reduced-motion: no-preference) {
  .btn, .chip, .room-row, .pick-row { transition: background-color .12s ease, color .12s ease; }
}

/* ==========================================================================
   20. 배포 적응 — 핸드오프의 데모 프레임(고정 740px) 대신 뷰포트를 채웁니다.
   ========================================================================== */

html, body { height: 100%; }
body { overscroll-behavior: none; }

.app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  position: relative;
  background: var(--surface);
  overflow-x: auto;
  overflow-y: hidden;
}

/* 셸은 프레임이 아니라 앱 본체. 높이는 부모가 확정합니다. */
.shell { height: auto; flex: 1 1 0; min-height: 0; border-radius: 0; }

.ic { flex: none; display: block; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.row { display: flex; align-items: center; gap: var(--s3); }
.grow { flex: 1; min-width: 0; }

/* ── 레일 ─────────────────────────────────────────────────────── */
.rail__head { flex: none; display: flex; align-items: center; gap: 9px; padding: var(--s6) var(--s6) var(--s4); }
.rail__tools { flex: none; padding: 0 var(--s6) var(--s4); display: flex; flex-direction: column; gap: var(--s3); }
.rail__new { width: 100%; justify-content: center; min-height: var(--tap); }
/* 상태 탭 5개는 기본 레일 폭(432px)에서 줄바꿈 없이 한 줄에 다 들어갑니다.
   레일을 직접 좁게 줄인 경우에만 가로 스크롤로 대응합니다. */
.rail__tabs {
  flex: none;
  display: flex;
  flex-wrap: nowrap;
  align-items: center;
  gap: var(--s2);
  padding: 5px var(--s6) var(--s5);
}
.rail__foot { flex: none; border-top: 1px solid var(--line); padding: var(--s4) var(--s6); display: flex; align-items: center; gap: 9px; }

.logo {
  flex: none; width: 34px; height: 34px;
  border-radius: var(--r-md); background: var(--accent); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: var(--t4); font-weight: 700;
}
.logo--lg { width: 48px; height: 48px; border-radius: var(--r-xl); font-size: var(--t2); }

.searchbox {
  display: flex; align-items: center; gap: var(--s3);
  min-height: var(--tap); border-radius: var(--r-md);
  background: var(--canvas); padding: 0 var(--s5); color: var(--ink-3);
}
.searchbox input { flex: 1; min-width: 0; height: var(--tap); font-size: var(--t4); font-weight: 500; }
.searchbox--lg input { height: 48px; font-size: var(--t3); }

/* ── 단일 화면(검색·알림·내 정보) ─────────────────────────────── */
.screen { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; background: var(--canvas); }
.screen__head {
  flex: none; display: flex; align-items: center; gap: var(--s4);
  padding: var(--s5) var(--s7); background: var(--surface); border-bottom: 1px solid var(--line);
}
.screen__body { flex: 1 1 0; min-height: 0; overflow-y: auto; padding: var(--s7); }
.screen__body--narrow { max-width: 620px; width: 100%; margin: 0 auto; }

.sec-label { font-size: var(--t5); font-weight: 700; letter-spacing: var(--t5-ls); color: var(--ink-3); margin: var(--s8) 0 var(--s3); }
.sec-label:first-child { margin-top: 0; }

.noti-row {
  display: flex; width: 100%; gap: var(--s5); align-items: flex-start;
  min-height: 68px; padding: var(--s5) var(--s6);
  border-radius: var(--r-lg); background: var(--canvas-2);
  margin-bottom: var(--s3); text-align: left;
}
.noti-row.is-unread { background: var(--surface); box-shadow: var(--sh-card); }
.noti-row__dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); margin-top: 7px; }

.result-card {
  display: block; width: 100%; text-align: left;
  background: var(--surface); border-radius: var(--r-lg);
  padding: var(--s5) var(--s6); box-shadow: var(--sh-card); margin-bottom: var(--s3);
}
.result-row {
  display: flex; width: 100%; align-items: center; gap: var(--s5);
  min-height: 64px; padding: var(--s3) var(--s6); text-align: left;
  background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--sh-card); margin-bottom: var(--s3);
}
.thumb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: var(--s3); }
.thumb-grid--modal { grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); }

/* ── 로그인 ───────────────────────────────────────────────────── */
.login { flex: 1 1 0; min-height: 0; overflow-y: auto; background: var(--canvas); display: flex; align-items: center; justify-content: center; padding: 40px var(--s10); }
.login__inner { width: 100%; max-width: 340px; }
.legal { margin-top: var(--s7); font-size: var(--t4); color: var(--ink-3); line-height: 1.7; }

/* 온보딩은 스크롤 컨테이너 */
.onb { flex: 1 1 0; min-height: 0; overflow-y: auto; }

/* ── 운영자 ───────────────────────────────────────────────────── */
.admin { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; background: var(--page); }
.admin__bar {
  flex: none; display: flex; align-items: center; gap: var(--s4); flex-wrap: wrap;
  padding: var(--s5) var(--s9); background: var(--surface); border-bottom: 1px solid var(--line);
}
.admin__body { flex: 1 1 0; min-height: 0; overflow-y: auto; padding: var(--s9); }
.admin__inner { max-width: 1080px; margin: 0 auto; }
.table-scroll { overflow-x: auto; }
.table-scroll .table { min-width: 720px; }

/* ── 모달: 실제 배포에서는 뷰포트 기준 고정 ───────────────────── */
.overlay { position: fixed; }
.modal { max-height: calc(100dvh - 56px); }

/* button으로 쓰는 행 컴포넌트는 폭이 줄어들지 않게 명시합니다 */
.pick-row, .action-card, .setting-row, .room-row { width: 100%; }
.pick-row { margin-bottom: var(--s2); text-align: left; }
.action-card { margin-bottom: var(--s3); }
.action-card:last-child { margin-bottom: 0; }

/* 칩·탭은 디자인상 34~36px입니다. 시각 높이는 그대로 두고
   보이지 않는 히트 영역만 44px로 넓혀 터치 타깃 규칙을 지킵니다. */
.chip, .chip-sq, .panel__tab, .state-banner__action, .tabbar__item { position: relative; }
.composer__opts > button { min-height: var(--tap); }
.chip::after, .chip-sq::after, .panel__tab::after, .state-banner__action::after {
  content: '';
  position: absolute;
  left: 0; right: 0; top: 50%;
  height: var(--tap);
  transform: translateY(-50%);
}

/* ── 자료 분석 · 캡션 ─────────────────────────────────────────── */

/* 첨부 아래 붙는 자동 추정 한 줄.
   의사가 쓴 소견과 같은 무게로 보이면 안 됩니다. 점선으로 둘러서
   "아직 확정되지 않은 메모"처럼 보이게 합니다. */
.bubble__caption {
  display: flex;
  align-items: center;
  gap: var(--s2);
  width: 100%;
  margin-top: var(--s2);
  padding: 7px 9px;
  border-radius: 8px;
  border: 1px dashed var(--line-2);
  background: transparent;
  color: var(--ink-2);
  text-align: left;
}
.bubble__caption-text {
  flex: 1;
  min-width: 0;
  font-size: var(--t4);
  font-weight: 600;
  line-height: 1.5;
}
.msg--mine .bubble__caption {
  background: rgba(255, 255, 255, .16);
  color: #fff;
}
.msg--mine .bubble__caption .badge--auto {
  background: rgba(255, 255, 255, .22);
  color: #fff;
}

/* 방 전체 자료를 한 덩어리로 정리한 블록 */
.digest {
  background: var(--canvas);
  border-radius: var(--r-md);
  padding: var(--s5) var(--s6);
}
.digest__head { display: flex; align-items: center; gap: var(--s2); color: var(--ink-2); margin-bottom: var(--s4); }
.digest__grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: var(--s4) var(--s5); }
.digest__k {
  display: block;
  font-size: var(--t5); font-weight: 700; letter-spacing: var(--t5-ls);
  color: var(--ink-3); margin-bottom: 2px;
}
.digest__v { display: block; font-size: var(--t4); font-weight: 600; color: var(--ink-1); }

/* 자료 하나의 계측표 */
.file-detail {
  background: var(--surface);
  border-radius: var(--r-lg);
  padding: var(--s6);
  box-shadow: var(--sh-card);
  margin-bottom: var(--s3);
}
.file-detail__head { display: flex; align-items: center; gap: var(--s3); margin-bottom: var(--s5); }
.metric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--s2) var(--s5); }
.metric-row {
  display: flex; align-items: baseline; gap: var(--s3);
  min-height: 30px;
  border-bottom: 1px solid var(--canvas-2);
}
.metric-row__k { flex: 1; min-width: 0; font-size: var(--t4); color: var(--ink-3); }
.metric-row__v { flex: none; font-size: var(--t4); font-weight: 600; font-variant-numeric: tabular-nums; }

/* 썸네일 카드 — 그림이 있으면 그림, 없으면 이름 */
.file-card { display: block; width: 100%; text-align: left; box-shadow: none; margin-bottom: 0; background: none; }
.file-card__thumb {
  position: relative;
  display: block;
  height: 84px;
  border-radius: var(--r-md);
  background: var(--media);
  overflow: hidden;
}
.file-card__img { width: 100%; height: 100%; object-fit: cover; display: block; }
.file-card__ph {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  color: var(--ink-3);
}
.file-card__tag {
  position: absolute; top: 6px; left: 6px;
  font-size: 11px; font-weight: 700;
  color: var(--ink-1); background: rgba(255, 255, 255, .94);
  padding: 1px 6px; border-radius: 4px;
}
.file-card__edited {
  position: absolute; top: 6px; right: 6px;
  font-size: 11px; font-weight: 700;
  color: var(--warn); background: var(--warn-soft);
  padding: 1px 6px; border-radius: 4px;
}
.file-card__name {
  display: block;
  margin-top: 5px;
  font-size: var(--t5); font-weight: 600; letter-spacing: 0;
  color: var(--ink-2);
}
.thumb-cell { min-width: 0; }
.thumb-cell__room {
  display: block;
  font-size: var(--t5); font-weight: 500; letter-spacing: 0;
  color: var(--ink-3);
}

/* 좁은 열용 가로 행 */
.file-row {
  display: flex; align-items: center; gap: var(--s3);
  width: 100%; min-height: 52px;
  padding: var(--s2);
  border-radius: var(--r-md);
  margin-bottom: 2px;
  text-align: left;
}
.file-row:hover { background: var(--canvas); }
.file-row__thumb {
  position: relative; flex: none;
  width: 48px; height: 38px;
  border-radius: 7px; background: var(--media); overflow: hidden;
}
.file-row__thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.file-row__tag {
  position: absolute; top: 3px; left: 3px;
  font-size: 10px; font-weight: 700;
  color: var(--ink-1); background: rgba(255, 255, 255, .94);
  padding: 0 4px; border-radius: 3px;
}
.file-row__text { flex: 1; min-width: 0; }
.file-row__name { display: block; font-size: var(--t4); font-weight: 600; }
.file-row__cap {
  display: block;
  font-size: var(--t5); font-weight: 500; letter-spacing: 0;
  color: var(--ink-3);
}

/* 말풍선 안 자료 묶음 */
.bubble__files { display: block; }
.bubble__files.is-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
  gap: 5px;
}
.bubble__tile {
  position: relative;
  display: block;
  width: 100%;
  border-radius: 9px;
  overflow: hidden;
  background: var(--media);
  aspect-ratio: 4 / 3;
}
.bubble__files:not(.is-grid) .bubble__tile { width: 220px; aspect-ratio: 3 / 2; }
.bubble__tile-img { width: 100%; height: 100%; object-fit: cover; display: block; }
.bubble__tile-ph {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  color: var(--ink-3);
}
.bubble__tile-tag {
  position: absolute; top: 5px; left: 5px;
  font-size: 10px; font-weight: 700;
  color: var(--ink-1); background: rgba(255, 255, 255, .94);
  padding: 1px 5px; border-radius: 3px;
}
.bubble__tile-name {
  position: absolute; left: 5px; right: 5px; bottom: 5px;
  display: block;
  font-size: var(--t5); font-weight: 600; letter-spacing: 0;
  color: var(--ink-1);
  background: rgba(255, 255, 255, .92);
  padding: 2px 6px; border-radius: 4px;
}

/* 첨부 모달 */
.up-pick { width: 100%; }
.up-list { margin-top: var(--s4); }
.up-item {
  background: var(--canvas);
  border-radius: var(--r-md);
  padding: var(--s4);
  margin-bottom: var(--s3);
}
.up-item__head { display: flex; align-items: center; gap: var(--s3); margin-bottom: var(--s3); }
.up-item__thumb {
  position: relative; flex: none;
  width: 44px; height: 44px;
  border-radius: 8px; background: var(--media); overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}
.up-item__thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.up-item__ext { font-size: 10px; font-weight: 700; color: var(--ink-2); }
.up-item .field { background: var(--surface); }
.up-item .field.is-filled { background: var(--accent-field); }

/* ── 협진 요약 ────────────────────────────────────────────────── */

.sum-card {
  /* .thread는 세로 flex 컨테이너입니다. overflow:hidden인 항목은 자동 최소 높이가
     0이 되어 내용이 넘칠 때 납작하게 눌립니다 — flex:none으로 줄어들지 않게 못박습니다. */
  flex: none;
  background: var(--surface);
  border-radius: var(--r-lg);
  box-shadow: var(--sh-card);
  overflow: hidden;
  margin-top: var(--s2);
}
.sum-card__head {
  display: flex; align-items: center; gap: var(--s2);
  padding: var(--s5) var(--s6);
  background: var(--canvas);
  color: var(--ink-2);
  border-bottom: 1px solid var(--line);
}
.sum-card .sum { padding: var(--s6); }

/* 지표 네 개 — 글자 나열 대신 면으로 끊어 줍니다 */
.sum__stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(104px, 1fr));
  gap: var(--s2);
  margin-bottom: var(--s8);
}
.sum__stat {
  background: var(--canvas);
  border-radius: var(--r-md);
  padding: var(--s4) var(--s5);
}
.sum__stat-k {
  display: flex; align-items: center; gap: 4px;
  font-size: var(--t5); font-weight: 600; letter-spacing: 0;
  color: var(--ink-3); margin-bottom: 3px;
}
.sum__stat-k .ic { color: var(--ink-3); }
.sum__stat-v { display: block; font-size: var(--t3); font-weight: 700; color: var(--ink-1); }

/* 번호 붙은 섹션 머리 — 어디까지가 한 덩어리인지 보이게 */
.sum__h {
  display: flex; align-items: center; gap: var(--s3);
  margin: var(--s8) 0 var(--s4);
}
.sum__h:first-of-type { margin-top: 0; }
.sum__num {
  flex: none;
  width: 20px; height: 20px;
  border-radius: 50%;
  background: var(--ink-1); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700;
}
.sum__h-title { font-size: var(--t4); font-weight: 700; color: var(--ink-1); }
.sum__h-sub { font-size: var(--t5); font-weight: 500; letter-spacing: 0; color: var(--ink-3); }

.sum__block {
  padding-left: var(--s9);
  border-left: 2px solid var(--line);
  margin-left: 9px;
  padding-bottom: var(--s2);
}
.sum__block--key { border-left-color: var(--warn); }

/* 누가 무슨 말을 했는지 */
.sum__say { display: flex; gap: var(--s3); align-items: flex-start; padding: var(--s2) 0; }
.sum__say-body { min-width: 0; }
.sum__say-who { font-size: var(--t5); font-weight: 700; letter-spacing: 0; color: var(--ink-3); }
.sum__say-text { font-size: var(--t4); line-height: 1.6; color: var(--ink-1); }

/* 주제 한 덩어리 */
.sum__thread {
  background: var(--canvas);
  border-radius: var(--r-md);
  padding: var(--s4) var(--s5);
  margin-bottom: var(--s3);
}
.sum__thread:last-child { margin-bottom: 0; }
.sum__thread-head {
  display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap;
  margin-bottom: var(--s2);
}
.sum__thread-name { font-size: var(--t4); font-weight: 700; color: var(--ink-1); }
.sum__thread .sum__say { padding: 3px 0; }

/* 핵심 의견 */
.sum__key {
  display: flex; gap: var(--s3); align-items: flex-start;
  background: var(--warn-soft);
  border-radius: var(--r-md);
  padding: var(--s4) var(--s5);
  margin-bottom: var(--s2);
  font-size: var(--t4); line-height: 1.6; color: var(--ink-1);
}
.sum__key:last-child { margin-bottom: 0; }
.sum__key .ic { flex: none; margin-top: 3px; color: var(--warn); }
.sum__key strong { display: block; font-size: var(--t5); letter-spacing: 0; color: var(--warn); }

.sum__line { display: flex; align-items: center; gap: var(--s2); font-size: var(--t4); color: var(--ink-2); padding: 3px 0; }
.sum__line .ic { color: var(--ink-3); }
.sum__chips { display: flex; flex-wrap: wrap; gap: var(--s2); }
.sum__meta { margin: var(--s3) 0 0; font-size: var(--t4); color: var(--ink-3); }
.sum__muted { margin: 0; font-size: var(--t4); color: var(--ink-3); }

/* 마무리 — 상태에 따라 면 색이 다릅니다 */
.sum__result {
  display: flex; align-items: flex-start; gap: var(--s3);
  margin-left: 9px;
  padding: var(--s5) var(--s6);
  border-radius: var(--r-md);
  font-size: var(--t4); line-height: 1.6;
}
.sum__result .ic { flex: none; margin-top: 1px; }
.sum__result--ok { background: var(--ok-soft); color: var(--ok); }
.sum__result--warn { background: var(--warn-soft); color: var(--warn); }
.sum__result strong { color: inherit; }

.sum__note {
  display: flex; align-items: flex-start; gap: var(--s2);
  margin: var(--s8) 0 0;
  padding-top: var(--s4);
  border-top: 1px solid var(--line);
  font-size: var(--t5); font-weight: 500; letter-spacing: 0; line-height: 1.6;
  color: var(--ink-3);
}
.sum__note .ic { flex: none; margin-top: 2px; }

/* ── 협진 통화 ────────────────────────────────────────────────── */

.msg-system {
  flex: none;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--s2);
  padding: 7px var(--s5);
  margin: 0 auto;
  border-radius: var(--r-pill);
  background: var(--line);
  color: var(--ink-2);
  font-size: var(--t5);
  font-weight: 600;
  letter-spacing: 0;
  max-width: 100%;
}

.call {
  position: absolute;
  inset: 0;
  z-index: 40;
  display: flex;
  flex-direction: column;
  background: var(--canvas);
  color: var(--ink-1);
  padding: var(--s7);
}
/* 영상은 화면을 보는 자리라 어두운 편이 맞습니다. 그 어둠도 앱의 회색 계열로 둡니다. */
.call--video { background: #191F28; color: #fff; }
.call__top { display: flex; align-items: center; gap: var(--s3); flex: none; }
.call__room { flex: 1; min-width: 0; font-size: var(--t4); color: var(--ink-3); }
.call--video .call__room { color: rgba(255, 255, 255, .75); }
.call__timer { flex: none; font-size: var(--t4); font-weight: 600; }

.call__stage {
  flex: 1 1 0;
  min-height: 0;
  position: relative;
  margin: var(--s7) 0;
  border-radius: var(--r-xl);
  overflow: hidden;
  background: #1F2630;
}
.call:not(.call--video) .call__stage { background: transparent; }
.call__stage--voice {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--s3);
  background: transparent;
}
.call__name { font-size: var(--t1); font-weight: 700; letter-spacing: -.03em; }
.call__org { font-size: var(--t4); color: var(--ink-3); }
.call--video .call__org { color: rgba(255, 255, 255, .7); }

.call__remote { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.call__self {
  position: absolute;
  right: var(--s5); bottom: var(--s5);
  width: 116px; height: 78px;
  border-radius: var(--r-md);
  background: #2B333E;
  display: flex; align-items: center; justify-content: center;
}
.call__placeholder { font-size: var(--t5); font-weight: 600; letter-spacing: 0; color: rgba(255, 255, 255, .5); }

.call__bar { flex: none; display: flex; align-items: center; justify-content: center; gap: var(--s5); }
.call__btn {
  flex: none;
  width: 56px; height: 56px;
  border-radius: 50%;
  background: var(--line);
  color: var(--ink-1);
  display: flex; align-items: center; justify-content: center;
}
.call--video .call__btn { background: rgba(255, 255, 255, .14); color: #fff; }
.call__btn.is-off { background: var(--ink-1); color: #fff; }
.call--video .call__btn.is-off { background: #fff; color: var(--ink-1); }
.call__btn--end, .call--video .call__btn--end { background: var(--danger); color: #fff; }
.call--video .badge--accent { background: rgba(255, 255, 255, .16); color: #fff; }
.call__note {
  flex: none;
  margin: var(--s5) 0 0;
  text-align: center;
  font-size: var(--t5);
  font-weight: 500;
  letter-spacing: 0;
  line-height: 1.6;
  color: var(--ink-3);
}
.call--video .call__note { color: rgba(255, 255, 255, .55); }
.call--video :focus-visible { outline-color: #fff; }

@media (max-width: 1009px) {
  .call { padding: var(--s6); }
  .call__self { width: 92px; height: 62px; }
}

/* 대화 끝의 협진 종료 버튼. 종료하면 같은 자리에 요약 카드가 앉습니다. */
.close-cta {
  flex: none;
  display: flex;
  align-items: center;
  gap: var(--s4);
  margin-top: var(--s2);
}
.close-cta__line { flex: 1; height: 1px; background: var(--line-2); }
.close-cta__btn { flex: none; background: var(--surface); box-shadow: var(--sh-card); }

/* ── 아이콘 네비 레일 ─────────────────────────────────────────── */

.navrail {
  flex: none;
  width: 72px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: var(--s5) var(--s2) var(--s5);
  background: var(--surface);
  border-right: 1px solid var(--line);
}
.navrail__logo {
  flex: none;
  width: 34px; height: 34px;
  border-radius: var(--r-md);
  background: var(--accent); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: var(--t4); font-weight: 700;
  margin-bottom: var(--s5);
}
.navrail__item {
  flex: none;
  position: relative;
  width: 100%;
  min-height: 56px;
  border-radius: var(--r-md);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px;
  color: var(--ink-3);
}
.navrail__item:hover { background: var(--canvas); }
.navrail__item.is-active { background: var(--accent-soft); color: var(--accent-ink); }
.navrail__label { font-size: var(--t5); font-weight: 600; letter-spacing: 0; }
.navrail__item.is-active .navrail__label { color: var(--accent-ink); }
.navrail__dot {
  position: absolute; top: 9px; left: 50%; margin-left: 7px;
  width: 7px; height: 7px; border-radius: 50%; background: var(--danger);
}

/* 목록 열 상단 — 이제 제목과 새 협진만 */
.searchbox--btn { width: 100%; color: var(--ink-3); font-size: var(--t4); font-weight: 500; }
.searchbox--btn:hover { background: var(--canvas-2); }

/* 방 헤더 액션 묶음 */
.room-header__actions { flex: none; display: flex; align-items: center; gap: 2px; }
.btn--on { background: var(--accent-soft); color: var(--accent-ink); }
.room-header__more { flex: none; gap: var(--s2); }
@media (max-width: 1009px) {
  .room-header__more-label { display: none; }
  .room-header__more { width: var(--tap); padding: 0; }
  /* 좁은 폭에서 제목이 감싸면 헤더가 두 줄이 됩니다 — 줄이고 말줄임 처리합니다 */
  .room-header { flex-wrap: nowrap; }
  .room-header__title { flex: 1 1 auto; min-width: 60px; }
  .room-header > .avatar { display: none; }
  .room-header__actions { gap: 0; }
}

/* ── 자료 뷰어 ────────────────────────────────────────────────── */

.viewer-overlay { align-items: center; padding: var(--s9); }
.viewer {
  width: 100%;
  max-width: 1000px;
  /* 자료마다 오른쪽 계측표 길이가 달라 팝업 높이가 들쭉날쭉했습니다.
     높이를 못박아 그림 크기가 넘길 때마다 바뀌지 않게 합니다. */
  height: min(760px, calc(100dvh - 40px));
  max-height: calc(100dvh - 40px);
  background: var(--surface);
  border-radius: var(--r-xl);
  box-shadow: var(--sh-modal);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.viewer__head {
  flex: none;
  display: flex; align-items: center; gap: var(--s3);
  padding: var(--s5) var(--s6);
  border-bottom: 1px solid var(--line);
}
.viewer__body { flex: 1 1 0; min-height: 0; display: flex; }

.viewer__stage {
  flex: 1 1 0;
  min-width: 0;
  display: flex; flex-direction: column;
  background: var(--canvas);
  padding: var(--s6);
  gap: var(--s4);
}
.viewer__image {
  flex: 1 1 0;
  min-height: 240px;
  position: relative;
  border-radius: var(--r-md);
  background: var(--media);
  display: flex; align-items: center; justify-content: center;
}
.viewer__img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
.viewer__tag {
  position: absolute; top: var(--s4); left: var(--s4);
  font-size: 11px; font-weight: 700;
  color: var(--ink-1); background: rgba(255, 255, 255, .94);
  padding: 2px 7px; border-radius: 4px;
}
.viewer__nav { flex: none; display: flex; align-items: center; justify-content: center; gap: var(--s5); }

/* 뷰어 왼쪽 자료 리스트 */
.viewer__list {
  flex: none;
  width: 168px;
  min-height: 0;
  overflow-y: auto;
  padding: var(--s4);
  border-right: 1px solid var(--line);
  background: var(--surface);
}
.viewer__list-head {
  font-size: var(--t5); font-weight: 700; letter-spacing: var(--t5-ls);
  color: var(--ink-3); padding: 0 var(--s2) var(--s3);
}
.viewer__item {
  display: flex; align-items: center; gap: var(--s3);
  width: 100%; min-height: 52px;
  padding: var(--s2);
  border-radius: var(--r-md);
  margin-bottom: 2px;
  text-align: left;
}
.viewer__item:hover { background: var(--canvas); }
.viewer__item.is-active { background: var(--accent-soft); }
.viewer__item-thumb {
  position: relative;
  flex: none; width: 44px; height: 36px;
  border-radius: 7px; background: var(--media);
  overflow: hidden;
}
.viewer__item-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.viewer__item-tag {
  position: absolute; top: 3px; left: 3px;
  font-size: 10px; font-weight: 700;

function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];

}
function cls() {
  return Array.prototype.filter.call(arguments, Boolean).join(' ');
}
function isMobile() {

}
function pool() {
  return S.extraRooms.concat(ROOMS);

  var list = pool();
  for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
  return list[0];
}
function threadMsgs(roomId, threadId) {

   대화 삭제와 같은 규칙(30일 유예)을 씁니다. */
function deletedFilesOf(roomId) {

}
function anyFileById(roomId, id) {

  for (var i = 0; i < all.length; i++) if (all[i].id === id) return all[i];
  return null;
}
function fileById(roomId, id) {
  var list = filesOf(roomId);
  for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
  return null;
}
function fileRoom(id) {
  /* 시드 자료는 FILES에, 올린 자료는 S.extraFiles에 있습니다. 둘 다 봅니다 —
     새로 만든 방은 FILES에 아예 없어서 시드만 보면 찾지 못합니다. */
  var keys = Object.keys(FILES).concat(Object.keys(S.extraFiles));
  for (var i = 0; i < keys.length; i++) {
    if (fileById(keys[i], id)) return keys[i];
  }
  return S.roomId;
}

/* 계측값은 시드 위에 의사가 고친 값을 덮어 읽습니다.
   이 한 군데를 거치게 해 두면 대화창 캡션·패널 카드·계측표가 모두 같은 값을 봅니다. */
function metricsOf(f) {
  var edits = S.fileEdits[f.id] || {};
  return f.metrics.map(function (m, i) {
    var v = edits[i];
    return v == null ? m : [m[0], v, m[2], m[3], true];
  });
}
function nameOf(f) {
  var e = S.fileEdits[f.id];
  return (e && e.name) || f.name;
}
function noteOf(f) {
  var e = S.fileEdits[f.id];
  return (e && e.note != null) ? e.note : (f.note || '');
}
function isEdited(f) {
  return !!(S.fileEdits[f.id] && Object.keys(S.fileEdits[f.id]).length);
}
/* 캡션은 앞 세 개 추정값에서 만듭니다 — 값을 고치면 캡션이 저절로 따라옵니다.
   추정값이 아직 없는 자료(방금 올린 것)는 올릴 때 의사가 적은 정보를 씁니다.

   값 앞에 ≈를 붙입니다. 이건 잰 값이 아니라 사진에서 어림한 값이고,
   의사가 소견처럼 읽어버리면 안 되기 때문입니다. */
function captionOf(f) {
  var ms = metricsOf(f).slice(0, 3);
  if (ms.length) return ms.map(function (m) { return (m[3] || m[0]) + ' ≈' + m[1]; }).join(' · ');
  return infoLine(f.info);
}
function infoLine(info) {
  if (!info) return '';
  return [info.part, info.desc].filter(Boolean).join(' · ');
}
/* 의사가 적은 정보와 기계가 어림한 값은 배지로 구분합니다 */
function captionKind(f) {
  if (isEdited(f)) return '수정됨';
  return metricsOf(f).length ? '자동 추정' : '첨부 정보';
}
function historyOf(id) {
  return S.fileHistory[id] || [];
}

/* 편집 저장. 바뀐 항목만 히스토리와 감사 로그에 남깁니다 — 의료 자료라 흔적이 필요합니다. */
function saveFileEdits(f, draft, name, note) {
  var base = S.fileEdits[f.id] || {};
  var next = {}, changes = [];

  /* 이름과 메모도 계측값과 같은 자리에 쌓습니다 — 무엇이 바뀌었는지
     한 곳에서 보여야 하기 때문입니다. */
  if (name != null) {
    var nv = String(name).trim();
    if (nv && nv !== f.name) { next.name = nv; changes.push({ label:'자료 이름', from:f.name, to:nv }); }
    else if (base.name && (!nv || nv === f.name)) { changes.push({ label:'자료 이름', from:base.name, to:f.name }); }
  } else if (base.name) { next.name = base.name; }

  if (note != null) {
    var ov = String(note).trim();
    var cur = base.note == null ? (f.note || '') : base.note;
    if (ov !== cur) changes.push({ label:'설명', from:cur || '(없음)', to:ov || '(없음)' });
    if (ov !== (f.note || '')) next.note = ov;
  } else if (base.note != null) { next.note = base.note; }

  f.metrics.forEach(function (m, i) {
    var cur = base[i] == null ? m[1] : base[i];
    var val = draft[i] == null ? cur : String(draft[i]).trim();
    if (!val) val = cur;
    if (val !== m[1]) next[i] = val;
    if (val !== cur) changes.push({ label:m[0], from:cur, to:val });
  });
  if (!changes.length) return 0;

  if (Object.keys(next).length) S.fileEdits[f.id] = next;
  else delete S.fileEdits[f.id];

  var who = PEOPLE[S.me].name;
  S.fileHistory[f.id] = changes.map(function (c) {
    return { when:'방금', who:who, label:c.label, from:c.from, to:c.to };
  }).concat(historyOf(f.id));

  AUDIT_ROWS.unshift(['방금', who, '계측 수정',
    roomById(fileRoom(f.id)).name + ' · ' + nameOf(f) + ' · ' + changes.length + '개 항목',
    'Web · 협진톡', 'edit']);
  saveEdits();
  return changes.length;
}

/* 고친 값은 이 브라우저에 남겨 새로고침 뒤에도 유지합니다 */
function saveEdits() {
  try {
    localStorage.setItem('hjt-file-edits',
      JSON.stringify({ edits:S.fileEdits, history:S.fileHistory, deleted:S.deletedFiles }));
  } catch (e) {}
}
function loadEdits() {
  try {
    var raw = JSON.parse(localStorage.getItem('hjt-file-edits') || '{}');
    if (raw && typeof raw === 'object') {
      S.fileEdits = raw.edits || {};
      S.fileHistory = raw.history || {};
      S.deletedFiles = raw.deleted || {};
    }
  } catch (e) {}
}
function resetEdits() {
  S.fileEdits = {};
  S.fileHistory = {};
  S.deletedFiles = {};
  try { localStorage.removeItem('hjt-file-edits'); } catch (e) {}
}
/* 방 전체 자료를 한 덩어리로 정리합니다 — 종류별 건수, 기간, 눈여겨볼 계측값 수 */
function filesDigest(roomId) {
  var list = filesOf(roomId);
  var byTag = {}, order = [], flagged = 0, metrics = 0;
  list.forEach(function (f) {
    if (byTag[f.tag] == null) { byTag[f.tag] = 0; order.push(f.tag); }
    byTag[f.tag]++;
    metricsOf(f).forEach(function (m) {
      metrics++;
      if (m[2] === 'warn') flagged++;
    });
  });
  var days = list.map(function (f) { return f.when; });
  return {
    count: list.length,
    kinds: order.map(function (t) { return t + ' ' + byTag[t]; }).join(' · '),
    span: days.length ? (days[0] === days[days.length - 1] ? days[0] : days[0] + ' ~ ' + days[days.length - 1]) : '',
    metrics: metrics,
    flagged: flagged
  };
}

/* ── 협진 요약 ──────────────────────────────────────────────────
   대화가 끝나는 시점에 "어떻게 시작했고, 어떻게 진행됐고, 무엇이 오갔는지"를
   빠짐없이 짧게 정리합니다. 문장을 지어내지 않고 실제 대화에서 뽑아 씁니다 —
   ★로 표시한 의견이 결론이 되고, 주제·자료·기간은 세어서 채웁니다. */

function firstSentence(t, max) {
  t = String(t || '').trim();
  var cut = t.search(/[.!?。]\s|[.!?。]$/);
  if (cut > 0) t = t.slice(0, cut + 1);
  max = max || 60;
  return t.length > max ? t.slice(0, max - 1) + '…' : t;
}

function buildSummary(room) {
  var threads = [];
  var all = [];
  room.threads.forEach(function (t) {
    var ms = threadMsgs(room.id, t.id);
    if (!ms.length) return;
    var asked = ms[0];
    var answered = null;
    for (var i = ms.length - 1; i >= 0; i--) {
      if (ms[i].who !== asked.who) { answered = ms[i]; break; }
    }
    threads.push({
      label: t.label,
      count: ms.length,
      opened: firstSentence(asked.body, 72),
      openedBy: (PEOPLE[asked.who] || PEOPLE.han).name,
      closed: answered ? firstSentence(answered.body, 72) : '',
      closedBy: answered ? (PEOPLE[answered.who] || PEOPLE.han).name : '',
      waiting: !answered,
      files: ms.filter(function (m) { return m.img || m.file; }).length
    });
    ms.forEach(function (m) { all.push(m); });
  });

  var days = all.map(function (m) { return m.day; }).filter(Boolean);
  var starred = all.filter(function (m) { return m.star; }).map(function (m) {
    return { who: (PEOPLE[m.who] || PEOPLE.han).name, body: m.body };
  });
  var opener = all[0] || {};
  var calls = (S.callLog[room.id] || []);

  return {
    span: days.length ? (days.length > 1 ? days[0] + ' ~ ' + days[days.length - 1] : days[0]) : '기간 정보 없음',
    msgCount: all.length,
    members: memberKeys().map(function (k) { return PEOPLE[k].name; }),
    openedBy: (PEOPLE[opener.who] || PEOPLE.han).name,
    opened: firstSentence(opener.body, 90),
    threads: threads,
    starred: starred,
    calls: calls,
    files: filesDigest(room.id),
    pending: threads.filter(function (t) { return t.waiting; })
  };
}

function memberKeys() {
  var keys = BASE_MEMBERS.slice();
  Object.keys(S.joined).forEach(function (k) { if (keys.indexOf(k) < 0) keys.push(k); });
  return keys.filter(function (k) { return !S.removed[k]; });
}
/* 마지막 말이 내가 아니면 내 차례입니다. 홈과 목록이 같은 기준을 씁니다. */
function needsReply(r) {
  if (S.closed[r.id] || !live(r)) return false;
  var last = null;
  r.threads.forEach(function (t) {
    var ms = threadMsgs(r.id, t.id);
    if (ms.length) last = ms[ms.length - 1];
  });
  return !!last && last.who !== S.me && !last.system;
}

function live(r) {
  return !S.archived[r.id] && !S.trashed[r.id];
}
function tabCounts() {
  var list = pool();
  return {
    all: list.filter(live).length,
    open: list.filter(function (r) { return live(r) && !S.closed[r.id]; }).length,
    unread: list.filter(function (r) { return r.unread && live(r) && !S.closed[r.id]; }).length,
    closed: list.filter(function (r) { return S.closed[r.id] && live(r); }).length,
    archive: list.filter(function (r) { return S.archived[r.id] || S.trashed[r.id]; }).length
  };
}
function shownRooms() {
  var list = pool();
  if (S.tab === 'unread') return list.filter(function (r) { return r.unread && live(r) && !S.closed[r.id]; });
  if (S.tab === 'closed') return list.filter(function (r) { return S.closed[r.id] && live(r); });
  if (S.tab === 'archive') return list.filter(function (r) { return S.archived[r.id] || S.trashed[r.id]; });
  if (S.tab === 'all') return list.filter(live);
  return list.filter(function (r) { return live(r) && !S.closed[r.id]; });
}

/* 진료실 모니터는 환자가 봅니다. 앞 환자 이름이 다음 환자에게 보이면
   안 되므로 화면에 뜨는 환자 이름은 기본으로 가운데를 가립니다.
   규칙은 하나뿐입니다 — 띄어쓰기로 나눈 각 낱말의 가운데를 가린다.
   김성호 → 김*호,  남궁민수 → 남**수 */
/* 문의 이름은 단어 중간에서 자르지 않습니다.
   "어깨 회전근개 파열 의"처럼 끊기면 뜻이 상합니다. */
function shortLabel(title, max) {
  max = max || 14;
  var t = String(title || '').trim();
  if (Array.from(t).length <= max) return t;
  var out = '';
  var words = t.split(' ');
  for (var i = 0; i < words.length; i++) {
    if (!out) { out = words[i]; continue; }
    if (Array.from(out + ' ' + words[i]).length > max) break;
    out += ' ' + words[i];
  }
  return out || Array.from(t).slice(0, max).join('');
}

function maskWord(w) {
  var ch = Array.from(w);
  if (ch.length <= 1) return w;
  if (ch.length === 2) return ch[0] + '*';
  return ch[0] + new Array(ch.length - 1).join('*') + ch[ch.length - 1];
}
function maskName(name) {
  return String(name || '').split(' ').map(maskWord).join(' ');
}
/* 화면에 환자 이름을 쓸 때는 반드시 이걸로 씁니다.
   방마다 눈 아이콘으로 잠깐 풀 수 있고, 내 정보에서 아예 끌 수 있습니다. */
function pname(name, roomId) {
  if (!S.toggles.mask) return name;
  if (roomId && S.reveal[roomId]) return name;
  return maskName(name);
}

      + '<h1 class="t1" style="margin:0 0 6px">가입이 끝났습니다</h1>'
      + '<p class="t3" style="margin:0 0 20px;color:var(--ink-2);line-height:1.7">'
        + '한상호 원장이 초대한 환자 방 1개가 이미 준비되어 있습니다.</p>'
      + '<button type="button" class="btn btn--primary btn--lg" style="width:100%" data-act="onbDone">협진톡 시작하기</button>'
    + '</div>';
  }

  return '<div class="onb"><div class="onb__inner">'
    + '<div class="onb__steps">' + dots
      + '<span class="t5" style="margin-left:4px;color:var(--ink-3)">' + (step >= 4 ? '완료' : step + ' / 3') + '</span>'
    + '</div>' + body
    + '<p class="legal" style="text-align:center">' + esc('가입 후에도 환자 계정은 만들어지지 않습니다. 환자는 이 서비스를 사용하지 않습니다.') + '</p>'
  + '</div></div>';
}

/* ── 8. 운영자 ─────────────────────────────────────────────────── */

function badgeStyle(tone) {
  var map = {
    ok:     'color:var(--ok);background:var(--ok-soft)',
    warn:   'color:var(--warn);background:var(--warn-soft)',
    danger: 'color:var(--danger);background:var(--danger-soft)',
    accent: 'color:var(--accent-ink);background:var(--accent-soft)',
    plain:  'color:var(--ink-2);background:var(--canvas-2)'
  };
  return map[tone] || map.plain;
}

function adminUsageView() {
  var stats = ADMIN_STATS.map(function (s) {
    return '<div class="stat-card">'
      + '<div class="stat-card__label">' + esc(s[0]) + '</div>'
      + '<div class="stat-card__value">' + esc(s[1])
        + '<span style="font-size:var(--t4);font-weight:600;margin-left:3px">' + esc(s[2]) + '</span></div>'
      + '<div class="stat-card__delta" style="color:' + s[4] + '">' + esc(s[3]) + '</div>'
    + '</div>';
  }).join('');

  var bars = ADMIN_BARS.map(function (b) {
    return '<div class="bars__col">'
      + '<div class="' + cls('bars__bar', b[1] > 80 && 'is-high') + '" style="height:' + b[1] + 'px"></div>'
      + '<span class="t5" style="color:var(--ink-3);font-weight:500;letter-spacing:0">' + esc(b[0]) + '</span>'
    + '</div>';
  }).join('');

  var users = ADMIN_USERS.map(function (u) {
    return '<div class="table__row cols-users">'
      + '<div class="truncate"><span class="t3-strong">' + esc(u[0]) + '</span>'
        + '<span class="t5" style="display:block;font-weight:500;letter-spacing:0;color:var(--ink-3)">' + esc(u[1]) + '</span></div>'
      + '<div class="num">' + esc(u[2]) + '</div>'
      + '<div class="num">' + esc(u[3]) + '</div>'
      + '<div class="truncate">' + esc(u[4]) + '</div>'
      + '<div><span class="badge" style="' + badgeStyle(u[6]) + '">' + esc(u[5]) + '</span></div>'
    + '</div>';
  }).join('');

  return '<h2 class="sec-label" style="margin-top:0">이번 주 사용 현황</h2>'
    + '<div class="stat-grid">' + stats + '</div>'
    + '<h2 class="sec-label">요일별 메시지 수</h2>'
    + '<div style="background:var(--surface);border-radius:var(--r-lg);padding:var(--s8);box-shadow:var(--sh-card)">'
      + '<div class="bars">' + bars + '</div></div>'
    + '<h2 class="sec-label">의사별 활동</h2>'
    + '<div class="table-scroll"><div class="table">'
      + '<div class="table__head cols-users"><div>의사</div><div>방</div><div>메시지</div><div>평균 응답</div><div>상태</div></div>'
      + users
    + '</div></div>';
}

function adminAuditView() {
  var filters = [['all','전체'],['view','열람'],['download','다운로드'],['call','통화'],['delete','삭제']].map(function (f) {
    return '<button type="button" class="' + cls('chip-sq', S.auditF === f[0] && 'is-active') + '"'
      + ' data-act="auditF" data-arg="' + f[0] + '"'
      + ' aria-pressed="' + (S.auditF === f[0]) + '">' + esc(f[1]) + '</button>';
  }).join('');

  var rows = AUDIT_ROWS.filter(function (r) {
    return S.auditF === 'all' || r[5] === S.auditF;
  }).map(function (r) {
    var tone = r[5] === 'delete' ? 'danger' : (r[5] === 'download' ? 'warn' : (r[5] === 'admin' ? 'accent' : 'plain'));
    return '<div class="table__row cols-audit">'
      + '<div class="t4 num" style="color:var(--ink-3)">' + esc(r[0]) + '</div>'
      + '<div class="truncate">' + esc(r[1]) + '</div>'
      + '<div><span class="badge" style="' + badgeStyle(tone) + '">' + esc(r[2]) + '</span></div>'
      + '<div class="truncate">' + esc(r[3]) + '</div>'
      + '<div class="t4 truncate" style="color:var(--ink-3)">' + esc(r[4]) + '</div>'
    + '</div>';
  }).join('');

  return '<div class="notice" style="margin-bottom:var(--s7)">'
      + '환자 자료 열람·다운로드·삭제는 모두 기록됩니다. 로그는 수정할 수 없고 3년간 보관됩니다.</div>'
    + '<div class="row" style="gap:var(--s2);margin-bottom:var(--s5);flex-wrap:wrap">' + filters + '</div>'
    + '<div class="table-scroll"><div class="table">'
      + '<div class="table__head cols-audit"><div>시각</div><div>행위자</div><div>행위</div><div>대상</div><div>기기</div></div>'
      + (rows || '<div class="empty-state"><div class="empty-state__title">해당하는 기록이 없습니다</div>'
          + '<div class="empty-state__body">다른 필터를 선택해 보세요</div></div>')
    + '</div></div>';
}

function adminMembersView() {
  var rows = MEMBER_ROWS.map(function (m) {
    var tone = m[6] === 'ok' ? 'ok' : (m[6] === 'warn' ? 'danger' : 'warn');
    var action = m[6] === 'pending' ? '재발송' : (m[6] === 'warn' ? '정지 해제' : '정지');
    return '<div class="room-row" style="align-items:center;margin-bottom:0;border-bottom:1px solid var(--canvas-2);border-radius:0">'
      + avatar(m[0], m[4])
      + '<div class="grow truncate">'
        + '<div class="t3-strong truncate">' + esc(m[1]) + '</div>'
        + '<div class="t4 truncate">' + esc(m[2]) + ' · 면허 ' + esc(m[3]) + '</div>'
      + '</div>'
      + '<span class="badge" style="flex:none;' + badgeStyle(tone) + '">' + esc(m[5]) + '</span>'
      + '<button type="button" class="btn btn--quiet" style="flex:none" data-act="noop">' + esc(action) + '</button>'
    + '</div>';
  }).join('');

  return '<div class="row" style="justify-content:space-between;margin-bottom:var(--s5)">'

      + '<button type="button" class="btn btn--primary" data-act="goOnboard">' + ic('plus', 18) + '새 의사 초대</button>'
    + '</div>'
    + '<div style="background:var(--surface);border-radius:var(--r-lg);padding:0 var(--s6);box-shadow:var(--sh-card)">'
      + rows + '</div>';

function adminView() {
  var tabs = [['usage','사용 현황'],['audit','감사 로그'],['members','의사 관리']].map(function (t) {
    return '<button type="button" class="' + cls('chip-sq', S.adminTab === t[0] && 'is-active') + '"'
      + ' data-act="adminTab" data-arg="' + t[0] + '" aria-pressed="' + (S.adminTab === t[0]) + '">'
      + esc(t[1]) + '</button>';
  }).join('');

  var body = S.adminTab === 'audit' ? adminAuditView()
    : (S.adminTab === 'members' ? adminMembersView() : adminUsageView());

  return '<div class="admin">'
    + '<div class="admin__bar">'
      + '<div class="logo" aria-hidden="true">협</div>'
      + '<div class="grow"><div class="t2">운영자</div>'
        + '<div class="t4">협진톡 · 초대 전용 폐쇄형 서비스</div></div>'
      + '<div class="row" style="gap:var(--s2)">' + tabs + '</div>'
      + '<button type="button" class="btn btn--quiet" data-act="goApp">앱으로 돌아가기</button>'
    + '</div>'
    + '<div class="admin__body"><div class="admin__inner">' + body + '</div></div>'
  + '</div>';
